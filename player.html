<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSW-Arcade Neo Geo Player</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050508;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #fff;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game canvas {
      image-rendering: pixelated;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #0b0f19 0%, #030407 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10000;
      transition: opacity 0.4s ease;
    }

    .neo-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 240, 255, 0.15);
      border-top-color: #00f0ff;
      border-right-color: #ff0055;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00f0ff;
      text-transform: uppercase;
    }

    .loading-sub {
      font-size: 11px;
      color: #94a3b8;
    }

    .loading-badge {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 4px;
      font-size: 10px;
      color: #38bdf8;
    }

    #error-msg {
      display: none;
      color: #ef4444;
      font-size: 11px;
      max-width: 80%;
      text-align: center;
    }

    /* Masquage absolu et suppression des doublons de gamepad virtuel EmulatorJS */
    .ejs_virtualGamepad_parent,
    .ejs_virtualGamepad,
    [class*="ejs_virtualGamepad"],
    [class*="virtualGamepad"],
    [id*="ejs_virtualGamepad"],
    [id*="virtualGamepad"],
    .nipple,
    [class*="nipple"],
    [id*="nipple"],
    .ejs_touch,
    [class*="ejs_touch"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      position: absolute !important;
      left: -9999px !important;
      top: -9999px !important;
      transform: scale(0) !important;
    }
  </style>
</head>
<body>

    // Parsing des paramètres passés par CSW-Arcade
    const params = new URLSearchParams(window.location.search);
    const rawGame = params.get('game') || 'androdunos.zip';

    let activeSettings = {};
    try {
      const sParam = params.get('settings');
      if (sParam) {
        activeSettings = JSON.parse(decodeURIComponent(sParam));
      } else {
        const stored = localStorage.getItem('csw_arcade_settings_v1');
        if (stored) activeSettings = JSON.parse(stored);
      }
    } catch(e) {
      console.warn('[Player] Échec parsing settings:', e);
    }

    // Dictionnaire exhaustif de conversion KeyboardEvent.code -> numeric keyCode
    const CODE_TO_KEYCODE = {
      KeyA: 65, KeyB: 66, KeyC: 67, KeyD: 68, KeyE: 69, KeyF: 70, KeyG: 71, KeyH: 72,
      KeyI: 73, KeyJ: 74, KeyK: 75, KeyL: 76, KeyM: 77, KeyN: 78, KeyO: 79, KeyP: 80,
      KeyQ: 81, KeyR: 82, KeyS: 83, KeyT: 84, KeyU: 85, KeyV: 86, KeyW: 87, KeyX: 88,
      KeyY: 89, KeyZ: 90,
      Digit0: 48, Digit1: 49, Digit2: 50, Digit3: 51, Digit4: 52, Digit5: 53,
      Digit6: 54, Digit7: 55, Digit8: 56, Digit9: 57,
      Numpad0: 96, Numpad1: 97, Numpad2: 98, Numpad3: 99, Numpad4: 100,
      Numpad5: 101, Numpad6: 102, Numpad7: 103, Numpad8: 104, Numpad9: 105,
      ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40,
      Space: 32, Enter: 13, Tab: 9, Escape: 27, Backspace: 8,
      ShiftLeft: 16, ShiftRight: 16, ControlLeft: 17, ControlRight: 17, AltLeft: 18, AltRight: 18
    };

    function getKeyCode(code, fallback) {
      if (typeof code === 'number') return code;
      if (!code) return fallback;
      return CODE_TO_KEYCODE[code] || fallback;
    }

    // Construction de la configuration de contrôles RetroArch / EmulatorJS
    // Pour Neo Geo FBNeo:
    // 0 = RetroPad B -> Neo Geo Bouton A
    // 8 = RetroPad A -> Neo Geo Bouton B
    // 1 = RetroPad Y -> Neo Geo Bouton C
    // 9 = RetroPad X -> Neo Geo Bouton D
    // 4 = HAUT, 5 = BAS, 6 = GAUCHE, 7 = DROITE
    // 2 = SELECT (Coin/Crédit), 3 = START
    function buildControllersConfig(controls) {
      const p1 = controls?.p1 || {};
      const p2 = controls?.p2 || {};

      return {
        0: {
          4: { value: getKeyCode(p1.up, 87), value2: "DPAD_UP" },      // W
          5: { value: getKeyCode(p1.down, 83), value2: "DPAD_DOWN" },    // S
          6: { value: getKeyCode(p1.left, 65), value2: "DPAD_LEFT" },    // A
          7: { value: getKeyCode(p1.right, 68), value2: "DPAD_RIGHT" },  // D
          0: { value: getKeyCode(p1.a, 74), value2: "BUTTON_2" },        // J -> Neo Geo Bouton A
          8: { value: getKeyCode(p1.b, 75), value2: "BUTTON_1" },        // K -> Neo Geo Bouton B
          1: { value: getKeyCode(p1.c, 85), value2: "BUTTON_4" },        // U -> Neo Geo Bouton C
          9: { value: getKeyCode(p1.d, 73), value2: "BUTTON_3" },        // I -> Neo Geo Bouton D
          2: { value: getKeyCode(p1.coin, 53), value2: "SELECT" },       // 5 -> Coin / Crédit
          3: { value: getKeyCode(p1.start, 49), value2: "START" }        // 1 -> Start
        },
        1: {
          4: { value: getKeyCode(p2.up, 38), value2: "DPAD_UP" },        // Flèche Haut
          5: { value: getKeyCode(p2.down, 40), value2: "DPAD_DOWN" },    // Flèche Bas
          6: { value: getKeyCode(p2.left, 37), value2: "DPAD_LEFT" },    // Flèche Gauche
          7: { value: getKeyCode(p2.right, 39), value2: "DPAD_RIGHT" },  // Flèche Droite
          0: { value: getKeyCode(p2.a, 100), value2: "BUTTON_2" },       // Numpad 4 -> Bouton A
          8: { value: getKeyCode(p2.b, 101), value2: "BUTTON_1" },       // Numpad 5 -> Bouton B
          1: { value: getKeyCode(p2.c, 103), value2: "BUTTON_4" },       // Numpad 7 -> Bouton C
          9: { value: getKeyCode(p2.d, 104), value2: "BUTTON_3" },       // Numpad 8 -> Bouton D
          2: { value: getKeyCode(p2.coin, 54), value2: "SELECT" },       // 6 -> Coin
          3: { value: getKeyCode(p2.start, 50), value2: "START" }        // 2 -> Start
        },
        2: {},
        3: {}
      };
    }

    // Construction des options système RetroArch FBNeo (MVS vs AES et Région)
    function buildCoreOptions(system) {
      const isAes = system?.biosMode === 'aes';
      const region = system?.region || 'europe';

      let modeVal = isAes ? 'AES Europe/Asia' : 'MVS Europe';
      if (region === 'japan') {
        modeVal = isAes ? 'AES Japan' : 'MVS Japan';
      } else if (region === 'usa') {
        modeVal = isAes ? 'AES USA' : 'MVS USA';
      }

      return {
        'fbneo-neogeo-mode': modeVal,
        'fbneo-cpu-speed-adjust': '100',
        'fbneo-diagnostic-input': 'Hold Start'
      };
    }

    // --- PILOTE D'INPUTS DIRECT & UNIVERSEL CSW-ARCADE ---
    // RetroPad IDs pour le core FBNeo Neo Geo:
    // 0: Neo Geo Bouton A (Poing Faible)
    // 8: Neo Geo Bouton B (Pied Faible)
    // 1: Neo Geo Bouton C (Poing Fort)
    // 9: Neo Geo Bouton D (Pied Fort)
    // 2: Coin / Crédit (Select)
    // 3: Start
    // 4: Haut, 5: Bas, 6: Gauche, 7: Droite

    const ACTION_TO_RETROPAD = {
      a: 0,
      b: 8,
      c: 1,
      d: 9,
      coin: 2,
      start: 3,
      up: 4,
      down: 5,
      left: 6,
      right: 7
    };

    let keyToInputMap = {};

    function rebuildKeyMap(controls) {
      keyToInputMap = {};
      const p1 = controls?.p1 || {};
      const p2 = controls?.p2 || {};

      for (const [action, btnId] of Object.entries(ACTION_TO_RETROPAD)) {
        if (p1[action]) {
          keyToInputMap[p1[action]] = { player: 0, buttonId: btnId };
        }
        if (p2[action]) {
          keyToInputMap[p2[action]] = { player: 1, buttonId: btnId };
        }
      }
    }

    rebuildKeyMap(activeSettings.controls);

    function dispatchDirectInput(player, buttonId, isPressed) {
      if (window.EJS_emulator?.gameManager?.simulateInput) {
        window.EJS_emulator.gameManager.simulateInput(player, buttonId, isPressed ? 1 : 0);
      }
    }

    function handleDirectKey(code, keyCode, isDown) {
      const binding = keyToInputMap[code];
      if (binding) {
        dispatchDirectInput(binding.player, binding.buttonId, isDown);
        return true;
      }
      return false;
    }

    window.addEventListener('keydown', (e) => {
      if (handleDirectKey(e.code, e.keyCode, true)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (handleDirectKey(e.code, e.keyCode, false)) {
        e.preventDefault();
      }
    });

    // Boucle de polling Gamepad 60 FPS
    const lastGamepadState = { 0: {}, 1: {} };

    function pollGamepadsLoop() {
      if (window.EJS_emulator?.gameManager?.simulateInput && navigator.getGamepads) {
        const gamepads = navigator.getGamepads();
        const p1Idx = activeSettings.gamepad?.p1Index ?? 0;
        const p2Idx = activeSettings.gamepad?.p2Index ?? 1;
        const p1Gp = gamepads[p1Idx] || null;
        const p2Gp = gamepads[p2Idx] || null;

        const processPad = (gp, playerIdx) => {
          if (!gp || !gp.connected) return;
          const buttons = gp.buttons;
          const axes = gp.axes;

          const checkBtn = (btnId, isPressed) => {
            const prev = !!lastGamepadState[playerIdx][btnId];
            if (prev !== isPressed) {
              lastGamepadState[playerIdx][btnId] = isPressed;
              dispatchDirectInput(playerIdx, btnId, isPressed);
            }
          };

          // D-Pad + Analog Stick selon le mode (both / dpad / analog)
          const dpadMode = activeSettings.gamepad?.dpadMode || 'both';
          const useDpad = dpadMode === 'both' || dpadMode === 'dpad';
          const useAnalog = dpadMode === 'both' || dpadMode === 'analog';

          const up = (useDpad && !!buttons[12]?.pressed) || (useAnalog && axes[1] < -0.4);
          const down = (useDpad && !!buttons[13]?.pressed) || (useAnalog && axes[1] > 0.4);
          const left = (useDpad && !!buttons[14]?.pressed) || (useAnalog && axes[0] < -0.4);
          const right = (useDpad && !!buttons[15]?.pressed) || (useAnalog && axes[0] > 0.4);

          checkBtn(4, up);
          checkBtn(5, down);
          checkBtn(6, left);
          checkBtn(7, right);

          // Boutons Neo Geo configurés ou standards
          const custom = activeSettings.gamepad?.buttons || {};
          const btnAIdx = custom.a ?? 0;
          const btnBIdx = custom.b ?? 1;
          const btnCIdx = custom.c ?? 2;
          const btnDIdx = custom.d ?? 3;
          const coinIdx = custom.coin ?? 8;
          const startIdx = custom.start ?? 9;

          checkBtn(0, !!buttons[btnAIdx]?.pressed); // Bouton A (RetroPad B: 0)
          checkBtn(8, !!buttons[btnBIdx]?.pressed); // Bouton B (RetroPad A: 8)
          checkBtn(1, !!buttons[btnCIdx]?.pressed); // Bouton C (RetroPad Y: 1)
          checkBtn(9, !!buttons[btnDIdx]?.pressed); // Bouton D (RetroPad X: 9)
          checkBtn(2, !!buttons[coinIdx]?.pressed || !!buttons[8]?.pressed); // Coin (Select)
          checkBtn(3, !!buttons[startIdx]?.pressed || !!buttons[9]?.pressed); // Start
        };

        if (p1Gp) processPad(p1Gp, 0);
        if (p2Gp && p2Idx !== p1Idx) processPad(p2Gp, 1);
      }

      requestAnimationFrame(pollGamepadsLoop);
    }
    requestAnimationFrame(pollGamepadsLoop);

    // Contrôle direct de l'affichage vidéo (Résolution, Format & Filtres)
    function applyDirectVideoStyles(video) {
      if (!video) return;
      const canvas = document.querySelector('#game canvas');
      if (!canvas) return;

      canvas.style.imageRendering = video.filter === 'smooth' ? 'auto' : 'pixelated';

      const ratio = video.aspectRatio || '4:3';
      if (ratio === '16:9') {
        canvas.style.setProperty('width', '100%', 'important');
        canvas.style.setProperty('height', '100%', 'important');
        canvas.style.setProperty('max-width', '100%', 'important');
        canvas.style.setProperty('max-height', '100%', 'important');
        canvas.style.setProperty('object-fit', 'fill', 'important');
      } else if (ratio === 'pixel-perfect') {
        canvas.style.setProperty('width', '640px', 'important');
        canvas.style.setProperty('height', '448px', 'important');
        canvas.style.setProperty('max-width', 'none', 'important');
        canvas.style.setProperty('max-height', 'none', 'important');
        canvas.style.setProperty('object-fit', 'contain', 'important');
      } else {
        canvas.style.setProperty('width', 'auto', 'important');
        canvas.style.setProperty('height', '100%', 'important');
        canvas.style.setProperty('max-width', '100%', 'important');
        canvas.style.setProperty('max-height', '100%', 'important');
        canvas.style.setProperty('aspect-ratio', '4/3', 'important');
        canvas.style.setProperty('object-fit', 'contain', 'important');
      }
    }

    // Application des paramètres en direct
    function applyLiveSettings(settings) {
      if (!settings) return;
      activeSettings = settings;

      // 1. Audio
      if (settings.audio && window.EJS_emulator) {
        const isMuted = !!settings.audio.muted;
        const targetVol = isMuted ? 0 : ((settings.audio.volume ?? 85) / 100);
        window.EJS_emulator.muted = isMuted;
        if (typeof window.EJS_emulator.setVolume === 'function') {
          window.EJS_emulator.setVolume(targetVol);
        }
      }

      // 2. Filtre vidéo & Résolution
      applyDirectVideoStyles(settings.video);

      // 3. Contrôles clavier
      if (settings.controls) {
        rebuildKeyMap(settings.controls);
        const newControls = buildControllersConfig(settings.controls);
        if (window.EJS_emulator) {
          window.EJS_emulator.controls = newControls;
          window.EJS_emulator.defaultControllers = newControls;
          if (typeof window.EJS_emulator.setupKeys === 'function') {
            window.EJS_emulator.setupKeys();
          }
        }
      }

      // 4. Système & BIOS (MVS vs AES / Région)
      if (settings.system && window.EJS_emulator?.gameManager?.setVariable) {
        const coreOptions = buildCoreOptions(settings.system);
        for (const [key, val] of Object.entries(coreOptions)) {
          try {
            window.EJS_emulator.gameManager.setVariable(key, val);
          } catch(e) {}
        }
      }
    }

    // Résolution du nom standard FBNeo
    const cleanInput = rawGame.replace(/\.(zip|bin|dat|rom)$/i, '').toLowerCase();
    const fbneoShortName = FBNEO_MVS_MAP[cleanInput] || cleanInput;
    const targetZipName = fbneoShortName + '.zip';

    const overlay = document.getElementById('loading-overlay');
    const loadingDesc = document.getElementById('loading-desc');
    const errorMsg = document.getElementById('error-msg');
    const gameBadge = document.getElementById('game-badge');
    gameBadge.innerText = fbneoShortName.toUpperCase() + (activeSettings.system?.biosMode === 'aes' ? ' (AES CONSOLE)' : ' (MVS ARCADE)');

    let neogeoBytes = null;
    let romBytes = null;

    // --- GESTION DU STOCKAGE PERSISTANT LOCAL (IndexedDB) ---
    const IDB_NAME = 'csw_arcade_roms_db';
    const IDB_STORE = 'rom_archives';

    function getRomFromIDB(filename) {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE, { keyPath: 'id' });
            }
          };
          req.onsuccess = () => {
            const db = req.result;
            const tx = db.transaction(IDB_STORE, 'readonly');
            const store = tx.objectStore(IDB_STORE);
            const getReq = store.get(filename.toLowerCase());
            getReq.onsuccess = () => {
              if (getReq.result && getReq.result.data) {
                const data = getReq.result.data;
                const u8 = new Uint8Array(data);
                // Validation stricte du header ZIP (PK) et de la taille
                if (u8.length > 5000 && u8[0] === 0x50 && u8[1] === 0x4B) {
                  console.log(`[Player IDB] ROM ${filename} trouvée et valide en cache local IndexedDB (${getReq.result.size} octets)`);
                  resolve(data);
                  return;
                } else {
                  console.warn(`[Player IDB] Données corrompues ou redirection HTML détectée pour ${filename}, purge du cache.`);
                  try {
                    const delTx = db.transaction(IDB_STORE, 'readwrite');
                    delTx.objectStore(IDB_STORE).delete(filename.toLowerCase());
                  } catch(e) {}
                }
              }
              resolve(null);
            };
            getReq.onerror = () => resolve(null);
          };
          req.onerror = () => resolve(null);
        } catch(e) {
          resolve(null);
        }
      });
    }

    function saveRomToIDB(filename, buffer) {
      try {
        const u8 = new Uint8Array(buffer.buffer || buffer);
        // Ne jamais sauvegarder du HTML ou des fichiers invalides
        if (u8.length < 5000 || u8[0] !== 0x50 || u8[1] !== 0x4B) {
          console.warn(`[Player IDB] Refus de sauvegarder ${filename}: buffer non-ZIP invalide`);
          return;
        }

        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => {
          const db = req.result;
          const tx = db.transaction(IDB_STORE, 'readwrite');
          const store = tx.objectStore(IDB_STORE);
          const arrayBuffer = buffer.buffer ? buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength) : buffer;
          store.put({
            id: filename.toLowerCase(),
            filename: filename.toLowerCase(),
            data: arrayBuffer,
            size: arrayBuffer.byteLength,
            savedAt: Date.now()
          });
          console.log(`[Player IDB] ROM ${filename} enregistrée dans le stockage local IndexedDB !`);
        };
      } catch(e) {}
    }

    // Fonction de téléchargement résiliente multi-sources (Proxy Netlify, Local Vite, Miroir Archive.org)
    async function fetchBinaryWithFallbacks(name, candidates, onProgressText) {
      let lastErr = null;
      for (const url of candidates) {
        try {
          if (onProgressText) loadingDesc.innerText = onProgressText + ` (${url.startsWith('http') ? 'Cloud' : (url.includes('archive') ? 'Archive.org' : 'Serveur')})...`;
          const res = await fetch(url);
          if (res.ok) {
            const contentType = res.headers.get('content-type') || '';
            // Rejet catégorique des redirections SPA Netlify qui renvoient du HTML au lieu d'un binaire
            if (contentType.includes('text/html')) {
              console.warn(`[CSW-Arcade] ${url} a retourné du HTML (redirection SPA Netlify 404 ignorée)`);
              continue;
            }

            const buf = await res.arrayBuffer();
            if (buf && buf.byteLength > 5000) {
              const u8 = new Uint8Array(buf);
              // Vérification du Header magique ZIP 'PK' (0x50, 0x4B)
              if (u8[0] !== 0x50 || u8[1] !== 0x4B) {
                console.warn(`[CSW-Arcade] ${url} n'est pas une archive ZIP valide (en-tête invalide)`);
                continue;
              }
              console.log(`[CSW-Arcade] ${name} chargé avec succès depuis: ${url} (${buf.byteLength} octets)`);
              return buf;
            }
          }
        } catch (e) {
          lastErr = e;
          console.warn(`[CSW-Arcade] Échec source ${url} pour ${name}:`, e.message);
        }
      }
      throw new Error(`Impossible de charger ${name}.`);
    }

    // Pré-chargement asynchrone bloquant AVANT initialisation du runtime WASM
    async function preloadAssetsAndBoot() {
      try {
        loadingDesc.innerText = `Recherche de ${targetZipName} dans le stockage local...`;

        const electronApi = window.electronAPI || (window.parent && window.parent.electronAPI);

        // 1. Vérification du BIOS (Electron IPC, IndexedDB ou Réseau)
        let biosBuffer = null;
        if (electronApi && typeof electronApi.readRom === 'function') {
          try {
            const res = await electronApi.readRom('neogeo.zip');
            if (res && res.success && res.data) {
              const u8 = new Uint8Array(res.data);
              if (u8.length > 5000 && u8[0] === 0x50 && u8[1] === 0x4B) {
                biosBuffer = res.data;
                console.log('[CSW-Arcade] BIOS Neo Geo chargé directement via Electron IPC');
              } else {
                console.warn('[CSW-Arcade] IPC a renvoyé des données non-ZIP pour le BIOS, passage aux sources Web');
              }
            }
          } catch (e) {
            console.warn('[CSW-Arcade] Échec lecture BIOS via IPC:', e.message);
          }
        }

        if (!biosBuffer) {
          biosBuffer = await getRomFromIDB('neogeo.zip');
        }

        if (!biosBuffer) {
          const biosCandidates = [
            './roms/neogeo.zip',
            '/roms/neogeo.zip',
            '/api/rom-data/neogeo',
            '/api/archive-rom/NeoGeoRomCollectionByGhostware/neogeo.zip',
            'https://archive.org/download/NeoGeoRomCollectionByGhostware/neogeo.zip'
          ];
          biosBuffer = await fetchBinaryWithFallbacks('BIOS Neo Geo (neogeo.zip)', biosCandidates, 'Synchronisation du BIOS Neo Geo');
          saveRomToIDB('neogeo.zip', biosBuffer);
        } else {
          console.log('[CSW-Arcade] BIOS Neo Geo prêt');
        }

        // 2. Vérification de la ROM (Electron IPC, IndexedDB ou Réseau)
        let romBuffer = null;
        if (electronApi && typeof electronApi.readRom === 'function') {
          try {
            let res = await electronApi.readRom(targetZipName);
            if (!res?.success && cleanInput !== fbneoShortName) {
              res = await electronApi.readRom(cleanInput + '.zip');
            }
            if (res && res.success && res.data) {
              const u8 = new Uint8Array(res.data);
              if (u8.length > 5000 && u8[0] === 0x50 && u8[1] === 0x4B) {
                romBuffer = res.data;
                console.log(`[CSW-Arcade] ROM ${targetZipName} chargée directement via Electron IPC`);
              } else {
                console.warn(`[CSW-Arcade] IPC a renvoyé des données non-ZIP pour ${targetZipName}, passage aux sources Web`);
              }
            }
          } catch (e) {
            console.warn('[CSW-Arcade] Échec lecture ROM via IPC:', e.message);
          }
        }

        if (!romBuffer) {
          romBuffer = await getRomFromIDB(targetZipName);
          if (!romBuffer && fbneoShortName !== cleanInput) {
            romBuffer = await getRomFromIDB(cleanInput + '.zip');
          }
        }

        if (!romBuffer) {
          const romCandidates = [
            './roms/' + encodeURIComponent(targetZipName),
            '/roms/' + encodeURIComponent(targetZipName),
            '/api/rom-data/' + encodeURIComponent(fbneoShortName),
            '/api/archive-rom/neo-geo-mvs-romset/' + encodeURIComponent(targetZipName),
            '/api/archive-rom/NeoGeoRomCollectionByGhostware/' + encodeURIComponent(targetZipName),
            'https://archive.org/download/neo-geo-mvs-romset/' + encodeURIComponent(targetZipName)
          ];
          romBuffer = await fetchBinaryWithFallbacks(`ROM ${targetZipName}`, romCandidates, `Téléchargement de ${fbneoShortName.toUpperCase()}`);
          
          // Sauvegarde automatique et persistante dans IndexedDB
          saveRomToIDB(targetZipName, romBuffer);
          saveRomToIDB(cleanInput + '.zip', romBuffer);
        } else {
          console.log(`[CSW-Arcade] ROM ${targetZipName} prête`);
        }

        neogeoBytes = new Uint8Array(biosBuffer);
        romBytes = new Uint8Array(romBuffer);

        if (window.parent) {
          window.parent.postMessage({ type: 'ROM_DOWNLOADED', filename: targetZipName, game: rawGame, shortName: fbneoShortName }, '*');
        }

        console.log(`[VFS Preload] BIOS: ${neogeoBytes.length} octets | ROM: ${romBytes.length} octets`);
        loadingDesc.innerText = 'Démarrage du Core WebAssembly FBNeo...';

        startEmulatorJS();
      } catch (err) {
        console.error('[CSW-Arcade] Erreur préchargement VFS:', err);
        errorMsg.style.display = 'block';
        errorMsg.innerText = 'Erreur: ' + err.message;
      }
    }

    function startEmulatorJS() {
      const initialVol = activeSettings.audio?.muted ? 0 : ((activeSettings.audio?.volume ?? 85) / 100);

      // 1. Interception transparente de fetch pour servir romBytes et neogeoBytes directement en mémoire
      const _origFetch = window.fetch;
      window.fetch = async function(input, init) {
        const url = (typeof input === 'string' ? input : (input?.url || '')).toLowerCase();

        if (romBytes && (url.includes(targetZipName.toLowerCase()) || url.includes(fbneoShortName.toLowerCase()))) {
          console.log('[Fetch Interceptor] Service direct en mémoire pour la ROM:', targetZipName);
          const buf = romBytes.buffer.slice(romBytes.byteOffset, romBytes.byteOffset + romBytes.byteLength);
          return new Response(buf, {
            status: 200,
            statusText: 'OK',
            headers: {
              'Content-Type': 'application/zip',
              'Content-Length': String(romBytes.byteLength)
            }
          });
        }

        if (neogeoBytes && url.includes('neogeo.zip')) {
          console.log('[Fetch Interceptor] Service direct en mémoire pour le BIOS: neogeo.zip');
          const buf = neogeoBytes.buffer.slice(neogeoBytes.byteOffset, neogeoBytes.byteOffset + neogeoBytes.byteLength);
          return new Response(buf, {
            status: 200,
            statusText: 'OK',
            headers: {
              'Content-Type': 'application/zip',
              'Content-Length': String(neogeoBytes.byteLength)
            }
          });
        }

        return _origFetch.apply(window, arguments);
      };

      // 2. Interception transparente de XHR comme secours avec support complet des en-têtes
      const _origXHROpen = XMLHttpRequest.prototype.open;
      const _origXHRSend = XMLHttpRequest.prototype.send;

      XMLHttpRequest.prototype.open = function(method, url, ...rest) {
        this._reqUrl = url ? String(url) : '';
        return _origXHROpen.apply(this, [method, url, ...rest]);
      };

      XMLHttpRequest.prototype.send = function(...args) {
        const url = (this._reqUrl || '').toLowerCase();

        if (romBytes && (url.includes(targetZipName.toLowerCase()) || url.includes(fbneoShortName.toLowerCase()))) {
          console.log('[XHR Interceptor] Service direct en mémoire pour la ROM:', targetZipName);
          const buf = romBytes.buffer.slice(romBytes.byteOffset, romBytes.byteOffset + romBytes.byteLength);
          Object.defineProperty(this, 'status', { get: () => 200 });
          Object.defineProperty(this, 'statusText', { get: () => 'OK' });
          Object.defineProperty(this, 'response', { get: () => buf });
          Object.defineProperty(this, 'readyState', { get: () => 4 });
          this.getResponseHeader = (header) => {
            if (header && header.toLowerCase() === 'content-length') return String(buf.byteLength);
            if (header && header.toLowerCase() === 'content-type') return 'application/zip';
            return null;
          };
          this.getAllResponseHeaders = () => 'content-type: application/zip\r\ncontent-length: ' + buf.byteLength + '\r\n';
          setTimeout(() => {
            if (typeof this.onload === 'function') this.onload();
            this.dispatchEvent(new Event('load'));
            this.dispatchEvent(new Event('loadend'));
          }, 5);
          return;
        }

        if (neogeoBytes && url.includes('neogeo.zip')) {
          console.log('[XHR Interceptor] Service direct en mémoire pour le BIOS: neogeo.zip');
          const buf = neogeoBytes.buffer.slice(neogeoBytes.byteOffset, neogeoBytes.byteOffset + neogeoBytes.byteLength);
          Object.defineProperty(this, 'status', { get: () => 200 });
          Object.defineProperty(this, 'statusText', { get: () => 'OK' });
          Object.defineProperty(this, 'response', { get: () => buf });
          Object.defineProperty(this, 'readyState', { get: () => 4 });
          this.getResponseHeader = (header) => {
            if (header && header.toLowerCase() === 'content-length') return String(buf.byteLength);
            if (header && header.toLowerCase() === 'content-type') return 'application/zip';
            return null;
          };
          this.getAllResponseHeaders = () => 'content-type: application/zip\r\ncontent-length: ' + buf.byteLength + '\r\n';
          setTimeout(() => {
            if (typeof this.onload === 'function') this.onload();
            this.dispatchEvent(new Event('load'));
            this.dispatchEvent(new Event('loadend'));
          }, 5);
          return;
        }

        return _origXHRSend.apply(this, args);
      };

      // Configuration officielle EmulatorJS avec nom de fichier strict et BIOS Arcade
      window.EJS_player = '#game';
      window.EJS_core = 'arcade';
      window.EJS_gameName = fbneoShortName.toUpperCase();
      window.EJS_gameUrl = targetZipName;
      window.EJS_biosUrl = 'neogeo.zip';
      window.EJS_dontExtractBIOS = true;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_volume = initialVol;
      window.EJS_color = '#00f0ff';
      window.EJS_alignStartButton = 'center';

      // Application des contrôles personnalisés CSW-Arcade
      window.EJS_defaultControls = buildControllersConfig(activeSettings.controls);
      window.EJS_defaultOptions = buildCoreOptions(activeSettings.system);

      // Désactiver le gamepad virtuel EmulatorJS pour éviter tout doublon avec le TouchOverlay CSW
      window.EJS_VirtualGamepadSettings = [
        { type: 'button', text: '', id: 'csw_hidden', location: 'left', left: -9999, top: -9999, input_value: 999 }
      ];

      // Nettoyeur actif anti-doublon d'éléments tactiles EmulatorJS
      const purgeBuiltInGamepad = () => {
        try {
          const badElements = document.querySelectorAll(
            '.ejs_virtualGamepad_parent, .nipple, [class*="ejs_virtualGamepad"], [class*="virtualGamepad"], [id*="nipple"]'
          );
          badElements.forEach(el => {
            el.style.display = 'none';
            el.remove();
          });
        } catch(e) {}
      };
      purgeBuiltInGamepad();
      const purgeObserver = new MutationObserver(purgeBuiltInGamepad);
      purgeObserver.observe(document.body, { childList: true, subtree: true });

      window.EJS_ready = () => {
        console.log('[VFS Injection] EJS_ready reçu, interception synchrone startGame...');
        const emu = window.EJS_emulator;
        if (!emu) return;

        // Désactivation forcée du gamepad interne
        try {
          if (typeof emu.toggleVirtualGamepad === 'function') {
            emu.toggleVirtualGamepad(false);
          }
          if (emu.virtualGamepad) {
            emu.virtualGamepad.style.display = 'none';
          }
        } catch (e) {}
        purgeBuiltInGamepad();

        // Assurer l'application des contrôles configurés dans l'instance
        emu.controls = buildControllersConfig(activeSettings.controls);
        if (typeof emu.setupKeys === 'function') emu.setupKeys();

        emu.fileName = targetZipName;

        const injectVFS = () => {
          try {
            const fs = emu.gameManager?.FS;
            if (fs) {
              const writeToVFS = (virtualPath, data) => {
                try {
                  const parts = virtualPath.split('/');
                  let current = '';
                  for (let i = 0; i < parts.length - 1; i++) {
                    if (parts[i]) {
                      current += '/' + parts[i];
                      try { fs.mkdir(current); } catch(e) {}
                    }
                  }
                  fs.writeFile(virtualPath, data);
                } catch(e) {}
              };

              // A. Injection du BIOS Neo Geo dans tous les chemins scrutés
              writeToVFS('/neogeo.zip', neogeoBytes);
              writeToVFS('neogeo.zip', neogeoBytes);
              writeToVFS('/home/web_user/retroarch/userdata/system/neogeo.zip', neogeoBytes);
              writeToVFS('/home/web_user/retroarch/userdata/neogeo.zip', neogeoBytes);
              writeToVFS('/home/web_user/retroarch/userdata/content/neogeo.zip', neogeoBytes);

              // B. Injection de la ROM du jeu
              writeToVFS('/' + targetZipName, romBytes);
              writeToVFS(targetZipName, romBytes);
              writeToVFS('/home/web_user/retroarch/userdata/' + targetZipName, romBytes);
              writeToVFS('/home/web_user/retroarch/userdata/content/' + targetZipName, romBytes);

              if (emu.fileName && emu.fileName !== targetZipName) {
                writeToVFS('/' + emu.fileName, romBytes);
                writeToVFS(emu.fileName, romBytes);
              }

              console.log('[VFS Injection] Injection terminée avec succès dans le VFS !');
            }
          } catch(err) {
            console.error('[VFS Injection] Erreur VFS:', err);
          }
        };

        const origStartGame = emu.startGame.bind(emu);
        emu.startGame = function() {
          console.log('[VFS Injection] Écriture synchrone des archives dans Emscripten VFS...');
          injectVFS();
          return origStartGame();
        };

        if (emu.gameManager && typeof emu.gameManager.initModule === 'function') {
          const origInitModule = emu.gameManager.initModule.bind(emu.gameManager);
          emu.gameManager.initModule = function(t, e) {
            const res = origInitModule(t, e);
            injectVFS();
            return res;
          };
        }
      };

      window.EJS_onGameStart = () => {
        console.log('[CSW-Arcade] Jeu Neo Geo démarré à 60 FPS !');
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 400);

        // Application immédiate de la résolution, de l'aspect ratio et des filtres
        applyDirectVideoStyles(activeSettings.video);

        // Application du volume initial
        if (activeSettings.audio && window.EJS_emulator) {
          const isMuted = !!activeSettings.audio.muted;
          const targetVol = isMuted ? 0 : ((activeSettings.audio.volume ?? 85) / 100);
          window.EJS_emulator.muted = isMuted;
          if (typeof window.EJS_emulator.setVolume === 'function') {
            window.EJS_emulator.setVolume(targetVol);
          }
        }

        if (window.parent) {
          window.parent.postMessage({ type: 'EJS_GAME_STARTED', game: rawGame }, '*');
          window.parent.postMessage({ type: 'ROM_DOWNLOADED', game: rawGame }, '*');
        }
      };

      window.EJS_disableLocalStorage = true;

      // Écoute des mises à jour dynamiques depuis CSW-Arcade (SettingsModal) et transferts de touches
      window.addEventListener('message', (event) => {
        if (!event.data) return;
        if (event.data.type === 'UPDATE_SETTINGS' && event.data.settings) {
          applyLiveSettings(event.data.settings);
        }
        if (event.data.type === 'KEY_EVENT') {
          handleDirectKey(event.data.code, event.data.keyCode, event.data.eventType === 'keydown');
        }
        if (event.data.type === 'TOUCH_INPUT') {
          dispatchDirectInput(event.data.playerIndex ?? 0, event.data.buttonId, event.data.isPressed);
        }
        if (event.data.type === 'NETPLAY_INPUT') {
          dispatchDirectInput(event.data.playerIndex ?? 1, event.data.buttonId, event.data.isPressed);
        }
      });

      const s = document.createElement('script');
      s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      s.async = true;
      s.onerror = (e) => {
        console.error('[Player] Erreur chargement loader.js', e);
        errorMsg.style.display = 'block';
        errorMsg.innerText = 'Erreur: Impossible de charger le moteur WebAssembly.';
      };
      document.body.appendChild(s);
    }

    // Déclencher le préchargement
    preloadAssetsAndBoot();
  </script>
