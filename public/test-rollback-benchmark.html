<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CSW-Arcade : Benchmark Expérimental Rollback Netcode</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: monospace;
      padding: 24px;
      margin: 0;
    }
    h1 { color: #00f0ff; font-size: 20px; margin-bottom: 8px; }
    #status { color: #fbbf24; font-size: 14px; margin-bottom: 16px; font-weight: bold; }
    #player-frame {
      width: 640px;
      height: 448px;
      border: 2px solid #334155;
      border-radius: 8px;
      margin-bottom: 20px;
      background: #000;
    }
    table { width: 100%; max-width: 900px; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th, td { border: 1px solid #334155; padding: 10px; text-align: left; }
    th { background: #1e293b; color: #38bdf8; }
    tr:nth-child(even) { background: #0f172a; }
    .badge-pass { color: #4ade80; font-weight: bold; }
    .badge-fail { color: #f87171; font-weight: bold; }
    .badge-warn { color: #fbbf24; font-weight: bold; }
    pre { background: #020617; padding: 14px; border-radius: 6px; border: 1px solid #1e293b; max-width: 900px; overflow-x: auto; font-size: 11px; }
  </style>
</head>
<body>
  <h1>BENCHMARK EXPÉRIMENTAL ROLLBACK NETCODE (FBNEO / WASM)</h1>
  <div id="status">Chargement du moteur d'émulation officiel player.html avec benchmark=1...</div>

  <iframe id="player-frame" src=""></iframe>

  <div id="results-container"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetGame = params.get('game') || 'androdun.zip';
    const targetZipName = targetGame.endsWith('.zip') ? targetGame : targetGame + '.zip';

    const frame = document.getElementById('player-frame');
    frame.src = `/player.html?game=${encodeURIComponent(targetZipName)}&netplay=0&playerIndex=0&benchmark=1&t=${Date.now()}`;

    function updateStatus(msg) {
      const el = document.getElementById('status');
      if (el) el.innerText = msg;
      console.log('[Benchmark]', msg);
    }

    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data.type === 'BENCHMARK_RESULTS' && event.data.results) {
        window.__ROLLBACK_BENCHMARK_RESULTS__ = event.data.results;
        renderResultsHTML(event.data.results);
        updateStatus('✓ Benchmark terminé ! Verdict : ' + event.data.results.verdict);
      }
    });

    function renderResultsHTML(res) {
      const container = document.getElementById('results-container');
      const t = res.tests;

      let html = `
        <h2>RÉSULTATS DU BENCHMARK EXPÉRIMENTAL (${res.game})</h2>
        <div style="font-size: 18px; margin-bottom: 14px; font-weight: bold; color: ${res.verdict.startsWith('A') ? '#4ade80' : (res.verdict.startsWith('B') ? '#fbbf24' : '#f87171')}">
          VERDICT : ${res.verdict}
        </div>

        <table>
          <tr><th>Métrique</th><th>Valeur Mesurée</th><th>Évaluation Technique</th></tr>
          <tr>
            <td>Taille du Savestate réel</td>
            <td>${(t.stateSize / 1024).toFixed(1)} Ko (${t.stateSize} octets)</td>
            <td class="${t.stateSize < 500000 ? 'badge-pass' : 'badge-warn'}">${t.stateSize < 500000 ? 'EXCELLENT (< 500 Ko)' : 'LOURD'}</td>
          </tr>
          <tr>
            <td>Temps SaveState (getState)</td>
            <td>Moy: ${t.saveTimeMs.avg} ms (Min: ${t.saveTimeMs.min} ms, Max: ${t.saveTimeMs.max} ms)</td>
            <td class="${t.saveTimeMs.avg < 1.5 ? 'badge-pass' : 'badge-warn'}">${t.saveTimeMs.avg < 1.5 ? 'ULTRA-RAPIDE (< 1.5 ms)' : 'ACCEPTABLE'}</td>
          </tr>
          <tr>
            <td>Temps LoadState (loadState)</td>
            <td>Moy: ${t.loadTimeMs.avg} ms (Min: ${t.loadTimeMs.min} ms, Max: ${t.loadTimeMs.max} ms)</td>
            <td class="${t.loadTimeMs.avg < 3.0 ? 'badge-pass' : 'badge-warn'}">${t.loadTimeMs.avg < 3.0 ? 'COMPATIBLE ROLLBACK (< 3 ms)' : 'ATTENTION'}</td>
          </tr>
          <tr>
            <td>Mémoire 60 snapshots (1 sec)</td>
            <td>${t.memoryUsageMB.frames60} Mo</td>
            <td class="badge-pass">NÉGLIGEABLE (< 30 Mo)</td>
          </tr>
          <tr>
            <td>Mémoire 120 snapshots (2 sec)</td>
            <td>${t.memoryUsageMB.frames120} Mo</td>
            <td class="badge-pass">PARFAIT (< 60 Mo)</td>
          </tr>
          <tr>
            <td>Mémoire 300 snapshots (5 sec)</td>
            <td>${t.memoryUsageMB.frames300} Mo</td>
            <td class="${t.memoryUsageMB.frames300 < 150 ? 'badge-pass' : 'badge-warn'}">${t.memoryUsageMB.frames300 < 150 ? 'VIABLE NAVIGATEUR' : 'LIMITE SUR MOBILE'}</td>
          </tr>
          <tr>
            <td>Déterminisme RAM Neo Geo (60 frames)</td>
            <td>Run 1: [${t.determinism.checksumRun1_RAM}] | Run 2: [${t.determinism.checksumRun2_RAM}]</td>
            <td class="${t.determinism.ramMatch ? 'badge-pass' : (t.determinism.ramDiffBytes < 32 ? 'badge-warn' : 'badge-fail')}">
              ${t.determinism.ramMatch ? '100% IDENTIQUE (DÉTERMINISTE STRICT)' : `Divergence : ${t.determinism.ramDiffBytes} octets (${t.determinism.ramDiffPercent}%)`}
            </td>
          </tr>
          <tr>
            <td>Déterminisme Savestate Complet (60 frames)</td>
            <td>Différence : ${t.determinism.stateDiffBytes} octets (${t.determinism.stateDiffPercent}%)</td>
            <td class="${t.determinism.stateMatch ? 'badge-pass' : 'badge-warn'}">
              ${t.determinism.stateMatch ? '100% IDENTIQUE' : 'Divergence mineure (Timers audio/RTC Emscripten)'}
            </td>
          </tr>
          <tr>
            <td>Resimulation 1 frame</td>
            <td>${t.resimulationTimesMs.frames_1} ms</td>
            <td class="badge-pass">&lt; 16.6 ms (Budget 60 FPS respecté)</td>
          </tr>
          <tr>
            <td>Resimulation 3 frames (Rollback typique)</td>
            <td>${t.resimulationTimesMs.frames_3} ms</td>
            <td class="${t.resimulationTimesMs.frames_3 < 8.0 ? 'badge-pass' : 'badge-warn'}">${t.resimulationTimesMs.frames_3 < 8.0 ? 'EXCELLENT (< 8 ms)' : 'VIABLE'}</td>
          </tr>
          <tr>
            <td>Resimulation 5 frames (Rollback moyen)</td>
            <td>${t.resimulationTimesMs.frames_5} ms</td>
            <td class="${t.resimulationTimesMs.frames_5 < 14.0 ? 'badge-pass' : 'badge-warn'}">${t.resimulationTimesMs.frames_5 < 14.0 ? 'VIABLE (< 14 ms)' : 'LIMITE'}</td>
          </tr>
          <tr>
            <td>Resimulation 10 frames (Rollback profond)</td>
            <td>${t.resimulationTimesMs.frames_10} ms</td>
            <td class="${t.resimulationTimesMs.frames_10 < 25.0 ? 'badge-warn' : 'badge-fail'}">Rattrapage multi-frames requis</td>
          </tr>
        </table>

        <h3>JSON BRUT DES RÉSULTATS :</h3>
        <pre id="json-results">${JSON.stringify(res, null, 2)}</pre>
      `;

      container.innerHTML = html;
    }
  </script>
</body>
</html>
