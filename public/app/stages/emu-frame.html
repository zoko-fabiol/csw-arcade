<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSW Stage — Émulateur</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #03050a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain;
      image-rendering: pixelated;
    }
    body.smooth #game canvas {
      image-rendering: auto !important;
    }
    body.stretch #game canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: fill !important;
    }
    #boot-msg {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 24px;
      background: radial-gradient(circle at center, #0e172a, #03050a 75%);
      font-size: 14px;
      color: #94a3b8;
      z-index: 20;
    }
    #boot-msg strong {
      display: block;
      margin-bottom: 8px;
      color: #f8fafc;
      font-size: 16px;
    }
    #boot-msg[hidden] { display: none; }
    #crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.28) 3px,
        rgba(0, 0, 0, 0.28) 4px
      );
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    body.crt-on #crt-overlay {
      opacity: 1;
    }
    body.csw-touch-pad .ejs_virtualGamepad_parent,
    body.csw-touch-pad .ejs_virtualGamepad_button {
      display: none !important;
      pointer-events: none !important;
    }
    #credits-hud {
      display: none;
    }
    #insert-coin-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-content: center;
      text-align: center;
      background: rgba(3, 5, 10, 0.88);
      backdrop-filter: blur(6px);
      padding: 24px;
    }
    #insert-coin-overlay[hidden] { display: none; }
    #insert-coin-overlay strong {
      font-size: 20px;
      color: #fbbf24;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="crt-overlay" aria-hidden="true"></div>
  <div id="credits-hud">CRÉDITS : --/99</div>
  <div id="insert-coin-overlay" hidden>
    <strong>INSERT COIN TO CONTINUE (0/99)</strong>
    <span style="color:#cbd5e1;font-size:13px;">Solde épuisé. Achetez des coins dans le Quick Menu (Tab) ou le salon pour reprendre.</span>
  </div>
  <div id="boot-msg"><strong>Initialisation du moteur…</strong><span>En attente des paramètres de lancement.</span></div>
  <div id="game"></div>
  <script>
    const CDN_DATA = 'https://cdn.emulatorjs.org/stable/data/';
    let started = false;
    let isNetplaySession = false;
    let netplayPlayerIndex = 0;

    window.captureStageStream = (fps = 30) => {
      const c = document.querySelector('#game canvas');
      return c?.captureStream ? c.captureStream(fps) : null;
    };

    const CODE_TO_KEYCODE = {
      KeyA: 65, KeyB: 66, KeyC: 67, KeyD: 68, KeyE: 69, KeyF: 70, KeyG: 71, KeyH: 72,
      KeyI: 73, KeyJ: 74, KeyK: 75, KeyL: 76, KeyM: 77, KeyN: 78, KeyO: 79, KeyP: 80,
      KeyQ: 81, KeyR: 82, KeyS: 83, KeyT: 84, KeyU: 85, KeyV: 86, KeyW: 87, KeyX: 88,
      KeyY: 89, KeyZ: 90,
      Digit0: 48, Digit1: 49, Digit2: 50, Digit3: 51, Digit4: 52,
      Digit5: 53, Digit6: 54, Digit7: 55, Digit8: 56, Digit9: 57,
      Numpad0: 96, Numpad1: 97, Numpad2: 98, Numpad3: 99, Numpad4: 100,
      Numpad5: 101, Numpad6: 102, Numpad7: 103, Numpad8: 104, Numpad9: 105,
      ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39,
      Space: 32, Enter: 13, ShiftLeft: 16, ShiftRight: 16, ControlLeft: 17, ControlRight: 17,
    };

    function getKeyCode(code, fallback) {
      if (typeof code === 'number') return code;
      if (typeof code === 'string' && CODE_TO_KEYCODE[code]) return CODE_TO_KEYCODE[code];
      return fallback;
    }

    function readHardwareSettings() {
      try {
        const raw = localStorage.getItem('csw_arcade_settings_v1');
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    }

    let currentCoreName = 'fbneo';

    function resolveConsoleIdFromCore(coreName) {
      const c = String(coreName || '').toLowerCase();
      if (['fbneo', 'arcade', 'mame2003_plus'].includes(c)) return 'arcade';
      if (['psx', 'ps1', 'pcsx_rearmed'].includes(c)) return 'playstation';
      if (['segamd', 'genesis_plus_gx', 'picodrive', 'sms', 'gg', 'sega'].includes(c)) return 'sega';
      if (['nes', 'fceumm', 'nestopia', 'snes', 'snes9x', 'gba', 'mgba', 'gb', 'gbc', 'gambatte', 'n64', 'mupen64plus_next', 'nds', 'melonds'].includes(c)) return 'nintendo';
      return 'arcade';
    }

    function buildControllersConfig(controls, coreName = currentCoreName, hw = null) {
      const consoleId = resolveConsoleIdFromCore(coreName);
      const effectiveHw = hw || readHardwareSettings();
      const consoleKb = effectiveHw?.consoleControls?.[consoleId]?.keyboard;
      const sourceControls = consoleKb || controls;
      if (!sourceControls) return null;
      const p1 = sourceControls.p1 || {};
      const p2 = sourceControls.p2 || {};
      const lowerCore = String(coreName || '').toLowerCase();
      const isArcade = ['fbneo', 'arcade', 'mame2003_plus'].includes(lowerCore);
      const isN64 = ['n64', 'mupen64plus_next'].includes(lowerCore);
      return {
        0: {
          0: { value: getKeyCode(p1.a, 74), value2: 'BUTTON_2' }, // B / Cross / Neo Geo A
          1: { value: getKeyCode(p1.c, 85), value2: 'BUTTON_4' }, // Y / Square / Neo Geo C
          2: isArcade ? { value: 0, value2: '' } : { value: getKeyCode(p1.coin, 16), value2: 'SELECT' },
          3: { value: getKeyCode(p1.start, isArcade ? 49 : 13), value2: 'START' },
          4: { value: getKeyCode(p1.up, 87), value2: 'DPAD_UP' },
          5: { value: getKeyCode(p1.down, 83), value2: 'DPAD_DOWN' },
          6: { value: getKeyCode(p1.left, 65), value2: 'DPAD_LEFT' },
          7: { value: getKeyCode(p1.right, 68), value2: 'DPAD_RIGHT' },
          8: { value: getKeyCode(p1.b, 75), value2: 'BUTTON_1' }, // A / Circle / Neo Geo B
          9: { value: getKeyCode(p1.d, 73), value2: 'BUTTON_3' }, // X / Triangle / Neo Geo D
          10: { value: getKeyCode(p1.l1, 81), value2: 'LEFT_TOP_SHOULDER' }, // Q / L1
          11: { value: getKeyCode(p1.r1, 69), value2: 'RIGHT_TOP_SHOULDER' }, // E / R1
          12: { value: getKeyCode(p1.l2, 90), value2: 'LEFT_BOTTOM_SHOULDER' }, // Z / L2 / N64 Z-Trigger
          13: { value: getKeyCode(p1.r2, 67), value2: 'RIGHT_BOTTOM_SHOULDER' }, // C / R2
          // Sur N64 (Mario Kart 64, Pokémon Stadium...), le stick analogique doit répondre immédiatement aux touches principales
          16: { value: isN64 ? getKeyCode(p1.right, 68) : 39, value2: 'LEFT_STICK_X:+1' },
          17: { value: isN64 ? getKeyCode(p1.left, 65) : 37, value2: 'LEFT_STICK_X:-1' },
          18: { value: isN64 ? getKeyCode(p1.down, 83) : 40, value2: 'LEFT_STICK_Y:+1' },
          19: { value: isN64 ? getKeyCode(p1.up, 87) : 38, value2: 'LEFT_STICK_Y:-1' },
          20: { value: 0, value2: 'RIGHT_STICK_X:+1' },
          21: { value: 0, value2: 'RIGHT_STICK_X:-1' },
          22: { value: 0, value2: 'RIGHT_STICK_Y:+1' },
          23: { value: 0, value2: 'RIGHT_STICK_Y:-1' },
        },
        1: {
          0: { value: getKeyCode(p2.a, 100), value2: 'BUTTON_2' },
          1: { value: getKeyCode(p2.c, 103), value2: 'BUTTON_4' },
          2: isArcade ? { value: 0, value2: '' } : { value: 109, value2: 'SELECT' },
          3: { value: getKeyCode(p2.start, 50), value2: 'START' },
          4: { value: getKeyCode(p2.up, 38), value2: 'DPAD_UP' },
          5: { value: getKeyCode(p2.down, 40), value2: 'DPAD_DOWN' },
          6: { value: getKeyCode(p2.left, 37), value2: 'DPAD_LEFT' },
          7: { value: getKeyCode(p2.right, 39), value2: 'DPAD_RIGHT' },
          8: { value: getKeyCode(p2.b, 101), value2: 'BUTTON_1' },
          9: { value: getKeyCode(p2.d, 104), value2: 'BUTTON_3' },
          10: { value: 105, value2: 'LEFT_TOP_SHOULDER' },
          11: { value: 107, value2: 'RIGHT_TOP_SHOULDER' },
          12: { value: 0, value2: 'LEFT_BOTTOM_SHOULDER' },
          13: { value: 0, value2: 'RIGHT_BOTTOM_SHOULDER' },
          16: { value: 0, value2: 'LEFT_STICK_X:+1' },
          17: { value: 0, value2: 'LEFT_STICK_X:-1' },
          18: { value: 0, value2: 'LEFT_STICK_Y:+1' },
          19: { value: 0, value2: 'LEFT_STICK_Y:-1' },
        },
        2: {},
        3: {},
      };
    }

    function applyHardwareSettings(hw) {
      if (!hw) return;
      if (hw.video) {
        if (hw.video.filter) document.body.classList.toggle('smooth', hw.video.filter === 'smooth');
        if (hw.video.aspectRatio) document.body.classList.toggle('stretch', hw.video.aspectRatio === '16:9');
        const crtOn = Boolean(hw.video.scanlines || hw.video.crt || hw.video.crtEnabled);
        document.body.classList.toggle('crt-on', crtOn);
      }
      if (hw.audio && window.EJS_emulator) {
        const isMuted = Boolean(hw.audio.muted);
        const vol = isMuted ? 0 : Math.max(0, Math.min(1, (hw.audio.volume ?? 80) / 100));
        try {
          window.EJS_emulator.muted = isMuted;
          if (typeof window.EJS_emulator.setVolume === 'function') {
            window.EJS_emulator.setVolume(vol);
          }
        } catch {}
      }
      if ((hw.controls || hw.consoleControls) && window.EJS_emulator) {
        const cfg = buildControllersConfig(hw.controls, currentCoreName, hw);
        if (cfg) {
          window.EJS_emulator.controls = cfg;
          window.EJS_emulator.defaultControllers = cfg;
          if (typeof window.EJS_emulator.setupKeys === 'function') {
            try { window.EJS_emulator.setupKeys(); } catch {}
          }
        }
      }
      if (hw.touch && typeof hw.touch.opacity === 'number') {
        const pad = document.querySelector('.ejs_virtualGamepad_parent');
        if (pad) pad.style.opacity = String(Math.max(0.15, Math.min(1, hw.touch.opacity / 100)));
      }
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'csw_arcade_settings_v1' && e.newValue) {
        try { applyHardwareSettings(JSON.parse(e.newValue)); } catch {}
      }
    });

    function applyDisplay({ filter, ratio, volume, muted }) {
      if (filter) document.body.classList.toggle('smooth', filter === 'smooth');
      if (ratio) document.body.classList.toggle('stretch', ratio === 'stretch');
      const effectiveVol = muted ? 0 : (typeof volume === 'number' ? Math.max(0, Math.min(1, volume / 100)) : null);
      if (effectiveVol !== null && window.EJS_emulator) {
        try {
          window.EJS_emulator.muted = Boolean(muted);
          if (typeof window.EJS_emulator.setVolume === 'function') {
            window.EJS_emulator.setVolume(effectiveVol);
          }
        } catch {}
      }
    }

    function notifyParent(type, payload = {}) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type, ...payload }, window.location.origin);
      }
    }

    const BUTTON_INDEX_ORDER = [4, 5, 6, 7, 0, 8, 1, 9, 10, 11, 12, 13, 2, 3];
    let targetWalletCoins = 5;
    let romCreditsInGame = 0;
    let isSyncingCredits = false;
    let lastSyncedRamCoins = -1;
    let liveCreditAddrs = [];
    let ramCalibrated = false;
    let ramWatcherTimer = null;

    function toBcd(n) {
      const c = Math.max(0, Math.min(99, Math.floor(Number(n) || 0)));
      return ((Math.floor(c / 10) & 0x0f) << 4) | (c % 10);
    }

    function fromBcd(byte) {
      const hi = (byte >> 4) & 0x0f;
      const lo = byte & 0x0f;
      if (hi > 9 || lo > 9) return -1;
      return hi * 10 + lo;
    }

    function getWasmHeap() {
      return window.EJS_emulator?.gameManager?.Module?.HEAPU8 || window.EJS_emulator?.Module?.HEAPU8 || null;
    }

    function readRamCredits() {
      const heap = getWasmHeap();
      if (!heap || !liveCreditAddrs.length) return -1;
      for (let i = 0; i < liveCreditAddrs.length; i++) {
        const val = fromBcd(heap[liveCreditAddrs[i]]);
        if (val >= 0 && val <= 99) return val;
      }
      return -1;
    }

    function writeCreditsToRam(coinsCount) {
      const c = Math.max(0, Math.min(99, Math.floor(Number(coinsCount) || 0)));
      const heap = getWasmHeap();
      if (!heap || !liveCreditAddrs.length) return false;
      const bcdVal = toBcd(c);
      for (let i = 0; i < liveCreditAddrs.length; i++) {
        heap[liveCreditAddrs[i]] = bcdVal;
      }
      lastSyncedRamCoins = c;
      romCreditsInGame = c;
      return true;
    }

    function startRamCreditWatcher() {
      if (ramWatcherTimer) clearInterval(ramWatcherTimer);
      ramWatcherTimer = setInterval(() => {
        if (isSyncingCredits) return;
        const decoded = readRamCredits();
        if (decoded >= 0 && decoded <= 99 && decoded < romCreditsInGame && romCreditsInGame - decoded <= 2) {
          romCreditsInGame = decoded;
          lastSyncedRamCoins = decoded;
          targetWalletCoins = decoded;
          notifyParent('SYNC_WALLET_FROM_RAM', { coins: decoded });
        }
      }, 150);
    }

    // Forcer la synchronisation exacte des crédits du portefeuille dans la RAM de la ROM (déclenché par la touche 5 ou le bouton Sync Crédits)
    async function forceSyncCreditsToRam() {
      if (isSyncingCredits) return;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      const currentRam = readRamCredits();
      if (currentRam >= 0) {
        romCreditsInGame = currentRam;
      }

      if (targetWalletCoins <= 0) {
        writeCreditsToRam(0);
        return;
      }

      // Si l'adresse RAM des crédits est déjà calibrée, écrire la valeur exacte du portefeuille sans jamais ajouter d'impulsion en trop
      if (ramCalibrated) {
        if (currentRam !== targetWalletCoins) {
          writeCreditsToRam(targetWalletCoins);
        }
        return;
      }

      // Ne jamais réinjecter des crédits si la synchro a déjà atteint le solde du portefeuille
      if (romCreditsInGame >= targetWalletCoins) return;

      isSyncingCredits = true;
      let candidates = null;

      try {
        while (romCreditsInGame < targetWalletCoins) {
          const nextCredit = romCreditsInGame + 1;
          pulseEmuButton(0, 2, 55);
          await sleep(115);
          romCreditsInGame = nextCredit;

          // Calibrer l'adresse RAM exacte sur les 3 premières impulsions
          if (!ramCalibrated && nextCredit >= 1 && nextCredit <= 3) {
            const heap = getWasmHeap();
            if (heap) {
              const bcdExpected = toBcd(nextCredit);
              if (nextCredit === 1) {
                candidates = [];
                for (let i = 0; i < heap.length; i++) {
                  if (heap[i] === bcdExpected) candidates.push(i);
                }
              } else if (candidates && candidates.length) {
                candidates = candidates.filter((addr) => heap[addr] === bcdExpected);
              }
              if (nextCredit === 3 && candidates && candidates.length >= 1 && candidates.length <= 256) {
                liveCreditAddrs = candidates;
                ramCalibrated = true;
                startRamCreditWatcher();
                console.log('[CSW RAM Linker] Adresse RAM crédits détectée (' + candidates.length + ' octets)');
                if (targetWalletCoins > 3) {
                  // Écrire (targetWalletCoins - 1) en BCD puis envoyer 1 impulsion matérielle pour forcer le rafraîchissement écran du BIOS Neo Geo
                  writeCreditsToRam(targetWalletCoins - 1);
                  await sleep(40);
                  pulseEmuButton(0, 2, 55);
                  await sleep(115);
                  writeCreditsToRam(targetWalletCoins);
                  romCreditsInGame = targetWalletCoins;
                  break;
                }
              }
            }
          } else if (ramCalibrated && targetWalletCoins > romCreditsInGame) {
            writeCreditsToRam(targetWalletCoins - 1);
            await sleep(40);
            pulseEmuButton(0, 2, 55);
            await sleep(115);
            writeCreditsToRam(targetWalletCoins);
            romCreditsInGame = targetWalletCoins;
            break;
          }
        }
      } finally {
        isSyncingCredits = false;
      }
    }

    function simulateEmuInput(player, buttonId, isPressed) {
      const gm = window.EJS_emulator?.gameManager;
      if (!gm) return false;
      const isAxis = buttonId >= 16 && buttonId <= 23;
      const val = isPressed ? (isAxis ? 32767 : 1) : 0;
      const fn = gm.functions?.simulateInput || gm.simulateInput;
      const ctx = gm.functions?.simulateInput ? gm.functions : gm;
      if (typeof fn === 'function') {
        try {
          fn.call(ctx, player, buttonId, val);
          return true;
        } catch {}
      }
      return false;
    }

    function pulseEmuButton(player, buttonId, durationMs = 110) {
      simulateEmuInput(player, buttonId, true);
      setTimeout(() => simulateEmuInput(player, buttonId, false), durationMs);
    }

    function resolveUniversalKey(e) {
      const code = e.code || '';
      if (code === 'Digit5' || code === 'Digit6' || code === 'Numpad5' || code === 'Numpad6') return 2; // Bloqué (ne charge plus de crédit)
      if (code === 'Digit1' || code === 'Digit2' || code === 'Enter' || code === 'Numpad1') return 3; // Start
      return findLocalButtonIndex(e.keyCode || e.which);
    }

    function findLocalButtonIndex(keyCode) {
      // Pour les touches locales du joueur physique, utiliser toujours les touches principales de la configuration
      const portMap = buildControllersConfig(readHardwareSettings().controls)?.[0] || window.EJS_emulator?.controls?.[0];
      if (!portMap) return -1;
      for (const idx of BUTTON_INDEX_ORDER) {
        if (portMap[idx]?.value === keyCode) return idx;
      }
      return -1;
    }

    function bytesToBase64(bytes) {
      let bin = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        bin += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(bin);
    }

    function dispatchSyntheticKey(kc, type) {
      const ev = new KeyboardEvent(type, { keyCode: kc, which: kc, bubbles: true, cancelable: true });
      Object.defineProperty(ev, 'keyCode', { get: () => kc });
      Object.defineProperty(ev, 'which', { get: () => kc });
      ev._cswSynthetic = true;
      window.dispatchEvent(ev);
      document.dispatchEvent(ev);
    }

    // Pont universel clavier -> EmulatorJS (garantit que ZQSD/WASD + Flèches + J/K/U/I/Espace/Entrée fonctionnent sur Mario Kart 64, N64, PS1, SNES, Arcade)
    function handleUniversalKeyboardBridge(code, keyCode, isDown) {
      const myPort = netplayPlayerIndex === 1 ? 1 : 0;
      const lowerCore = String(currentCoreName || '').toLowerCase();
      const isAnalogConsole = ['n64', 'mupen64plus_next', 'psx', 'ps1', 'pcsx_rearmed', 'nds', 'melonds'].includes(lowerCore);

      // Flèches directionnelles -> fonctionnent aussi comme DPAD + Stick Analogique
      if (code === 'ArrowUp' || keyCode === 38) {
        simulateEmuInput(myPort, 19, isDown);
        simulateEmuInput(myPort, 4, isDown);
        return;
      }
      if (code === 'ArrowDown' || keyCode === 40) {
        simulateEmuInput(myPort, 18, isDown);
        simulateEmuInput(myPort, 5, isDown);
        return;
      }
      if (code === 'ArrowLeft' || keyCode === 37) {
        simulateEmuInput(myPort, 17, isDown);
        simulateEmuInput(myPort, 6, isDown);
        return;
      }
      if (code === 'ArrowRight' || keyCode === 39) {
        simulateEmuInput(myPort, 16, isDown);
        simulateEmuInput(myPort, 7, isDown);
        return;
      }

      // WASD / ZQSD -> sur N64/PS1, pilotent aussi le Stick Analogique en plus du DPAD
      if (isAnalogConsole) {
        const portMap = window.EJS_emulator?.controls?.[myPort] || buildControllersConfig(readHardwareSettings().controls)?.[0];
        if (portMap) {
          if (keyCode === portMap[4]?.value) simulateEmuInput(myPort, 19, isDown);
          if (keyCode === portMap[5]?.value) simulateEmuInput(myPort, 18, isDown);
          if (keyCode === portMap[6]?.value) simulateEmuInput(myPort, 17, isDown);
          if (keyCode === portMap[7]?.value) simulateEmuInput(myPort, 16, isDown);
        }
      }

      if (code === 'Space' || code === 'Enter' || code === 'Digit1' || code === 'Numpad1') {
        simulateEmuInput(myPort, 3, isDown);
      }
    }

    window.addEventListener('pointerdown', () => {
      try { window.focus(); } catch {}
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        notifyParent('TOGGLE_QUICK_MENU');
        return;
      }
      if (!e._cswSynthetic && !e.repeat) {
        const myPort = netplayPlayerIndex === 1 ? 1 : 0;
        const btnIdx = resolveUniversalKey(e);
        if (btnIdx === 2) {
          // Touche 5 / Coin : injecter une impulsion Coin et transmettre en Netplay
          e.preventDefault();
          e.stopImmediatePropagation();
          pulseEmuButton(isNetplaySession ? 0 : myPort, 2, 70);
          if (isNetplaySession) {
            notifyParent('NETPLAY_LOCAL_BTN', { buttonIdx: 2, pressed: true });
            setTimeout(() => notifyParent('NETPLAY_LOCAL_BTN', { buttonIdx: 2, pressed: false }), 70);
          }
          forceSyncCreditsToRam();
          return;
        }
        handleUniversalKeyboardBridge(e.code || '', e.keyCode || e.which, true);
        if (btnIdx >= 0) {
          e.preventDefault();
          e.stopImmediatePropagation();
          simulateEmuInput(myPort, btnIdx, true);
          if (btnIdx === 4) simulateEmuInput(myPort, 19, true);
          else if (btnIdx === 5) simulateEmuInput(myPort, 18, true);
          else if (btnIdx === 6) simulateEmuInput(myPort, 17, true);
          else if (btnIdx === 7) simulateEmuInput(myPort, 16, true);
        }
        if (isNetplaySession && btnIdx >= 0) {
          notifyParent('NETPLAY_LOCAL_BTN', { buttonIdx: btnIdx, pressed: true });
        }
      }
    }, true);

    window.addEventListener('keyup', (e) => {
      if (!e._cswSynthetic) {
        const myPort = netplayPlayerIndex === 1 ? 1 : 0;
        const btnIdx = resolveUniversalKey(e);
        handleUniversalKeyboardBridge(e.code || '', e.keyCode || e.which, false);
        if (btnIdx >= 0) {
          e.preventDefault();
          e.stopImmediatePropagation();
          simulateEmuInput(myPort, btnIdx, false);
          if (btnIdx === 4) simulateEmuInput(myPort, 19, false);
          else if (btnIdx === 5) simulateEmuInput(myPort, 18, false);
          else if (btnIdx === 6) simulateEmuInput(myPort, 17, false);
          else if (btnIdx === 7) simulateEmuInput(myPort, 16, false);
        }
        if (isNetplaySession && btnIdx >= 0) {
          notifyParent('NETPLAY_LOCAL_BTN', { buttonIdx: btnIdx, pressed: false });
        }
      }
    });

    // =========================================================================
    // MOTEUR UNIVERSEL DE TÉLÉMÉTRIE RAM (Scores Auto + Détection Perte / Game Over / Victoire)
    // Fonctionne sur Arcade, Sega Mega Drive, PlayStation, Nintendo (NES/SNES/N64/GBA)
    // =========================================================================
    const RAM_GAME_PROFILES = [
      {
        match: /sonic.*2/i,
        cores: ['segamd', 'genesis_plus_gx', 'picodrive'],
        read(ram) {
          if (ram.length < 0xFF00) return null;
          const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
          return {
            lives: ram[0xFE12],
            rings: dv.getUint16(0xFE20, false),
            score: dv.getUint32(0xFE26, false) * 10,
          };
        },
      },
      {
        match: /sonic/i,
        cores: ['segamd', 'genesis_plus_gx', 'picodrive'],
        read(ram) {
          if (ram.length < 0xFF00) return null;
          const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
          return {
            lives: ram[0xFE12],
            rings: dv.getUint16(0xFE20, false),
            score: dv.getUint32(0xFE26, false) * 10,
          };
        },
      },
      {
        match: /streets.*rage.*2|bare.*knuckle.*2/i,
        cores: ['segamd', 'genesis_plus_gx', 'picodrive'],
        read(ram) {
          if (ram.length < 0xF000) return null;
          const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
          return {
            lives: ram[0xEF4A],
            score: dv.getUint32(0xEF4C, false),
          };
        },
      },
      {
        match: /super.*mario.*world/i,
        cores: ['snes', 'snes9x'],
        read(ram) {
          if (ram.length < 0x1000) return null;
          const s = ram[0x0F34] | (ram[0x0F35] << 8) | (ram[0x0F36] << 16);
          return {
            lives: ram[0x0DBE] + 1,
            score: s * 10,
          };
        },
      },
      {
        match: /super.*mario.*bros/i,
        cores: ['nes', 'fceumm', 'nestopia'],
        read(ram) {
          if (ram.length < 0x0800) return null;
          let sc = 0;
          for (let i = 0; i < 6; i++) {
            const d = ram[0x07DD + i];
            if (d > 9) return null;
            sc = sc * 10 + d;
          }
          return {
            lives: ram[0x075A] === 0xFF ? 0 : ram[0x075A] + 1,
            score: sc * 10,
          };
        },
      },
      {
        match: /tekken.*3/i,
        cores: ['psx', 'ps1', 'pcsx_rearmed'],
        read(ram) {
          if (ram.length < 0x0B0000) return null;
          const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
          const p1Rounds = ram[0x0A96B4];
          const p2Rounds = ram[0x0AAFA0];
          const rawScore = dv.getUint32(0x0A96A8, true);
          return {
            lives: Math.max(0, 2 - Math.min(2, p2Rounds)),
            p1Rounds,
            p2Rounds,
            score: rawScore < 50000000 ? rawScore : 0,
          };
        },
      },
      {
        match: /crash.*bandicoot/i,
        cores: ['psx', 'ps1', 'pcsx_rearmed'],
        read(ram) {
          if (ram.length < 0x070000) return null;
          const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
          const lives = dv.getUint16(0x061904, true) >> 8;
          const wumpa = dv.getUint16(0x0618EC, true) >> 8;
          return {
            lives: lives <= 99 ? lives : null,
            score: wumpa <= 99 ? wumpa * 100 : 0,
          };
        },
      },
    ];

    const cswRamTelemetry = {
      timer: null,
      profile: null,
      core: 'fbneo',
      gameTitle: '',
      peakScore: 0,
      lastSavedScore: 0,
      lastScore: 0,
      lastLives: null,
      lastP1Rounds: 0,
      lastP2Rounds: 0,
      lastLossSignalMs: 0,
      lastWinSignalMs: 0,
      hadActivePlay: false,
      // Scanner heuristique universel pour tout jeu sans profil fixe
      prevSnapshot: null,
      scoreCandidates: new Map(), // offset -> { hits, val, type }
      lockedScoreAddr: null, // { offset, type }
      livesCandidates: new Map(), // offset -> { initial, val, drops }
      lockedLivesAddr: null,
    };

    function getSystemRamView() {
      try {
        const mod = getWasmModule();
        if (mod && mod.HEAPU8 && typeof mod._retro_get_memory_data === 'function' && typeof mod._retro_get_memory_size === 'function') {
          const ptr = mod._retro_get_memory_data(2); // RETRO_MEMORY_SYSTEM_RAM
          const size = mod._retro_get_memory_size(2);
          if (ptr > 0 && size >= 512 && ptr + size <= mod.HEAPU8.length) {
            return { ram: mod.HEAPU8.subarray(ptr, ptr + size), isRawSystemRam: true };
          }
        }
        // Savestate RAM complet (EmulatorJS FBNeo / MAME / PS1 / SNES / Mega Drive / GBA)
        const state = window.EJS_emulator?.gameManager?.getState?.();
        if (state && state.length > 4096) {
          const bytes = state instanceof Uint8Array ? state : new Uint8Array(state);
          return { ram: bytes, isRawSystemRam: false };
        }
      } catch {}
      return null;
    }

    function readBcd3(buf, off) {
      if (off < 0 || off + 3 > buf.length) return -1;
      const b0 = buf[off], b1 = buf[off + 1], b2 = buf[off + 2];
      const h0 = b0 >> 4, l0 = b0 & 0xF;
      const h1 = b1 >> 4, l1 = b1 & 0xF;
      const h2 = b2 >> 4, l2 = b2 & 0xF;
      if (h0 > 9 || l0 > 9 || h1 > 9 || l1 > 9 || h2 > 9 || l2 > 9) return -1;
      return (h0 * 10 + l0) * 10000 + (h1 * 10 + l1) * 100 + (h2 * 10 + l2);
    }

    function readBcd4(buf, off) {
      if (off < 0 || off + 4 > buf.length) return -1;
      const b0 = buf[off], b1 = buf[off + 1], b2 = buf[off + 2], b3 = buf[off + 3];
      const h0 = b0 >> 4, l0 = b0 & 0xF;
      const h1 = b1 >> 4, l1 = b1 & 0xF;
      const h2 = b2 >> 4, l2 = b2 & 0xF;
      const h3 = b3 >> 4, l3 = b3 & 0xF;
      if (h0 > 9 || l0 > 9 || h1 > 9 || l1 > 9 || h2 > 9 || l2 > 9 || h3 > 9 || l3 > 9) return -1;
      return (h0 * 10 + l0) * 1000000 + (h1 * 10 + l1) * 10000 + (h2 * 10 + l2) * 100 + (h3 * 10 + l3);
    }

    function readHeuristicValue(ram, addr) {
      if (!addr || addr.offset < 0 || addr.offset + 4 > ram.length) return 0;
      const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
      if (addr.type === 'bcd4') {
        const v = readBcd4(ram, addr.offset);
        return v >= 0 ? v : 0;
      }
      if (addr.type === 'bcd3') {
        const v = readBcd3(ram, addr.offset);
        return v >= 0 ? v : 0;
      }
      if (addr.type === 'u32be') return dv.getUint32(addr.offset, false);
      if (addr.type === 'u32le') return dv.getUint32(addr.offset, true);
      if (addr.type === 'u16be') return dv.getUint16(addr.offset, false);
      if (addr.type === 'u16le') return dv.getUint16(addr.offset, true);
      return 0;
    }

    function bumpScoreCandidate(key, offset, type, curVal, prevVal, requiredHits) {
      const rec = cswRamTelemetry.scoreCandidates.get(key) || {
        offset,
        type,
        hits: 0,
        val: prevVal,
        sameTicks: 0,
      };
      // Rejeter si la valeur précédente enregistrée ne correspond pas à une progression monotone
      if (curVal < rec.val) {
        cswRamTelemetry.scoreCandidates.delete(key);
        return null;
      }
      rec.hits += 1;
      rec.val = curVal;
      cswRamTelemetry.scoreCandidates.set(key, rec);
      if (rec.hits >= requiredHits) {
        cswRamTelemetry.lockedScoreAddr = { offset, type };
        return curVal;
      }
      return null;
    }

    function runHeuristicRamScan(ram) {
      // Scanner jusqu'à 6 Mo de RAM / Savestate (FBNeo Neo Geo / CPS2 / PS1) grâce au diff 32-bit (< 3ms/tick)
      const scanLen = Math.min(ram.length, 6291456) & ~3;
      if (scanLen < 1024) return { score: cswRamTelemetry.lastScore, lives: cswRamTelemetry.lastLives };

      const prev = cswRamTelemetry.prevSnapshot;
      if (!prev || prev.length !== scanLen) {
        cswRamTelemetry.prevSnapshot = new Uint8Array(ram.subarray(0, scanLen));
        return { score: cswRamTelemetry.lastScore, lives: cswRamTelemetry.lastLives };
      }

      // 1. Si l'adresse de score est déjà verrouillée, la lire directement
      let detectedScore = cswRamTelemetry.lastScore;
      if (cswRamTelemetry.lockedScoreAddr) {
        const v = readHeuristicValue(ram, cswRamTelemetry.lockedScoreAddr);
        if (v < 50000000) {
          detectedScore = v;
        } else {
          cswRamTelemetry.lockedScoreAddr = null;
        }
      } else {
        const cur32 = new Uint32Array(ram.buffer, ram.byteOffset, scanLen >> 2);
        const prev32 = new Uint32Array(prev.buffer, prev.byteOffset, scanLen >> 2);
        const dvCur = new DataView(ram.buffer, ram.byteOffset, scanLen);
        const dvPrev = new DataView(prev.buffer, prev.byteOffset, scanLen);
        const words = scanLen >> 2;

        // Invalider les candidats qui ont diminué entre deux ticks
        for (const [k, rec] of cswRamTelemetry.scoreCandidates.entries()) {
          const curV = readHeuristicValue(ram, rec);
          if (curV < rec.val || curV >= 50000000) {
            cswRamTelemetry.scoreCandidates.delete(k);
          }
        }

        for (let w = 16; w < words - 2; w++) {
          if (cur32[w] === prev32[w]) continue; // Saute instantanément 99.5% de la RAM inchangée
          const base = w << 2;

          // Tester les alignements 2 octets (base+0, base+2 : standard Motorola 68000 Neo Geo / Mega Drive)
          // et 1 octet (base+0..3 : BCD 3/4 octets)
          for (let sub = 0; sub < 4; sub++) {
            const off = base + sub;
            if (off + 4 >= scanLen) break;

            // A. BCD 4 octets (8 chiffres : Metal Slug, KOF, Neo Geo, Capcom)
            const b4Cur = readBcd4(ram, off);
            const b4Prev = readBcd4(prev, off);
            if (b4Cur > b4Prev && b4Prev >= 0 && b4Cur <= 99999999) {
              const diff = b4Cur - b4Prev;
              if (diff >= 10 && diff <= 50000 && diff % 10 === 0) {
                const locked = bumpScoreCandidate(`bcd4_${off}`, off, 'bcd4', b4Cur, b4Prev, 2);
                if (locked !== null) { detectedScore = locked; break; }
              }
            }

            // B. BCD 3 octets (6 chiffres)
            const b3Cur = readBcd3(ram, off);
            const b3Prev = readBcd3(prev, off);
            if (b3Cur > b3Prev && b3Prev >= 0 && b3Cur <= 999999) {
              const diff = b3Cur - b3Prev;
              if (diff >= 10 && diff <= 50000 && diff % 10 === 0) {
                const locked = bumpScoreCandidate(`bcd3_${off}`, off, 'bcd3', b3Cur, b3Prev, 2);
                if (locked !== null) { detectedScore = locked; break; }
              }
            }

            // Pour u32 / u16, vérifier les offsets pairs (sub === 0 || sub === 2)
            if ((sub & 1) === 0) {
              // C. u32 Big-Endian (Neo Geo MVS & Sega Mega Drive 68000)
              const beCur = dvCur.getUint32(off, false);
              const bePrev = dvPrev.getUint32(off, false);
              if (beCur > bePrev && bePrev < 5000000 && beCur <= 9999999) {
                const diff = beCur - bePrev;
                if (diff >= 10 && diff <= 50000 && diff % 10 === 0) {
                  const locked = bumpScoreCandidate(`u32be_${off}`, off, 'u32be', beCur, bePrev, 2);
                  if (locked !== null) { detectedScore = locked; break; }
                }
              }

              // D. u32 Little-Endian (PlayStation PS1, SNES, GBA, N64)
              const leCur = dvCur.getUint32(off, true);
              const lePrev = dvPrev.getUint32(off, true);
              if (leCur > lePrev && lePrev < 5000000 && leCur <= 9999999) {
                const diff = leCur - lePrev;
                if (diff >= 10 && diff <= 50000 && diff % 10 === 0) {
                  const locked = bumpScoreCandidate(`u32le_${off}`, off, 'u32le', leCur, lePrev, 2);
                  if (locked !== null) { detectedScore = locked; break; }
                }
              }

              // E. u16 Big-Endian & Little-Endian (Jeux de sport ex: Street Hoop +2/+3 pts, NES, Arcade)
              const u16beCur = dvCur.getUint16(off, false);
              const u16bePrev = dvPrev.getUint16(off, false);
              if (u16beCur > u16bePrev && u16beCur <= 500) {
                const diff = u16beCur - u16bePrev;
                if (diff >= 2 && diff <= 6) {
                  const locked = bumpScoreCandidate(`u16be_${off}`, off, 'u16be', u16beCur, u16bePrev, 3);
                  if (locked !== null) { detectedScore = locked; break; }
                }
              }

              const u16leCur = dvCur.getUint16(off, true);
              const u16lePrev = dvPrev.getUint16(off, true);
              if (u16leCur > u16lePrev && u16leCur <= 500) {
                const diff = u16leCur - u16lePrev;
                if (diff >= 2 && diff <= 6) {
                  const locked = bumpScoreCandidate(`u16le_${off}`, off, 'u16le', u16leCur, u16lePrev, 3);
                  if (locked !== null) { detectedScore = locked; break; }
                }
              }
            }
          }
          if (cswRamTelemetry.lockedScoreAddr) break;
        }
      }

      // 2. Suivi heuristique d'un compteur de vies (octets entre 1..9 qui descendent de -1 lors d'une mort)
      let detectedLives = cswRamTelemetry.lastLives;
      if (cswRamTelemetry.lockedLivesAddr !== null && cswRamTelemetry.lockedLivesAddr < scanLen) {
        const lv = ram[cswRamTelemetry.lockedLivesAddr];
        if (lv <= 15) detectedLives = lv;
      } else if (cswRamTelemetry.hadActivePlay) {
        const cur32 = new Uint32Array(ram.buffer, ram.byteOffset, scanLen >> 2);
        const prev32 = new Uint32Array(prev.buffer, prev.byteOffset, scanLen >> 2);
        const words = scanLen >> 2;
        for (let w = 16; w < words - 1; w++) {
          if (cur32[w] === prev32[w]) continue;
          const base = w << 2;
          for (let b = 0; b < 4; b++) {
            const off = base + b;
            const cur = ram[off];
            const old = prev[off];
            if (old >= 2 && old <= 6 && cur === old - 1) {
              const rec = cswRamTelemetry.livesCandidates.get(off) || { initial: old, drops: 0 };
              rec.drops += 1;
              cswRamTelemetry.livesCandidates.set(off, rec);
              if (rec.drops >= 2) {
                cswRamTelemetry.lockedLivesAddr = off;
                detectedLives = cur;
                break;
              }
            }
          }
          if (cswRamTelemetry.lockedLivesAddr !== null) break;
        }
      }

      cswRamTelemetry.prevSnapshot.set(ram.subarray(0, scanLen));
      return { score: detectedScore, lives: detectedLives };
    }

    function emitRamAutoScore(score, reason) {
      const clean = Math.floor(Number(score) || 0);
      if (clean <= 0) return;
      if (reason === 'milestone' && clean <= cswRamTelemetry.lastSavedScore) return;
      cswRamTelemetry.lastSavedScore = Math.max(cswRamTelemetry.lastSavedScore, clean);
      notifyParent('RAM_AUTO_SCORE', {
        score: clean,
        reason, // 'game_over' | 'victory' | 'milestone' | 'session_end'
        mode: cswRamTelemetry.profile ? 'profile' : 'heuristic',
      });
    }

    function emitRamLossCreditSignal(reason) {
      const now = Date.now();
      // Anti-rebond 5 secondes pour ne décompter qu'un seul crédit par partie perdue
      if (now - cswRamTelemetry.lastLossSignalMs < 5000) return;
      cswRamTelemetry.lastLossSignalMs = now;
      if (cswRamTelemetry.peakScore > 0) {
        emitRamAutoScore(cswRamTelemetry.peakScore, 'game_over');
      }
      notifyParent('RAM_LOSS_CONSUME_CREDIT', {
        reason,
        score: cswRamTelemetry.peakScore,
      });
      // Réinitialiser peakScore pour la prochaine partie qui va recommencer
      cswRamTelemetry.peakScore = 0;
      cswRamTelemetry.lastSavedScore = 0;
    }

    function isHeavy3dCore(core) {
      return ['n64', 'mupen64plus_next', 'psx', 'ps1', 'pcsx_rearmed', 'nds', 'melonds', 'desmume'].includes(
        String(core || '').toLowerCase()
      );
    }

    function tickRamTelemetry() {
      // Sur N64 / PS1 / NDS, un savestate fait 16 à 32 Mo : ne jamais appeler getState() en boucle
      // sous peine de provoquer des freezes (ex: Pokémon Stadium) et un crash mémoire du navigateur.
      if (isHeavy3dCore(cswRamTelemetry.core)) {
        const mod = getWasmModule();
        if (!mod || typeof mod._retro_get_memory_data !== 'function') return;
      }
      const view = getSystemRamView();
      if (!view || !view.ram) return;
      const { ram, isRawSystemRam } = view;

      let score = 0;
      let lives = null;
      let p1Rounds = null;
      let p2Rounds = null;

      // N'utiliser les offsets absolus de RAM_GAME_PROFILES que sur une vraie vue RAM système ;
      // sur un savestate RetroArch complet, utiliser le scanner heuristique multi-format (BCD / Big-Endian / Little-Endian).
      if (isRawSystemRam && cswRamTelemetry.profile) {
        const res = cswRamTelemetry.profile.read(ram);
        if (res) {
          score = Number(res.score || 0);
          lives = typeof res.lives === 'number' ? res.lives : null;
          p1Rounds = typeof res.p1Rounds === 'number' ? res.p1Rounds : null;
          p2Rounds = typeof res.p2Rounds === 'number' ? res.p2Rounds : null;
        }
      } else {
        const res = runHeuristicRamScan(ram);
        score = Number(res.score || 0);
        lives = typeof res.lives === 'number' ? res.lives : null;
      }

      if (score > 0 && score < 99999999) {
        cswRamTelemetry.hadActivePlay = true;
        if (score > cswRamTelemetry.peakScore) {
          cswRamTelemetry.peakScore = score;
        }
      }

      // 1. Détection de VICTOIRE (ex: 2 rounds gagnés en jeu de combat ou gros palier de score)
      if (p1Rounds !== null && p1Rounds >= 2 && cswRamTelemetry.lastP1Rounds < 2) {
        const now = Date.now();
        if (now - cswRamTelemetry.lastWinSignalMs > 5000) {
          cswRamTelemetry.lastWinSignalMs = now;
          const winScore = Math.max(cswRamTelemetry.peakScore, 15000);
          cswRamTelemetry.peakScore = winScore;
          emitRamAutoScore(winScore, 'victory');
        }
      }

      // 2. Détection de DÉFAITE / GAME OVER via les vies ou rounds perdus dans la RAM
      if (p2Rounds !== null && p2Rounds >= 2 && cswRamTelemetry.lastP2Rounds < 2) {
        emitRamLossCreditSignal('match_lost_ram');
      } else if (lives !== null && cswRamTelemetry.lastLives !== null) {
        if (cswRamTelemetry.lastLives > 0 && lives === 0 && cswRamTelemetry.hadActivePlay) {
          emitRamLossCreditSignal('lives_zero_ram');
        }
      }

      // 3. Détection universelle de Game Over -> Recommencer (le score RAM retombe brutalement de >50 à 0)
      if (cswRamTelemetry.hadActivePlay && cswRamTelemetry.peakScore >= 50 && cswRamTelemetry.lastScore >= 50 && score === 0) {
        emitRamLossCreditSignal('score_reset_restart_ram');
      }

      // 4. Sauvegarde automatique continue dès qu'un nouveau palier de score RAM significatif est atteint (>= 2 pts pour sports, >= 10 pts pour arcade)
      if (cswRamTelemetry.peakScore >= 2 && cswRamTelemetry.peakScore > cswRamTelemetry.lastSavedScore) {
        emitRamAutoScore(cswRamTelemetry.peakScore, 'milestone');
      }

      cswRamTelemetry.lastScore = score;
      if (lives !== null) cswRamTelemetry.lastLives = lives;
      if (p1Rounds !== null) cswRamTelemetry.lastP1Rounds = p1Rounds;
      if (p2Rounds !== null) cswRamTelemetry.lastP2Rounds = p2Rounds;

      notifyParent('RAM_TELEMETRY_TICK', {
        score: Math.max(score, cswRamTelemetry.peakScore),
        liveScore: score,
        lives,
        mode: cswRamTelemetry.profile ? 'profile' : 'heuristic',
      });
    }

    function startRamTelemetry(gameTitle, core) {
      if (cswRamTelemetry.timer) clearInterval(cswRamTelemetry.timer);
      const lowerCore = String(core || '').toLowerCase();
      const lowerTitle = String(gameTitle || '').toLowerCase();
      cswRamTelemetry.core = lowerCore;
      cswRamTelemetry.gameTitle = gameTitle || '';
      cswRamTelemetry.profile =
        RAM_GAME_PROFILES.find((p) => p.cores.includes(lowerCore) && p.match.test(lowerTitle)) || null;
      cswRamTelemetry.peakScore = 0;
      cswRamTelemetry.lastSavedScore = 0;
      cswRamTelemetry.lastScore = 0;
      cswRamTelemetry.lastLives = null;
      cswRamTelemetry.lastP1Rounds = 0;
      cswRamTelemetry.lastP2Rounds = 0;
      cswRamTelemetry.hadActivePlay = false;
      cswRamTelemetry.prevSnapshot = null;
      cswRamTelemetry.scoreCandidates.clear();
      cswRamTelemetry.lockedScoreAddr = null;
      cswRamTelemetry.livesCandidates.clear();
      cswRamTelemetry.lockedLivesAddr = null;

      const intervalMs = isHeavy3dCore(lowerCore) ? 1500 : 900;
      cswRamTelemetry.timer = setInterval(tickRamTelemetry, intervalMs);
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin || !event.data) return;
      const msg = event.data;

      if (msg.type === 'UPDATE_COINS') {
        const hud = document.getElementById('credits-hud');
        const ov = document.getElementById('insert-coin-overlay');
        const c = Number(msg.coins ?? 0);
        targetWalletCoins = c;
        if (hud) hud.textContent = `CRÉDITS : ${String(c).padStart(2, '0')}/99`;
        if (ov) ov.hidden = !msg.locked;
        writeCreditsToRam(c);
        try {
          if (msg.locked) window.EJS_emulator?.pause?.();
          else if (msg.resume) window.EJS_emulator?.play?.();
        } catch {}
        return;
      }

      if (msg.type === 'FORWARD_KEY') {
        const isDown = msg.eventType === 'keydown';
        const kc = Number(msg.keyCode || 0);
        const code = msg.code || '';
        const myPort = netplayPlayerIndex === 1 ? 1 : 0;
        if (code === 'Digit5' || code === 'Numpad5') {
          if (isDown) forceSyncCreditsToRam();
          return;
        }
        handleUniversalKeyboardBridge(code, kc, isDown);
        const btnIdx = findLocalButtonIndex(kc);
        if (btnIdx >= 0) {
          simulateEmuInput(myPort, btnIdx, isDown);
        }
        return;
      }

      if (msg.type === 'PAUSE_EMU') {
        try { window.EJS_emulator?.pause?.(); } catch {}
        return;
      }

      if (msg.type === 'RESUME_EMU') {
        try {
          window.EJS_emulator?.play?.();
          window.focus();
        } catch {}
        return;
      }

      if (msg.type === 'EXPORT_STATE') {
        try {
          const state = window.EJS_emulator?.gameManager?.getState?.();
          if (state) {
            const bytes = state instanceof Uint8Array ? state : new Uint8Array(state);
            // Pour la synchro cloud auto en arrière-plan, ignorer les blobs > 12 Mo pour éviter tout freeze
            if (msg.slot === 'cloud_handoff' && bytes.length > 12 * 1024 * 1024) {
              return;
            }
            let screenshotDataUrl = null;
            if (msg.slot !== 'cloud_handoff' && msg.slot !== 'frame0') {
              try {
                const srcCanvas = document.querySelector('#game canvas');
                if (srcCanvas && srcCanvas.width > 0 && srcCanvas.height > 0) {
                  const thumb = document.createElement('canvas');
                  const maxW = 320;
                  const scale = Math.min(1, maxW / srcCanvas.width);
                  thumb.width = Math.max(1, Math.round(srcCanvas.width * scale));
                  thumb.height = Math.max(1, Math.round(srcCanvas.height * scale));
                  const tctx = thumb.getContext('2d');
                  if (tctx) {
                    tctx.drawImage(srcCanvas, 0, 0, thumb.width, thumb.height);
                    screenshotDataUrl = thumb.toDataURL('image/jpeg', 0.7);
                  }
                }
              } catch {}
            }
            notifyParent('STATE_EXPORTED', {
              stateBase64: bytesToBase64(bytes),
              slot: msg.slot || 'quick',
              screenshotDataUrl,
            });
          }
        } catch {}
        return;
      }

      if (msg.type === 'LOAD_STATE' && msg.stateBase64) {
        try {
          const bin = atob(msg.stateBase64);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          window.EJS_emulator?.gameManager?.loadState?.(bytes);
        } catch {}
        return;
      }

      if (msg.type === 'UPDATE_DISPLAY') {
        applyDisplay(msg);
        return;
      }

      if (msg.type === 'NETPLAY_REMOTE_BTN') {
        const remotePort = netplayPlayerIndex === 1 ? 0 : 1;
        const btnIdx = Number(msg.buttonIdx);
        const pressed = Boolean(msg.pressed);
        simulateEmuInput(remotePort, btnIdx, pressed);
        if (btnIdx === 4) simulateEmuInput(remotePort, 19, pressed);
        else if (btnIdx === 5) simulateEmuInput(remotePort, 18, pressed);
        else if (btnIdx === 6) simulateEmuInput(remotePort, 17, pressed);
        else if (btnIdx === 7) simulateEmuInput(remotePort, 16, pressed);
        const kc = window.EJS_emulator?.controls?.[remotePort]?.[btnIdx]?.value;
        if (kc) dispatchSyntheticKey(kc, pressed ? 'keydown' : 'keyup');
        return;
      }

      if (msg.type === 'FLUSH_RAM_SCORE') {
        if (cswRamTelemetry.peakScore > 0) {
          emitRamAutoScore(cswRamTelemetry.peakScore, msg.reason || 'session_end');
        }
        return;
      }

      if (msg.type === 'FORCE_SYNC_CREDITS') {
        try { window.focus(); } catch {}
        forceSyncCreditsToRam();
        return;
      }

      if (msg.type === 'SET_CUSTOM_TOUCH_PAD') {
        document.body.classList.toggle('csw-touch-pad', Boolean(msg.enabled));
        return;
      }

      if (msg.type === 'VIRTUAL_PAD_BTN') {
        const myPort = netplayPlayerIndex === 1 ? 1 : 0;
        const btnIdx = Number(msg.buttonIdx);
        const pressed = Boolean(msg.pressed);
        if (!simulateEmuInput(myPort, btnIdx, pressed)) {
          const kc = window.EJS_emulator?.controls?.[myPort]?.[btnIdx]?.value;
          if (kc) dispatchSyntheticKey(kc, pressed ? 'keydown' : 'keyup');
        }
        if (isNetplaySession) {
          notifyParent('NETPLAY_LOCAL_BTN', { buttonIdx: btnIdx, pressed });
        }
        return;
      }

      if (msg.type === 'PRESS_BUTTON') {
        const myPort = netplayPlayerIndex === 1 ? 1 : 0;
        const idx = msg.button === 'coin' ? 2 : 3;
        try { window.focus(); } catch {}
        pulseEmuButton(myPort, idx, 100);
        if (isNetplaySession) {
          notifyParent('NETPLAY_LOCAL_BTN', { buttonIdx: idx, pressed: true });
          setTimeout(() => notifyParent('NETPLAY_LOCAL_BTN', { buttonIdx: idx, pressed: false }), 100);
        }
        return;
      }

      if (msg.type === 'BOOT_EMU' && !started) {
        started = true;
        currentCoreName = msg.core || 'fbneo';
        isNetplaySession = Boolean(msg.isNetplay);
        netplayPlayerIndex = Number(msg.playerIndex ?? 0);
        applyDisplay(msg);

        const bootEl = document.getElementById('boot-msg');
        bootEl.querySelector('strong').textContent = `Chargement : ${msg.gameName || 'ROM'}`;
        bootEl.querySelector('span').textContent = `Moteur ${msg.core} (EmulatorJS)…`;

        (async () => {
          const isFbneo = msg.core === 'fbneo' || msg.core === 'arcade';
          const rawName = msg.filename || msg.fileBlob?.name || (msg.gameUrl ? msg.gameUrl.split('/').pop().split('?')[0] : '') || 'game.zip';
          const targetFilename = decodeURIComponent(rawName);
          const shortKey = targetFilename.replace(/\.[^.]+$/, '').toLowerCase();

          let romBytes = null;
          if (msg.fileBlob && typeof msg.fileBlob.arrayBuffer === 'function') {
            romBytes = new Uint8Array(await msg.fileBlob.arrayBuffer());
          }

          let neogeoBytes = null;
          if (isFbneo) {
            try {
              const biosRes = await fetch('/roms/neogeo.zip');
              if (biosRes.ok) {
                neogeoBytes = new Uint8Array(await biosRes.arrayBuffer());
              }
            } catch {}
          }

          // Intercepteur fetch + XHR pour servir la ROM avec son vrai nom de fichier (indispensable pour FBNeo et MAME)
          if (romBytes || neogeoBytes) {
            const _origFetch = window.fetch;
            window.fetch = async function(input, init) {
              const u = (typeof input === 'string' ? input : (input?.url || '')).toLowerCase();
              if (romBytes && (u.includes(targetFilename.toLowerCase()) || (shortKey && u.endsWith('/' + shortKey + '.zip')))) {
                const buf = romBytes.buffer.slice(romBytes.byteOffset, romBytes.byteOffset + romBytes.byteLength);
                return new Response(buf, {
                  status: 200,
                  statusText: 'OK',
                  headers: { 'Content-Type': 'application/octet-stream', 'Content-Length': String(romBytes.byteLength) }
                });
              }
              if (neogeoBytes && u.includes('neogeo.zip')) {
                const buf = neogeoBytes.buffer.slice(neogeoBytes.byteOffset, neogeoBytes.byteOffset + neogeoBytes.byteLength);
                return new Response(buf, {
                  status: 200,
                  statusText: 'OK',
                  headers: { 'Content-Type': 'application/zip', 'Content-Length': String(neogeoBytes.byteLength) }
                });
              }
              return _origFetch.apply(window, arguments);
            };

            const _origXHROpen = XMLHttpRequest.prototype.open;
            const _origXHRSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
              this._reqUrl = url ? String(url) : '';
              return _origXHROpen.apply(this, [method, url, ...rest]);
            };
            XMLHttpRequest.prototype.send = function(...args) {
              const u = (this._reqUrl || '').toLowerCase();
              const serveBuf = (bytes) => {
                const buf = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
                Object.defineProperty(this, 'status', { get: () => 200 });
                Object.defineProperty(this, 'statusText', { get: () => 'OK' });
                Object.defineProperty(this, 'response', { get: () => buf });
                Object.defineProperty(this, 'readyState', { get: () => 4 });
                this.getResponseHeader = (h) => {
                  if (!h) return null;
                  if (h.toLowerCase() === 'content-length') return String(buf.byteLength);
                  if (h.toLowerCase() === 'content-type') return 'application/octet-stream';
                  return null;
                };
                this.getAllResponseHeaders = () => 'content-type: application/octet-stream\r\ncontent-length: ' + buf.byteLength + '\r\n';
                setTimeout(() => {
                  if (typeof this.onreadystatechange === 'function') this.onreadystatechange();
                  if (typeof this.onload === 'function') this.onload();
                  this.dispatchEvent(new Event('load'));
                  this.dispatchEvent(new Event('loadend'));
                }, 5);
              };
              if (romBytes && (u.includes(targetFilename.toLowerCase()) || (shortKey && u.endsWith('/' + shortKey + '.zip')))) {
                serveBuf(romBytes);
                return;
              }
              if (neogeoBytes && u.includes('neogeo.zip')) {
                serveBuf(neogeoBytes);
                return;
              }
              return _origXHRSend.apply(this, args);
            };
          }

          const hw = readHardwareSettings();
          let ctrlCfg = buildControllersConfig(hw.controls, msg.core, hw) || buildControllersConfig({ p1: {}, p2: {} }, msg.core, hw);

          window.EJS_player = '#game';
          window.EJS_core = isFbneo ? 'arcade' : msg.core;
          window.EJS_gameName = isFbneo ? shortKey.toUpperCase() : (msg.gameName || 'CSW Game');
          window.EJS_gameUrl = romBytes ? targetFilename : (msg.gameUrl || targetFilename);
          window.EJS_biosUrl = isFbneo ? 'neogeo.zip' : '';
          if (isFbneo) {
            window.EJS_gameParentUrl = 'neogeo.zip';
            window.EJS_dontExtractBIOS = true;
            window.EJS_pathtodata = '/emulatorjs/';
            window.EJS_paths = {
              'fbneo-wasm.data': '/emulatorjs/cores/fbneo-wasm.data',
              'fbneo-legacy-wasm.data': '/emulatorjs/cores/fbneo-legacy-wasm.data',
              'fbneo.json': '/emulatorjs/cores/reports/fbneo.json',
              'version.json': '/emulatorjs/version.json',
            };
          } else {
            window.EJS_pathtodata = msg.localData ? '/emulatorjs/' : CDN_DATA;
          }
          window.EJS_startOnLoaded = true;
          window.EJS_color = msg.accent || '#3b82f6';
          if (ctrlCfg) window.EJS_defaultControls = ctrlCfg;
          const effectiveMuted = msg.muted ?? hw.audio?.muted ?? false;
          const effectiveVol = typeof msg.volume === 'number' ? msg.volume : (hw.audio?.volume ?? 80);
          window.EJS_volume = effectiveMuted ? 0 : effectiveVol / 100;
          applyHardwareSettings(hw);
          window.EJS_onGameStart = () => {
            bootEl.hidden = true;
            applyHardwareSettings(readHardwareSettings());
            try { window.focus(); } catch {}
            notifyParent('STAGE_STATUS', { status: 'playing', message: 'Émulateur démarré.' });
            startRamTelemetry(msg.gameName || targetFilename, msg.core);

            if (isNetplaySession && netplayPlayerIndex === 0) {
              // Séquence Fightcade déterministe (exécutée uniquement par l'Hôte P1) :
              // 1. Insérer 2 Coins pour P1 et 2 Coins pour P2
              // 2. Déclencher START 1 et START 2 pour lancer immédiatement le mode VERSUS 2 Joueurs
              // 3. Exporter le savestate Frame 0 APRÈS le Start pour synchroniser P2 exactement sur l'écran Versus
              setTimeout(() => {
                try {
                  pulseEmuButton(0, 2, 80); // Coin P1
                  setTimeout(() => pulseEmuButton(1, 2, 80), 140); // Coin P2
                  setTimeout(() => pulseEmuButton(0, 2, 80), 280); // 2e Coin P1
                  setTimeout(() => pulseEmuButton(1, 2, 80), 420); // 2e Coin P2

                  setTimeout(() => {
                    pulseEmuButton(0, 3, 100); // Start 1
                    setTimeout(() => {
                      pulseEmuButton(1, 3, 100); // Start 2 (Challenger !)
                      console.log('[CSW Fightcade Netplay] Auto-Start 2 Joueurs Versus activé (P1 + P2).');
                      setTimeout(() => {
                        try {
                          const state = window.EJS_emulator?.gameManager?.getState?.();
                          if (state) {
                            const bytes = state instanceof Uint8Array ? state : new Uint8Array(state);
                            notifyParent('STATE_EXPORTED', { stateBase64: bytesToBase64(bytes), slot: 'frame0' });
                          }
                        } catch {}
                      }, 350);
                    }, 350);
                  }, 900);
                } catch {}
              }, 1000);
            }
          };

          const script = document.createElement('script');
          script.src = `${window.EJS_pathtodata}loader.js`;
          script.onload = () => {
            setTimeout(() => { bootEl.hidden = true; }, 1800);
            notifyParent('STAGE_STATUS', { status: 'loaded', message: `Moteur ${msg.core} initialisé.` });
          };
          script.onerror = () => {
            bootEl.querySelector('strong').textContent = 'Impossible de charger le moteur';
            bootEl.querySelector('span').textContent = 'Vérifiez votre connexion Internet ou l’accès au CDN EmulatorJS.';
            notifyParent('STAGE_STATUS', { status: 'error', message: 'Échec chargement EmulatorJS.' });
          };
          document.head.append(script);
        })();
      }
    });

    notifyParent('STAGE_FRAME_READY');
  </script>
</body>
</html>
