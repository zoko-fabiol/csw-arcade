          this.gm?.functions?.setKeyboardEnabled?.(0);
        } catch {}
        const cleanFrame = Math.max(0, Number(syncFrame) || 0);
        this.spectatorWaitingSnapshot = false;
        this.currentFrame = cleanFrame;
        this.desyncStreak = 0;
        for (const k of this.spectatorInputMap.keys()) {
          if (k < cleanFrame) this.spectatorInputMap.delete(k);
        }
        this.savestateFrames.fill(-1);
        this.forceApplyAllInputs = true;
        this.applyInputs(0, 0);
        this.applyInputs(1, 0);
        if (!this.isWasmAsyncifyBusy()) {
          this.captureSnapshot(cleanFrame);
        }
        this.spectatorBufferHold = true;
        this.spectatorBufferWaitStartMs = performance.now();
        this.accumulatorMs = 0;
        this.lastTickMs = performance.now();
        this.stats.currentFrame = cleanFrame;
        this.stats.syncStatus = 'BUFFERING...';
        this.setSyncWaitMute(true);
        notifyParent('NETPLAY_SYNC_COMPLETE', { syncFrame: cleanFrame, isSpectator: true });
        console.log(`[CSW Spectateur] État live chargé à la Frame ${cleanFrame}, remplissage du tampon...`);
      }

      stepSpectatorLoop(now) {
        if (this.spectatorWaitingSnapshot) {
          this.lastTickMs = now;
          return;
        }
        if (!this.lastTickMs) this.lastTickMs = now;
        const dt = Math.max(0, Math.min(80, now - this.lastTickMs));
        this.lastTickMs = now;
        this.accumulatorMs = Math.min(this.FRAME_TIME_MS * 3, this.accumulatorMs + dt);
        if (this.accumulatorMs < 15.2) return;
        this.accumulatorMs -= this.FRAME_TIME_MS;

        const ahead = this.spectatorMaxFrame >= this.currentFrame ? this.spectatorMaxFrame - this.currentFrame + 1 : 0;
        if (this.spectatorBufferHold) {
          if (ahead < 10 && !(ahead >= 2 && now - this.spectatorBufferWaitStartMs > 850)) {
            return;
          }
          this.spectatorBufferHold = false;
          this.setSyncWaitMute(false);
          this.stats.syncStatus = 'LIVE';
        }

        const stepOneSpectatorFrame = () => {
          const f = this.currentFrame;
          const item = this.spectatorInputMap.get(f);
          if (!item) {
            if (this.spectatorMaxFrame > f + 45 && now - this.spectatorResyncRequestedMs > 3000) {
              this.spectatorResyncRequestedMs = now;
              notifyParent('NETPLAY_SPECTATE_RESYNC');
            }
            return false;
          }
          this.spectatorInputMap.delete(f);

          if (!this.isWasmAsyncifyBusy() && item.c > 0 && f > 0 && f % 30 === 0) {
            this.captureSnapshot(f);
            const localC = this.computeRamChecksum(f);
            const cSlot = f & this.BUFFER_MASK;
            this.localChecksums[cSlot] = localC;
            this.localChecksumFrames[cSlot] = f;
            if (localC && localC !== item.c) {
              this.desyncStreak += 1;
              if (this.desyncStreak >= 2 && now - this.spectatorResyncRequestedMs > 4000) {
                this.desyncStreak = 0;
                this.spectatorResyncRequestedMs = now;
                this.stats.syncStatus = 'RESYNC...';
                notifyParent('NETPLAY_SPECTATE_RESYNC');
              }
            } else {
              this.desyncStreak = 0;
              this.stats.syncStatus = 'LIVE';
            }
          }

          this.applyInputs(0, item.p1);
          this.applyInputs(1, item.p2);
          this.forceApplyAllInputs = false;
          if (this.originalMainLoopFunc) {
            this.originalMainLoopFunc();
          }
          this.currentFrame += 1;
          this.stats.currentFrame = this.currentFrame;
          this.fpsCount += 1;
          return true;
        };

        if (this.isWasmAsyncifyBusy()) return;
        stepOneSpectatorFrame();

        // Si le tampon spectateur accumule > 34 frames de retard, accélérer légèrement d'1 frame par tick pour coller au direct
        const remainingAhead = this.spectatorMaxFrame >= this.currentFrame ? this.spectatorMaxFrame - this.currentFrame + 1 : 0;
        if (!this.isWasmAsyncifyBusy() && (remainingAhead > 34 || this.accumulatorMs >= this.FRAME_TIME_MS)) {
          this.accumulatorMs = Math.max(0, this.accumulatorMs - this.FRAME_TIME_MS);
          stepOneSpectatorFrame();
        }

        const tNow = performance.now();
        if (tNow - this.lastFpsTimer >= 500) {
          this.stats.fps = Math.round((this.fpsCount * 1000) / (tNow - this.lastFpsTimer));
          this.fpsCount = 0;
          this.lastFpsTimer = tNow;
          this.stats.frameAdvantage = Math.max(0, this.spectatorMaxFrame - this.currentFrame + 1);
          notifyParent('ROLLBACK_TELEMETRY', { stats: { ...this.stats } });
        }
      }

      onMainLoopTick() {
        if (this.matchAborted || !this.isRunning) return;
        const now = performance.now();

        // GARDE ABSOLUE ASYNCIFY : ne jamais ré-entrer WASM ni exécuter loadState/getState pendant un unwind/sleep
        if (this.isWasmAsyncifyBusy()) {
          return;
        }

        // Phase 0 : Laisser ~30 frames à RetroArch/WebGL/OpenAL pour initialiser la mémoire & AudioContext
        if (!this.localWarmupDone) {
          if (this.warmupFramesLeft > 0) {
            this.warmupFramesLeft -= 1;
            if (this.originalMainLoopFunc) this.originalMainLoopFunc();
            this.lastTickMs = now;
            return;
          }
          this.localWarmupDone = true;
          this.setSyncWaitMute(true);
          try {
            this.gm?.setKeyboardEnabled?.(false);
            this.gm?.functions?.setKeyboardEnabled?.(0);
            this.gm?.functions?.setVSync?.(0);
            this.gm?.functions?.setFastForwardRatio?.(0);
          } catch {}

          notifyParent('NETPLAY_EMU_READY', { isHost: netplayPlayerIndex === 0, isSpectator: netplayPlayerIndex === 2 });
          if (netplayPlayerIndex === 2) {
            this.spectatorWaitingSnapshot = true;
            notifyParent('NETPLAY_SPECTATOR_READY');
            if (this.spectatorReadyTimer) clearInterval(this.spectatorReadyTimer);
            this.spectatorReadyTimer = setInterval(() => {
              if (this.spectatorWaitingSnapshot && !this.pendingSyncLoad && !this.matchAborted) {
                notifyParent('NETPLAY_SPECTATOR_READY');
              } else {
                clearInterval(this.spectatorReadyTimer);
                this.spectatorReadyTimer = null;
              }
            }, 900);
          } else if (netplayPlayerIndex === 0) {
            if (this.guestIsReady) {
              this.hostWaitingForGuestEmu = false;
              this.pendingHostExportSlot = 'frame0';
            } else {
              this.hostWaitingForGuestEmu = true;
              if (this.hostReadyTimer) clearInterval(this.hostReadyTimer);
              this.hostReadyTimer = setInterval(() => {
                if (this.hostWaitingForGuestEmu) {
                  notifyParent('NETPLAY_EMU_READY', { isHost: true });
                } else {
                  clearInterval(this.hostReadyTimer);
                  this.hostReadyTimer = null;
                }
              }, 500);
              setTimeout(() => {
                if (this.hostWaitingForGuestEmu) {
                  this.hostWaitingForGuestEmu = false;
                  this.pendingHostExportSlot = 'frame0';
                }
              }, 25000);
            }
          } else {
            this.waitingForFrame0 = true;
            notifyParent('NETPLAY_GUEST_READY');
            if (this.guestReadyTimer) clearInterval(this.guestReadyTimer);
            this.guestReadyTimer = setInterval(() => {
              if (this.waitingForFrame0 && !this.pendingSyncLoad) {
                notifyParent('NETPLAY_GUEST_READY');
              } else if (!this.waitingForFrame0) {
                clearInterval(this.guestReadyTimer);
                this.guestReadyTimer = null;
              }
            }, 450);
            // Ne jamais démarrer P2 tout seul au bout de 25s si P1 est encore en train de télécharger la ROM :
            // P2 reste synchronisé en attente de Frame 0 (délai de sécurité porté à 60s uniquement si la session est déjà active)
            setTimeout(() => {
              if (this.waitingForFrame0 && !this.pendingSyncLoad && this.hasRemotePeer) {
                this.waitingForFrame0 = false;
                this.resetAtFrame(0);
                this.setSyncWaitMute(false);
                notifyParent('NETPLAY_SYNC_COMPLETE', { syncFrame: 0 });
              }
            }, 60000);
          }
          this.lastTickMs = now;
          return;
        }

        // Phase 1A (Invité P2) : Appliquer FRAME0 / RESYNC de manière 100% synchrone au début d'un tick propre
        if (this.pendingSyncLoad) {
          const loadJob = this.pendingSyncLoad;
          this.pendingSyncLoad = null;
          try {
            this.gm = this.gm || window.EJS_emulator?.gameManager;
            this.gm?.loadState?.(loadJob.bytes);
            if (this.originalMainLoopFunc && !this.isWasmAsyncifyBusy()) {
              this.originalMainLoopFunc(); // Flush tick: applique réellement loadJob.bytes en RAM avant captureSnapshot(syncFrame)
            }
            this.onRemoteSyncStateLoaded(loadJob.syncFrame);
          } catch (err) {
            console.warn('[CSW GGPO] Erreur sync loadState:', err);
            this.waitingForFrame0 = false;
            this.waitingForGoAck = false;
            this.setSyncWaitMute(false);
            notifyParent('NETPLAY_SYNC_COMPLETE', { syncFrame: 0 });
          }
          this.lastTickMs = performance.now();
          return;
        }

        // Phase 1B (Hôte P1) : Exporter Frame 0 ou Resync sur un tick propre hors Asyncify
        if (netplayPlayerIndex === 0 && this.pendingHostExportSlot) {
          const slot = this.pendingHostExportSlot;
          this.pendingHostExportSlot = null;
          this.exportAndLockSyncState(slot, true);
          this.lastTickMs = performance.now();
          return;
        }

        // Phase 1C (Spectateur en lecture seule) : rejouer les inputs confirmés du match en différé tamponné 60 FPS
        if (netplayPlayerIndex === 2) {
          this.stepSpectatorLoop(now);
          return;
        }

        // Phase 1C (Hôte P1) : Patienter jusqu'à ce que le moteur WASM de l'Invité soit prêt
        if (netplayPlayerIndex === 0 && this.hostWaitingForGuestEmu) {
          this.lastTickMs = now;
          return;
        }

        // 2. Dépouiller les paquets réseau GGPO reçus (0x5A / 0x5B / 0x5C / 0xCB / 0xCC)
        this.processIncomingPackets();
        if (netplayPlayerIndex === 0) {
          this.advanceConfirmedWatermark();
          this.processSpectatorStreaming();
        }

        // 3. Barrière Frame 0 / Départ Simultané
        if (this.waitingForFrame0) {
          this.lastTickMs = now;
          return;
        }
        if (this.waitingForGoAck) {
          if (now - this.waitingForGoAckSinceMs < 220) {
            this.lastTickMs = now;
            return;
          }
          this.onFrame0GoReceived(0);
        }
        if (this.waitingForFrame0Ack) {
          if (now - this.waitingForFrame0AckSinceMs < 4500) {
            this.lastTickMs = now;
            return;
          }
          this.waitingForFrame0Ack = false;
          this.setSyncWaitMute(false);
          notifyParent('NETPLAY_SYNC_COMPLETE', { syncFrame: 0 });
        }
        if (this.hostGoDelayUntilMs > 0) {
          if (now < this.hostGoDelayUntilMs) {
            this.lastTickMs = now;
            return;
          }
          const releaseFrame = this.hostGoPendingFrame || 0;
          this.hostGoDelayUntilMs = 0;
          this.accumulatorMs = 0;
          this.lastTickMs = now;
          this.setSyncWaitMute(false);
          notifyParent('NETPLAY_SYNC_COMPLETE', { syncFrame: releaseFrame });
          console.log(`[CSW GGPO] Départ simultané P1 <-> P2 (Frame ${releaseFrame}) !`);
        }

        // 4. Accumulateur d'horloge 60.00 FPS + Time-Rift Sync symétrique GGPO (±3 % doux, sans saccade)
        const peerActive = this.hasRemotePeer && now - this.lastRemotePacketMs < 3000;
        const localAdv = peerActive ? this.currentFrame - this.remoteFrameAdvancement : 0;
        const symmetricRift = peerActive ? (localAdv - (this.peerReportedAdvantage || 0)) * 0.5 : 0;
        const effectiveFrameMs =
          peerActive && Math.abs(symmetricRift) > 0.6
            ? Math.max(16.15, Math.min(17.25, this.FRAME_TIME_MS + symmetricRift * 0.16))
            : this.FRAME_TIME_MS;

        if (!this.lastTickMs) this.lastTickMs = now;
        const dt = Math.max(0, Math.min(80, now - this.lastTickMs));
        this.lastTickMs = now;
        this.accumulatorMs = Math.min(effectiveFrameMs * 2.5, this.accumulatorMs + dt);

        if (this.accumulatorMs < effectiveFrameMs * 0.92) {
          return;
        }
        this.accumulatorMs -= effectiveFrameMs;

        // 5. Garde anti-dérive extrême uniquement si l'écart dépasse 10 frames (borné à 220ms max)
        const advantage = symmetricRift;

        if (peerActive && advantage >= 10) {
          if (!this.lastPaceHoldMs) this.lastPaceHoldMs = now;
          if (now - this.lastPaceHoldMs < 220) {
            return;
          }
          this.lastPaceHoldMs = now;
        } else {
          this.lastPaceHoldMs = 0;
        }

        // 5B. Mode Delay-Based Lockstep déterministe automatique pour les consoles 3D lourdes (PS1, N64, PSP, NDS)
        if (peerActive && isHeavy3dCore(currentCoreName) && this.currentFrame >= this.INPUT_DELAY) {
          const adaptive3dDelay = Math.min(5, Math.max(2, Math.ceil((this.peerPingMs || 40) / 32)));
          if (adaptive3dDelay > this.INPUT_DELAY) {
            this.INPUT_DELAY = adaptive3dDelay;
          }
          const curSlot = this.currentFrame & this.BUFFER_MASK;
          const hasConfirmed3dInput =
            this.remoteFrameNums[curSlot] === this.currentFrame && this.remoteConfirmed[curSlot] === 1;
          if (!hasConfirmed3dInput) {
            if (!this.lockstepWaitSinceMs) {
              this.lockstepWaitSinceMs = now;
            }
            if (now - this.lockstepWaitSinceMs < 75) {
              this.accumulatorMs = Math.min(this.accumulatorMs + effectiveFrameMs, effectiveFrameMs * 1.2);
              return;
            }
          }
          this.lockstepWaitSinceMs = 0;
        } else {
          this.lockstepWaitSinceMs = 0;
        }

        if (this.isWasmAsyncifyBusy()) return;
        this.stepOneFrame();
        if (netplayPlayerIndex === 0) {
          this.advanceConfirmedWatermark();
          this.processSpectatorStreaming();
        }

        // Ne jamais ré-entrer WASM pour une 2e frame si Asyncify vient de déclencher un unwind ou pendant les 6 premières frames
        if (
          this.currentFrame >= 6 &&
          !this.isWasmAsyncifyBusy() &&
          ((peerActive && advantage <= -2) || this.accumulatorMs >= this.FRAME_TIME_MS)
        ) {
          this.accumulatorMs = Math.max(0, this.accumulatorMs - this.FRAME_TIME_MS);
          this.processIncomingPackets();
          if (!this.isWasmAsyncifyBusy()) {
            this.stepOneFrame();
            if (netplayPlayerIndex === 0) {
              this.advanceConfirmedWatermark();
              this.processSpectatorStreaming();
            }
          }
        }
      }

      stop() {
        this.matchAborted = true;
        this.isRunning = false;
        this.waitingForFrame0 = false;
        this.waitingForFrame0Ack = false;
        this.waitingForGoAck = false;
        this.spectatorWaitingSnapshot = false;
        this.pendingSyncLoad = null;
        this.pendingHostExportSlot = null;
        this.pendingSpectatorTargets = [];
        this.spectatorFrameBuffer = [];
        this.spectatorInputMap.clear();
        if (this.spectatorReadyTimer) {
          clearInterval(this.spectatorReadyTimer);
          this.spectatorReadyTimer = null;
        }
        if (this.guestReadyTimer) {
          clearInterval(this.guestReadyTimer);
          this.guestReadyTimer = null;
        }
        if (this.hostReadyTimer) {
          clearInterval(this.hostReadyTimer);
          this.hostReadyTimer = null;
        }
        if (cswRamTelemetry.timer) {
          clearInterval(cswRamTelemetry.timer);
          cswRamTelemetry.timer = null;
        }
        if (netplayGamepadRafId) {
          cancelAnimationFrame(netplayGamepadRafId);
          netplayGamepadRafId = null;
        }
        this.setSyncWaitMute(true);
        try { window.EJS_emulator?.pause?.(); } catch {}
        console.log('[CSW GGPO] Match arrêté net.');
      }

      start() {
        if (!isNetplaySession || this.isRunning || this.matchAborted) return;
        this.gm = window.EJS_emulator?.gameManager;
        this.module = getWasmModule();
        this.isRunning = true;
        this.localWarmupDone = false;
        this.warmupFramesLeft = 30;
        this.hostSetupCompleted = netplayPlayerIndex !== 0;
        this.lastFpsTimer = performance.now();
        this.lastTickMs = performance.now();

        try {
          this.gm?.setKeyboardEnabled?.(false);
          this.gm?.functions?.setKeyboardEnabled?.(0);
        } catch {}

        const attachHook = () => {
          this.gm = this.gm || window.EJS_emulator?.gameManager;
          this.module = this.module || getWasmModule();
          try {
            this.gm?.setKeyboardEnabled?.(false);
            this.gm?.functions?.setKeyboardEnabled?.(0);
            this.gm?.functions?.setVSync?.(0);
            this.gm?.functions?.setFastForwardRatio?.(0);
          } catch {}

          // 1. Cœur moderne Emscripten 3.1+ (fbneo_libretro.js) où MainLoop est exposé par l'intercepteur Blob
          const mainLoopObj = this.module?.MainLoop;
          if (mainLoopObj && typeof mainLoopObj.runIter === 'function' && !this.hookAttached) {
            const origRunIter = mainLoopObj.runIter.bind(mainLoopObj);
            this.originalMainLoopFunc = () => {
              if (mainLoopObj.func) origRunIter(mainLoopObj.func);
            };
            const self = this;
            mainLoopObj.runIter = function (func) {
              if (!mainLoopObj.func && func) mainLoopObj.func = func;
              if (self.isRunning && isNetplaySession) {
                self.onMainLoopTick();
              } else {
                origRunIter(func);
              }
            };
            this.hookAttached = true;
            console.log('[CSW GGPO] ✓ Hook 60.00 FPS + 128-Frame Rollback attaché sur Module.MainLoop.runIter !');
            return true;
          }

          // 2. Cœur Emscripten legacy avec Module.Browser.mainLoop
          const ml = this.module?.Browser?.mainLoop;
          if (ml && typeof ml.func === 'function' && !this.hookAttached) {
            this.originalMainLoopFunc = ml.func;
            const self = this;
            ml.func = function () {
              if (self.isRunning && isNetplaySession) {
                self.onMainLoopTick();
              } else if (self.originalMainLoopFunc) {
                self.originalMainLoopFunc.apply(this, arguments);
              }
            };
            this.hookAttached = true;
            console.log('[CSW GGPO] ✓ Hook 60.00 FPS + 128-Frame Rollback attaché sur Module.Browser.mainLoop.func !');
            return true;
          }
          return false;
        };

        if (!attachHook()) {
          const checkInterval = setInterval(() => {
            if (attachHook()) clearInterval(checkInterval);
          }, 25);
        }
      }
    }

    window.__cswGgpoEngine = new CswGgpoEngine();

    window.addEventListener('pointerdown', () => {
      try { window.focus(); } catch {}
    });

    window.addEventListener('keydown', (e) => {

        handleUniversalKeyboardBridge(e.code || '', e.keyCode || e.which, false);

    // =========================================================================
    // MOTEUR UNIVERSEL DE TÉLÉMÉTRIE RAM (Scores Auto + Détection Perte / Game Over / Victoire)
    // Fonctionne sur Arcade, Sega Mega Drive, PlayStation, Nintendo (NES/SNES/N64/GBA)
    // =========================================================================
    const RAM_GAME_PROFILES = [
      {
        match: /sonic.*2/i,
        cores: ['segamd', 'genesis_plus_gx', 'picodrive'],
        read(ram) {
          if (ram.length < 0xFF00) return null;
          const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
          return {
            lives: ram[0xFE12],
            rings: dv.getUint16(0xFE20, false),
            score: dv.getUint32(0xFE26, false) * 10,
          };
        },
      },
      {
        match: /sonic/i,
        cores: ['segamd', 'genesis_plus_gx', 'picodrive'],
        read(ram) {
          if (ram.length < 0xFF00) return null;
          const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
          return {
            lives: ram[0xFE12],
            rings: dv.getUint16(0xFE20, false),
            score: dv.getUint32(0xFE26, false) * 10,
          };
        },
      },
      {
        match: /streets.*rage.*2|bare.*knuckle.*2/i,
        cores: ['segamd', 'genesis_plus_gx', 'picodrive'],
        read(ram) {
          if (ram.length < 0xF000) return null;
          const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
          return {
            lives: ram[0xEF4A],
            score: dv.getUint32(0xEF4C, false),
          };
        },
      },
      {
        match: /super.*mario.*world/i,
        cores: ['snes', 'snes9x'],
        read(ram) {
          if (ram.length < 0x1000) return null;
          const s = ram[0x0F34] | (ram[0x0F35] << 8) | (ram[0x0F36] << 16);
          return {
            lives: ram[0x0DBE] + 1,
            score: s * 10,
          };
        },
      },
      {
        match: /super.*mario.*bros/i,
        cores: ['nes', 'fceumm', 'nestopia'],
        read(ram) {
          if (ram.length < 0x0800) return null;
          let sc = 0;
          for (let i = 0; i < 6; i++) {
            const d = ram[0x07DD + i];
            if (d > 9) return null;
            sc = sc * 10 + d;
          }
          return {
            lives: ram[0x075A] === 0xFF ? 0 : ram[0x075A] + 1,
            score: sc * 10,
          };
        },
      },
      {
        match: /tekken.*3/i,
        cores: ['psx', 'ps1', 'pcsx_rearmed'],
        read(ram) {
          if (ram.length < 0x0B0000) return null;
          const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
          const p1Rounds = ram[0x0A96B4];
          const p2Rounds = ram[0x0AAFA0];
          const rawScore = dv.getUint32(0x0A96A8, true);
          return {
            lives: Math.max(0, 2 - Math.min(2, p2Rounds)),
            p1Rounds,
            p2Rounds,
            score: rawScore < 50000000 ? rawScore : 0,
          };
        },
      },
      {
        match: /crash.*bandicoot/i,
        cores: ['psx', 'ps1', 'pcsx_rearmed'],
        read(ram) {
          if (ram.length < 0x070000) return null;
          const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
          const lives = dv.getUint16(0x061904, true) >> 8;
          const wumpa = dv.getUint16(0x0618EC, true) >> 8;
          return {
            lives: lives <= 99 ? lives : null,
            score: wumpa <= 99 ? wumpa * 100 : 0,
          };
        },
      },
    ];

    const cswRamTelemetry = {
      timer: null,
      profile: null,
      core: 'fbneo',
      gameTitle: '',
      peakScore: 0,
      lastSavedScore: 0,
      lastMilestoneEmitMs: 0,
      lastScore: 0,
      lastLives: null,
      lastP1Rounds: 0,
      lastP2Rounds: 0,
      lastLossSignalMs: 0,
      lastWinSignalMs: 0,
      hadActivePlay: false,
      // Scanner heuristique universel pour tout jeu sans profil fixe
      prevSnapshot: null,
      scoreCandidates: new Map(), // offset -> { hits, val, type }
      lockedScoreAddr: null, // { offset, type }
      livesCandidates: new Map(), // offset -> { initial, val, drops }
      lockedLivesAddr: null,
    };

    function getSystemRamView() {
      try {
        const mod = getWasmModule();
        if (mod && mod.HEAPU8 && typeof mod._retro_get_memory_data === 'function' && typeof mod._retro_get_memory_size === 'function') {
          const ptr = mod._retro_get_memory_data(2); // RETRO_MEMORY_SYSTEM_RAM
          const size = mod._retro_get_memory_size(2);
          if (ptr > 0 && size >= 512 && ptr + size <= mod.HEAPU8.length) {
            return { ram: mod.HEAPU8.subarray(ptr, ptr + size), isRawSystemRam: true };
          }
        }
        if (isNetplaySession) {
          const ggpo = window.__cswGgpoEngine;
          if (!ggpo?.isActive() || ggpo.isWasmAsyncifyBusy()) return null;
          const snap = ggpo.getLatestSnapshotBytes();
          return snap && snap.length > 4096 ? { ram: snap, isRawSystemRam: false } : null;
        }
        // Savestate RAM complet (fallback si _retro_get_memory_data absent) : limiter la fréquence pour éviter tout micro-freeze WASM
        const now = performance.now();
        if (cswRamTelemetry.lastSavestateScanMs && now - cswRamTelemetry.lastSavestateScanMs < 2200) {
          return null;
        }
        cswRamTelemetry.lastSavestateScanMs = now;
        const state = window.EJS_emulator?.gameManager?.getState?.();
        if (state && state.length > 4096) {
          const bytes = state instanceof Uint8Array ? state : new Uint8Array(state);
          return { ram: bytes, isRawSystemRam: false };
        }
      } catch {}
      return null;
    }

    function readBcd3(buf, off) {
      if (off < 0 || off + 3 > buf.length) return -1;
      const b0 = buf[off], b1 = buf[off + 1], b2 = buf[off + 2];
      const h0 = b0 >> 4, l0 = b0 & 0xF;
      const h1 = b1 >> 4, l1 = b1 & 0xF;
      const h2 = b2 >> 4, l2 = b2 & 0xF;
      if (h0 > 9 || l0 > 9 || h1 > 9 || l1 > 9 || h2 > 9 || l2 > 9) return -1;
      return (h0 * 10 + l0) * 10000 + (h1 * 10 + l1) * 100 + (h2 * 10 + l2);
    }

    function readBcd4(buf, off) {
      if (off < 0 || off + 4 > buf.length) return -1;
      const b0 = buf[off], b1 = buf[off + 1], b2 = buf[off + 2], b3 = buf[off + 3];
      const h0 = b0 >> 4, l0 = b0 & 0xF;
      const h1 = b1 >> 4, l1 = b1 & 0xF;
      const h2 = b2 >> 4, l2 = b2 & 0xF;
      const h3 = b3 >> 4, l3 = b3 & 0xF;
      if (h0 > 9 || l0 > 9 || h1 > 9 || l1 > 9 || h2 > 9 || l2 > 9 || h3 > 9 || l3 > 9) return -1;
      return (h0 * 10 + l0) * 1000000 + (h1 * 10 + l1) * 10000 + (h2 * 10 + l2) * 100 + (h3 * 10 + l3);
    }

    function readHeuristicValue(ram, addr) {
      if (!addr || addr.offset < 0 || addr.offset + 4 > ram.length) return 0;
      const dv = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
      if (addr.type === 'bcd4') {
        const v = readBcd4(ram, addr.offset);
        return v >= 0 ? v : 0;
      }
      if (addr.type === 'bcd3') {
        const v = readBcd3(ram, addr.offset);
        return v >= 0 ? v : 0;
      }
      if (addr.type === 'u32be') return dv.getUint32(addr.offset, false);
      if (addr.type === 'u32le') return dv.getUint32(addr.offset, true);
      if (addr.type === 'u16be') return dv.getUint16(addr.offset, false);
      if (addr.type === 'u16le') return dv.getUint16(addr.offset, true);
      return 0;
    }

    function isLowScoreSportsTitle(title) {
      return /street.*hoop|dunk.*dream|windjammer|flying.*power.*disc|super.*sidekick|soccer|football|futsal|goal.*goal|tennis|golf|baseball|bowling|volleyball|hockey|nba|fifa/i.test(
        String(title || '')
      );
    }

    function bumpScoreCandidate(key, offset, type, curVal, prevVal, requiredHits) {
      const existing = cswRamTelemetry.scoreCandidates.get(key);
      // Ne jamais verrouiller une adresse heuristique déjà énorme dès l'initialisation (compteur CPU/VRAM)
      if (!existing && (prevVal > 150000 || curVal > 5000000)) {
        return null;
      }
      const rec = existing || {
        offset,
        type,
        hits: 0,
        val: prevVal,
        sameTicks: 0,
      };
      // Rejeter si la valeur précédente enregistrée ne correspond pas à une progression monotone
      if (curVal < rec.val || curVal - rec.val > 50000) {
        cswRamTelemetry.scoreCandidates.delete(key);
        return null;
      }
      rec.hits += 1;
      rec.val = curVal;
      cswRamTelemetry.scoreCandidates.set(key, rec);
      if (rec.hits >= requiredHits) {
        cswRamTelemetry.lockedScoreAddr = { offset, type };
        return curVal;
      }
      return null;
    }

    function runHeuristicRamScan(ram, isRawSystemRam = false) {
      // Scanner jusqu'à 6 Mo de RAM / Savestate (FBNeo Neo Geo / CPS2 / PS1) grâce au diff 32-bit (< 3ms/tick)
      const scanLen = Math.min(ram.length, 6291456) & ~3;
      if (scanLen < 1024) return { score: cswRamTelemetry.lastScore, lives: cswRamTelemetry.lastLives };

      const isLowScoreSports = isLowScoreSportsTitle(cswRamTelemetry.gameTitle);
      const maxHeuristicScore = isLowScoreSports ? 300 : 5000000;
      const hits32 = isRawSystemRam ? 3 : 4;
      const hits16 = isLowScoreSports ? 3 : 4;

      const prev = cswRamTelemetry.prevSnapshot;
      if (!prev || prev.length !== scanLen) {
        cswRamTelemetry.prevSnapshot = new Uint8Array(ram.subarray(0, scanLen));
        return { score: cswRamTelemetry.lastScore, lives: cswRamTelemetry.lastLives };
      }

      // 1. Si l'adresse de score est déjà verrouillée, la lire directement avec garde anti-saut absurde
      let detectedScore = cswRamTelemetry.lastScore;
      if (cswRamTelemetry.lockedScoreAddr) {
        const v = readHeuristicValue(ram, cswRamTelemetry.lockedScoreAddr);
        const hugeSpike =
          cswRamTelemetry.lastScore > 0 && v - cswRamTelemetry.lastScore > (isLowScoreSports ? 30 : 250000);
        if (v <= maxHeuristicScore && !hugeSpike) {
          detectedScore = v;
        } else {
          cswRamTelemetry.lockedScoreAddr = null;
          cswRamTelemetry.scoreCandidates.clear();
          detectedScore = 0;
        }
      } else {
        const cur32 = new Uint32Array(ram.buffer, ram.byteOffset, scanLen >> 2);
        const prev32 = new Uint32Array(prev.buffer, prev.byteOffset, scanLen >> 2);
        const dvCur = new DataView(ram.buffer, ram.byteOffset, scanLen);
        const dvPrev = new DataView(prev.buffer, prev.byteOffset, scanLen);
        const words = scanLen >> 2;

        // Invalider les candidats qui ont diminué ou dépassé le plafond plausible
        for (const [k, rec] of cswRamTelemetry.scoreCandidates.entries()) {
          const curV = readHeuristicValue(ram, rec);
          if (curV < rec.val || curV > maxHeuristicScore || curV - rec.val > 50000) {
            cswRamTelemetry.scoreCandidates.delete(k);
          }
        }

        for (let w = 16; w < words - 2; w++) {
          if (cur32[w] === prev32[w]) continue; // Saute instantanément 99.5% de la RAM inchangée
          const base = w << 2;

          // Tester les alignements 2 octets (base+0, base+2 : standard Motorola 68000 Neo Geo / Mega Drive)
          // et 1 octet (base+0..3 : BCD 3/4 octets)
          for (let sub = 0; sub < 4; sub++) {
            const off = base + sub;
            if (off + 4 >= scanLen) break;

            if (!isLowScoreSports) {
              // A. BCD 4 octets (8 chiffres : Metal Slug, KOF, Neo Geo, Capcom)
              const b4Cur = readBcd4(ram, off);
              const b4Prev = readBcd4(prev, off);
              if (b4Cur > b4Prev && b4Prev >= 0 && b4Prev <= 150000 && b4Cur <= maxHeuristicScore) {
                const diff = b4Cur - b4Prev;
                if (diff >= 10 && diff <= 20000 && diff % 10 === 0) {
                  const locked = bumpScoreCandidate(`bcd4_${off}`, off, 'bcd4', b4Cur, b4Prev, hits32);
                  if (locked !== null) { detectedScore = locked; break; }
                }
              }

              // B. BCD 3 octets (6 chiffres)
              const b3Cur = readBcd3(ram, off);
              const b3Prev = readBcd3(prev, off);
              if (b3Cur > b3Prev && b3Prev >= 0 && b3Prev <= 150000 && b3Cur <= 999999) {
                const diff = b3Cur - b3Prev;
                if (diff >= 10 && diff <= 20000 && diff % 10 === 0) {
                  const locked = bumpScoreCandidate(`bcd3_${off}`, off, 'bcd3', b3Cur, b3Prev, hits32);
                  if (locked !== null) { detectedScore = locked; break; }
                }
              }
            }

            // Pour u32 / u16, vérifier les offsets pairs (sub === 0 || sub === 2)
            if ((sub & 1) === 0) {
              if (!isLowScoreSports) {
                // C. u32 Big-Endian (Neo Geo MVS & Sega Mega Drive 68000)
                const beCur = dvCur.getUint32(off, false);
                const bePrev = dvPrev.getUint32(off, false);
                if (beCur > bePrev && bePrev <= 150000 && beCur <= maxHeuristicScore) {
                  const diff = beCur - bePrev;
                  if (diff >= 10 && diff <= 20000 && diff % 10 === 0) {
                    const locked = bumpScoreCandidate(`u32be_${off}`, off, 'u32be', beCur, bePrev, hits32);
                    if (locked !== null) { detectedScore = locked; break; }
                  }
                }

                // D. u32 Little-Endian (PlayStation PS1, SNES, GBA, N64)
                const leCur = dvCur.getUint32(off, true);
                const lePrev = dvPrev.getUint32(off, true);
                if (leCur > lePrev && lePrev <= 150000 && leCur <= maxHeuristicScore) {
                  const diff = leCur - lePrev;
                  if (diff >= 10 && diff <= 20000 && diff % 10 === 0) {
                    const locked = bumpScoreCandidate(`u32le_${off}`, off, 'u32le', leCur, lePrev, hits32);
                    if (locked !== null) { detectedScore = locked; break; }
                  }
                }
              }

              // E. u16 Big-Endian & Little-Endian (Jeux de sport ex: Street Hoop +2/+3 pts, NES, Arcade)
              const u16beCur = dvCur.getUint16(off, false);
              const u16bePrev = dvPrev.getUint16(off, false);
              if (u16beCur > u16bePrev && u16bePrev <= 150 && u16beCur <= 300) {
                const diff = u16beCur - u16bePrev;
                if (diff >= 1 && diff <= 6) {
                  const locked = bumpScoreCandidate(`u16be_${off}`, off, 'u16be', u16beCur, u16bePrev, hits16);
                  if (locked !== null) { detectedScore = locked; break; }
                }
              }

              const u16leCur = dvCur.getUint16(off, true);
              const u16lePrev = dvPrev.getUint16(off, true);
              if (u16leCur > u16lePrev && u16lePrev <= 150 && u16leCur <= 300) {
                const diff = u16leCur - u16lePrev;
                if (diff >= 1 && diff <= 6) {
                  const locked = bumpScoreCandidate(`u16le_${off}`, off, 'u16le', u16leCur, u16lePrev, hits16);
                  if (locked !== null) { detectedScore = locked; break; }
                }
              }
            }
          }
          if (cswRamTelemetry.lockedScoreAddr) break;
        }
      }

      // 2. Suivi heuristique d'un compteur de vies (octets entre 1..9 qui descendent de -1 lors d'une mort)
      let detectedLives = cswRamTelemetry.lastLives;
      if (cswRamTelemetry.lockedLivesAddr !== null && cswRamTelemetry.lockedLivesAddr < scanLen) {
        const lv = ram[cswRamTelemetry.lockedLivesAddr];
        if (lv <= 15) detectedLives = lv;
      } else if (cswRamTelemetry.hadActivePlay) {
        const cur32 = new Uint32Array(ram.buffer, ram.byteOffset, scanLen >> 2);
        const prev32 = new Uint32Array(prev.buffer, prev.byteOffset, scanLen >> 2);
        const words = scanLen >> 2;
        for (let w = 16; w < words - 1; w++) {
          if (cur32[w] === prev32[w]) continue;
          const base = w << 2;
          for (let b = 0; b < 4; b++) {
            const off = base + b;
            const cur = ram[off];
            const old = prev[off];
            if (old >= 2 && old <= 6 && cur === old - 1) {
              const rec = cswRamTelemetry.livesCandidates.get(off) || { initial: old, drops: 0 };
              rec.drops += 1;
              cswRamTelemetry.livesCandidates.set(off, rec);
              if (rec.drops >= 2) {
                cswRamTelemetry.lockedLivesAddr = off;
                detectedLives = cur;
                break;
              }
            }
          }
          if (cswRamTelemetry.lockedLivesAddr !== null) break;
        }
      }

      cswRamTelemetry.prevSnapshot.set(ram.subarray(0, scanLen));
      return { score: detectedScore, lives: detectedLives };
    }

    function emitRamAutoScore(score, reason) {
      const clean = Math.floor(Number(score) || 0);
      if (clean <= 0) return;
      const now = Date.now();
      if (reason === 'milestone') {
        if (clean <= cswRamTelemetry.lastSavedScore) return;
        if (now - cswRamTelemetry.lastMilestoneEmitMs < 5000) return;
        cswRamTelemetry.lastMilestoneEmitMs = now;
      }
      cswRamTelemetry.lastSavedScore = Math.max(cswRamTelemetry.lastSavedScore, clean);
      notifyParent('RAM_AUTO_SCORE', {
        score: clean,
        reason, // 'game_over' | 'victory' | 'milestone' | 'session_end'
        mode: cswRamTelemetry.profile ? 'profile' : 'heuristic',
      });
    }

    function emitRamLossCreditSignal(reason) {
      if (isNetplaySession || !cswRamTelemetry.profile) return;
      const now = Date.now();
      // Anti-rebond 5 secondes pour ne décompter qu'un seul crédit par partie perdue
      if (now - cswRamTelemetry.lastLossSignalMs < 5000) return;
      cswRamTelemetry.lastLossSignalMs = now;
      if (cswRamTelemetry.peakScore > 0) {
        emitRamAutoScore(cswRamTelemetry.peakScore, 'game_over');
      }
      notifyParent('RAM_LOSS_CONSUME_CREDIT', {
        reason,
        score: cswRamTelemetry.peakScore,
      });
      // Réinitialiser peakScore pour la prochaine partie qui va recommencer
      cswRamTelemetry.peakScore = 0;
      cswRamTelemetry.lastSavedScore = 0;
    }

    function isHeavy3dCore(core) {
      return ['n64', 'mupen64plus_next', 'psx', 'ps1', 'pcsx_rearmed', 'psp', 'ppsspp', 'nds', 'melonds', 'desmume'].includes(
        String(core || '').toLowerCase()
      );
    }

    function tickRamTelemetry() {
      // Sur N64 / PS1 / NDS, un savestate fait 16 à 32 Mo : ne jamais appeler getState() en boucle
      // sous peine de provoquer des freezes (ex: Pokémon Stadium) et un crash mémoire du navigateur.
      if (isHeavy3dCore(cswRamTelemetry.core)) {
        const mod = getWasmModule();
        if (!mod || typeof mod._retro_get_memory_data !== 'function') return;
      }
      const view = getSystemRamView();
      if (!view || !view.ram) return;
      const { ram, isRawSystemRam } = view;

      let score = 0;
      let lives = null;
      let p1Rounds = null;
      let p2Rounds = null;

      // N'utiliser les offsets absolus de RAM_GAME_PROFILES que sur une vraie vue RAM système ;
      // sur un savestate RetroArch complet, utiliser le scanner heuristique multi-format (BCD / Big-Endian / Little-Endian).
      if (isRawSystemRam && cswRamTelemetry.profile) {
        const res = cswRamTelemetry.profile.read(ram);
        if (res) {
          score = Number(res.score || 0);
          lives = typeof res.lives === 'number' ? res.lives : null;
          p1Rounds = typeof res.p1Rounds === 'number' ? res.p1Rounds : null;
          p2Rounds = typeof res.p2Rounds === 'number' ? res.p2Rounds : null;
        }
      } else {
        const res = runHeuristicRamScan(ram, isRawSystemRam);
        score = Number(res.score || 0);
        lives = typeof res.lives === 'number' ? res.lives : null;
      }

      const maxScoreCap = isLowScoreSportsTitle(cswRamTelemetry.gameTitle) ? 300 : 5000000;
      if (score > 0 && score <= maxScoreCap) {
        cswRamTelemetry.hadActivePlay = true;
        if (score > cswRamTelemetry.peakScore) {
          cswRamTelemetry.peakScore = score;
        }
      }

      // 1. Détection de VICTOIRE (ex: 2 rounds gagnés en jeu de combat ou gros palier de score)
      if (p1Rounds !== null && p1Rounds >= 2 && cswRamTelemetry.lastP1Rounds < 2) {
        const now = Date.now();
        if (now - cswRamTelemetry.lastWinSignalMs > 5000) {
          cswRamTelemetry.lastWinSignalMs = now;
          const winScore = Math.max(cswRamTelemetry.peakScore, 15000);
          cswRamTelemetry.peakScore = winScore;
          emitRamAutoScore(winScore, 'victory');
        }
      }

      // 2. Détection de DÉFAITE / GAME OVER via les vies ou rounds perdus dans la RAM
      if (p2Rounds !== null && p2Rounds >= 2 && cswRamTelemetry.lastP2Rounds < 2) {
        emitRamLossCreditSignal('match_lost_ram');
      } else if (lives !== null && cswRamTelemetry.lastLives !== null) {
        if (cswRamTelemetry.lastLives > 0 && lives === 0 && cswRamTelemetry.hadActivePlay) {
          emitRamLossCreditSignal('lives_zero_ram');
        }
      }

      // 3. Détection universelle de Game Over -> Recommencer (le score RAM retombe brutalement de >50 à 0)
      if (cswRamTelemetry.hadActivePlay && cswRamTelemetry.peakScore >= 50 && cswRamTelemetry.lastScore >= 50 && score === 0) {
        emitRamLossCreditSignal('score_reset_restart_ram');
      }

      // 4. Sauvegarde automatique continue dès qu'un nouveau palier de score RAM significatif est atteint (>= 2 pts pour sports, >= 10 pts pour arcade)
      if (cswRamTelemetry.peakScore >= 2 && cswRamTelemetry.peakScore > cswRamTelemetry.lastSavedScore) {
        emitRamAutoScore(cswRamTelemetry.peakScore, 'milestone');
      }

      cswRamTelemetry.lastScore = score;
      if (lives !== null) cswRamTelemetry.lastLives = lives;
      if (p1Rounds !== null) cswRamTelemetry.lastP1Rounds = p1Rounds;
      if (p2Rounds !== null) cswRamTelemetry.lastP2Rounds = p2Rounds;

      notifyParent('RAM_TELEMETRY_TICK', {
        score: Math.max(score, cswRamTelemetry.peakScore),
        liveScore: score,
        lives,
        mode: cswRamTelemetry.profile ? 'profile' : 'heuristic',
      });
    }

    function startRamTelemetry(gameTitle, core) {
      if (cswRamTelemetry.timer) clearInterval(cswRamTelemetry.timer);
      // Suspendre le scan RAM (jusqu'à 6 Mo) pendant les matchs Netplay pour éliminer les micro-freezes et le jitter ping
      if (isNetplaySession) {
        cswRamTelemetry.timer = null;
        return;
      }
      const lowerCore = String(core || '').toLowerCase();
      const lowerTitle = String(gameTitle || '').toLowerCase();
      cswRamTelemetry.core = lowerCore;
      cswRamTelemetry.gameTitle = gameTitle || '';
      cswRamTelemetry.profile =
        RAM_GAME_PROFILES.find((p) => p.cores.includes(lowerCore) && p.match.test(lowerTitle)) || null;
      cswRamTelemetry.peakScore = 0;
      cswRamTelemetry.lastSavedScore = 0;
      cswRamTelemetry.lastMilestoneEmitMs = 0;
      cswRamTelemetry.lastScore = 0;
      cswRamTelemetry.lastLives = null;
      cswRamTelemetry.lastP1Rounds = 0;
      cswRamTelemetry.lastP2Rounds = 0;
      cswRamTelemetry.hadActivePlay = false;
      cswRamTelemetry.prevSnapshot = null;
      cswRamTelemetry.scoreCandidates.clear();
      cswRamTelemetry.lockedScoreAddr = null;
      cswRamTelemetry.livesCandidates.clear();
      cswRamTelemetry.lockedLivesAddr = null;

      const intervalMs = isHeavy3dCore(lowerCore) ? 1500 : 900;
      cswRamTelemetry.timer = setInterval(tickRamTelemetry, intervalMs);
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin || !event.data) return;
      const msg = event.data;

      if (msg.type === 'UPDATE_COINS') {
        const hud = document.getElementById('credits-hud');
        const ov = document.getElementById('insert-coin-overlay');
        const c = Number(msg.coins ?? 0);
        targetWalletCoins = c;
        if (hud) hud.textContent = `CRÉDITS : ${String(c).padStart(2, '0')}/99`;
        if (isNetplaySession) return;
        if (ov) ov.hidden = !msg.locked;
        writeCreditsToRam(c);
        try {
          if (msg.locked) window.EJS_emulator?.pause?.();
          else if (msg.resume) window.EJS_emulator?.play?.();
        } catch {}
        return;
      }

      if (msg.type === 'STOP_NETPLAY_MATCH') {
        window.__cswGgpoEngine?.stop?.();
        return;
      }

      // Bascule transparente en Solo (ou continue sans le pair parti) sans jamais fermer ni réinitialiser le jeu
      if (msg.type === 'CONVERT_TO_SOLO') {
        try {
          const ggpo = window.__cswGgpoEngine;
          if (ggpo && typeof ggpo.uninstallHook === 'function') {
            ggpo.uninstallHook();
          } else if (ggpo) {
            ggpo.active = false;
            ggpo.stopped = false;
          }
          isNetplaySession = false;
          netplayPlayerIndex = 0;
          window.EJS_emulator?.play?.();
          startRamTelemetry(window.EJS_gameName || '', currentCoreName);
          notifyParent('STAGE_STATUS', { status: 'playing', message: 'Partie poursuivie en Solo.' });
        } catch {}
        return;
      }

      // Transition à chaud Solo -> Netplay lors d'un Drop-In Join (J2/J3/J4 rejoint la partie en cours SANS redémarrer)
      if (msg.type === 'ENABLE_LIVE_NETPLAY') {
        try {
          isNetplaySession = true;
          netplayPlayerIndex = Number(msg.playerIndex ?? 0);
          if (cswRamTelemetry.timer) {
            clearInterval(cswRamTelemetry.timer);
            cswRamTelemetry.timer = null;
          }
          const ggpo = window.__cswGgpoEngine;
          if (ggpo) {
            ggpo.matchAborted = false;
            ggpo.waitingForFrame0 = false;
            ggpo.waitingForFrame0Ack = false;
            ggpo.waitingForGoAck = false;
            ggpo.hostWaitingForGuestEmu = false;
            ggpo.initialFrame0Sent = false;
            ggpo.hasRemotePeer = false;
            if (!ggpo.isRunning) {
              ggpo.start();
            }
            // Le jeu tourne déjà (ex: Mission 3 Metal Slug) : pas besoin d'attendre 30 frames de warmup ni un cold-boot setup !
            ggpo.localWarmupDone = true;
            ggpo.warmupFramesLeft = 0;
            ggpo.hostSetupCompleted = true;
            ggpo.setSyncWaitMute(false);
            ggpo.pendingHostExportSlot = 'frame0';
          }
        } catch {}
        return;
      }

      if (msg.type === 'FORWARD_KEY') {
        const isDown = msg.eventType === 'keydown';
        const kc = Number(msg.keyCode || 0);
        const code = msg.code || '';
        const key = msg.key || '';
        const keyId = code || String(kc);
        if (isDown) {
          if (forwardedKeyDownSet.has(keyId)) return;
          forwardedKeyDownSet.add(keyId);
        } else {
          forwardedKeyDownSet.delete(keyId);
        }

        const btnIdx = resolveUniversalKey({ code, key, keyCode: kc, which: kc });
        handleUniversalKeyboardBridge(code, kc, isDown);
        routeLocalPlayerInput(btnIdx, isDown);
        return;
      }

      if (msg.type === 'ATTACH_NETPLAY_PORT' && event.ports && event.ports[0]) {
        try {
          if (netplayDirectPort) {
            try { netplayDirectPort.close(); } catch {}
          }
          netplayDirectPort = event.ports[0];
          netplayDirectPort.onmessage = (ev) => {
            if (ev.data) {
              window.__cswGgpoEngine?.handleIncomingBinary(ev.data);
            }
          };
          netplayDirectPort.start?.();
        } catch {}
        return;
      }

      if (msg.type === 'NETPLAY_GGPO_PACKET' && msg.buffer) {
        window.__cswGgpoEngine?.handleIncomingBinary(msg.buffer);
        return;
      }

      if (msg.type === 'NETPLAY_SPECTATOR_COUNT') {
        window.__cswGgpoEngine?.setSpectatorsCount?.(msg.count || 0);
        return;
      }

      if (msg.type === 'NETPLAY_SPECTATE_SNAPSHOT_REQ') {
        window.__cswGgpoEngine?.requestSpectatorSnapshot?.(msg.targetUid || null);
        return;
      }

      if (msg.type === 'NETPLAY_SPECTATE_BATCH' && Array.isArray(msg.frames)) {
        window.__cswGgpoEngine?.receiveSpectatorFrames?.(msg.frames);
        return;
      }

      if (msg.type === 'NETPLAY_SPECTATE_STATE' && msg.stateBase64) {
        applyLoadStateBase64(msg.stateBase64, msg.syncFrame || 0, true);
        return;
      }

      if (msg.type === 'NETPLAY_FRAME0_ACK') {
        window.__cswGgpoEngine?.onFrame0AckReceived(Number(msg.syncFrame || 0));
        return;
      }

      if (msg.type === 'NETPLAY_FRAME0_GO') {
        window.__cswGgpoEngine?.onFrame0GoReceived(Number(msg.syncFrame || 0));
        return;
      }

      if (msg.type === 'SET_PEER_PING' && typeof msg.pingMs === 'number') {
        if (window.__cswGgpoEngine) window.__cswGgpoEngine.peerPingMs = Math.max(1, msg.pingMs);
        return;
      }

      if (msg.type === 'EXPORT_NETPLAY_SYNC') {
        if (isNetplaySession && netplayPlayerIndex === 0) {
          const ggpo = window.__cswGgpoEngine;
          if (ggpo) {
            if (msg.force) {
              ggpo.pendingHostExportSlot = msg.slot || 'resync';
            } else {
              ggpo.onGuestReadySignal(msg.slot || 'frame0');
            }
          }
        }
        return;
      }

      if (msg.type === 'SET_GGPO_OPTIONS') {
        const ggpo = window.__cswGgpoEngine;
        if (ggpo) {
          if (typeof msg.inputDelay === 'number') ggpo.setInputDelay(msg.inputDelay);
          if (typeof msg.autoHeal === 'boolean') ggpo.setAutoHeal(msg.autoHeal);
        }
        return;
      }

      if (msg.type === 'NETPLAY_REMATCH_RESET') {
        if (isNetplaySession && netplayPlayerIndex === 0) {
          const ggpo = window.__cswGgpoEngine;
          try {
            window.EJS_emulator?.gameManager?.restart?.();
          } catch {}
          if (ggpo) {
            ggpo.localWarmupDone = false;
            ggpo.warmupFramesLeft = 24;
            ggpo.hostSetupCompleted = false;
            ggpo.initialFrame0Sent = false;
            ggpo.guestIsReady = true;
            ggpo.pendingHostExportSlot = 'frame0';
          }
        }
        return;
      }

      if (msg.type === 'PAUSE_EMU') {
        try { window.EJS_emulator?.pause?.(); } catch {}
        return;
      }

      if (msg.type === 'RESUME_EMU') {
        try {
          window.EJS_emulator?.play?.();
          window.focus();
        } catch {}
        return;
      }

      if (msg.type === 'EXPORT_STATE') {
        if (isNetplaySession && netplayPlayerIndex === 0 && (msg.slot === 'frame0' || msg.slot === 'resync')) {
          const ggpo = window.__cswGgpoEngine;
          if (ggpo && ggpo.hostSetupCompleted) {
            ggpo.exportAndLockSyncState(msg.slot);
          }
          return;
        }
        try {
          const state = window.EJS_emulator?.gameManager?.getState?.();
          if (state) {
            const bytes = state instanceof Uint8Array ? state : new Uint8Array(state);
            // Pour la synchro cloud auto en arrière-plan, ignorer les blobs > 12 Mo pour éviter tout freeze
            if (msg.slot === 'cloud_handoff' && bytes.length > 12 * 1024 * 1024) {
              return;
            }
            let screenshotDataUrl = null;
            if (msg.slot !== 'cloud_handoff' && msg.slot !== 'frame0') {
              try {
                const srcCanvas = document.querySelector('#game canvas');
                if (srcCanvas && srcCanvas.width > 0 && srcCanvas.height > 0) {
                  const thumb = document.createElement('canvas');
                  const maxW = 320;
                  const scale = Math.min(1, maxW / srcCanvas.width);
                  thumb.width = Math.max(1, Math.round(srcCanvas.width * scale));
                  thumb.height = Math.max(1, Math.round(srcCanvas.height * scale));
                  const tctx = thumb.getContext('2d');
                  if (tctx) {
                    tctx.drawImage(srcCanvas, 0, 0, thumb.width, thumb.height);
                    screenshotDataUrl = thumb.toDataURL('image/jpeg', 0.7);
                  }
                }
              } catch {}
            }
            notifyParent('STATE_EXPORTED', {
              stateBase64: bytesToBase64(bytes),
              slot: msg.slot || 'quick',
              screenshotDataUrl,
            });
          }
        } catch {}
        return;
      }

      if (msg.type === 'LOAD_STATE' && msg.stateBase64) {
        applyLoadStateBase64(msg.stateBase64, msg.syncFrame || 0, Boolean(msg.isNetplaySync));
        return;
      }

      if (msg.type === 'UPDATE_DISPLAY') {
        applyDisplay(msg);
        return;
      }

      if (msg.type === 'NETPLAY_REMOTE_BTN') {
        const ggpo = window.__cswGgpoEngine;
        if (ggpo && ggpo.isActive()) {
          ggpo.setRemoteFallbackButton(Number(msg.buttonIdx), Boolean(msg.pressed));
          return;
        }
        const remotePort = netplayPlayerIndex === 1 ? 0 : 1;
        const btnIdx = Number(msg.buttonIdx);
        const pressed = Boolean(msg.pressed);
        simulateEmuInput(remotePort, btnIdx, pressed);
        if (btnIdx === 4) simulateEmuInput(remotePort, 19, pressed);
        else if (btnIdx === 5) simulateEmuInput(remotePort, 18, pressed);
        else if (btnIdx === 6) simulateEmuInput(remotePort, 17, pressed);
        else if (btnIdx === 7) simulateEmuInput(remotePort, 16, pressed);
        const kc = window.EJS_emulator?.controls?.[remotePort]?.[btnIdx]?.value;
        if (kc) dispatchSyntheticKey(kc, pressed ? 'keydown' : 'keyup');
        return;
      }

      if (msg.type === 'FLUSH_RAM_SCORE') {
        if (cswRamTelemetry.peakScore > 0) {
          emitRamAutoScore(cswRamTelemetry.peakScore, msg.reason || 'session_end');
        }
        return;
      }

      if (msg.type === 'FORCE_SYNC_CREDITS') {
        try { window.focus(); } catch {}
        forceSyncCreditsToRam();
        return;
      }

      if (msg.type === 'SET_CUSTOM_TOUCH_PAD') {
        document.body.classList.toggle('csw-touch-pad', Boolean(msg.enabled));
        return;
      }

      if (msg.type === 'VIRTUAL_PAD_BTN') {
        const btnIdx = Number(msg.buttonIdx);
        const pressed = Boolean(msg.pressed);
        routeLocalPlayerInput(btnIdx, pressed);
        return;
      }

      if (msg.type === 'PRESS_BUTTON') {
        if (isNetplaySession && netplayPlayerIndex < 0) return;
        const idx = msg.button === 'coin' ? 2 : 3;
        try { window.focus(); } catch {}
        const ggpo = window.__cswGgpoEngine;
        if (isNetplaySession && ggpo && ggpo.isActive()) {
          ggpo.pulseLocalButton(idx, 5);
          return;
        }
        const myPort = netplayPlayerIndex >= 0 && netplayPlayerIndex <= 3 ? netplayPlayerIndex : 0;
        pulseEmuButton(myPort, idx, 100);
        if (isNetplaySession) {
          notifyParent('NETPLAY_LOCAL_BTN', { buttonIdx: idx, pressed: true });
          setTimeout(() => notifyParent('NETPLAY_LOCAL_BTN', { buttonIdx: idx, pressed: false }), 100);
        }
        return;
      }

      if (msg.type === 'BOOT_EMU' && !started) {
        started = true;
        currentCoreName = msg.core || 'fbneo';
        isNetplaySession = Boolean(msg.isNetplay);
        netplayPlayerIndex = Number(msg.playerIndex ?? 0);
        applyDisplay(msg);

        const bootEl = document.getElementById('boot-msg');
        bootEl.querySelector('strong').textContent = `Chargement : ${msg.gameName || 'ROM'}`;
        bootEl.querySelector('span').textContent = `Moteur ${msg.core} (EmulatorJS)…`;

        (async () => {
          const isFbneo = msg.core === 'fbneo' || msg.core === 'arcade';
          const rawName = msg.filename || msg.fileBlob?.name || (msg.gameUrl ? msg.gameUrl.split('/').pop().split('?')[0] : '') || 'game.zip';
          const targetFilename = decodeURIComponent(rawName);
          const shortKey = targetFilename.replace(/\.[^.]+$/, '').toLowerCase();

          const [romBytes, neogeoBytes] = await Promise.all([
            msg.fileBlob && typeof msg.fileBlob.arrayBuffer === 'function'
              ? msg.fileBlob.arrayBuffer().then((ab) => new Uint8Array(ab)).catch(() => null)
              : Promise.resolve(null),
            isFbneo
              ? fetch('/roms/neogeo.zip?v=3', { cache: 'no-cache' })
                  .then((biosRes) => (biosRes.ok ? biosRes.arrayBuffer().then((ab) => new Uint8Array(ab)) : null))
                  .catch(() => null)
              : Promise.resolve(null),
          ]);

          // Intercepteur fetch + XHR pour servir la ROM avec son vrai nom de fichier (indispensable pour FBNeo, MAME et noms avec espaces)
          if (romBytes || neogeoBytes) {
            const targetLower = targetFilename.toLowerCase();
            const isTargetRomUrl = (rawUrl) => {
              const u = String(rawUrl || '').toLowerCase();
              let decoded = u;
              try { decoded = decodeURIComponent(u); } catch {}
              return (
                u.includes(targetLower) ||
                decoded.includes(targetLower) ||
                (shortKey && (u.endsWith('/' + shortKey + '.zip') || decoded.endsWith('/' + shortKey + '.zip')))
              );
            };
            const _origFetch = window.fetch;
            window.fetch = async function(input, init) {
              const rawU = typeof input === 'string' ? input : (input?.url || '');
              const u = rawU.toLowerCase();
              if (romBytes && isTargetRomUrl(rawU)) {
                const buf = romBytes.buffer.slice(romBytes.byteOffset, romBytes.byteOffset + romBytes.byteLength);
                return new Response(buf, {
                  status: 200,
                  statusText: 'OK',
                  headers: { 'Content-Type': 'application/octet-stream', 'Content-Length': String(romBytes.byteLength) }
                });
              }
              if (neogeoBytes && u.includes('neogeo.zip')) {
                const buf = neogeoBytes.buffer.slice(neogeoBytes.byteOffset, neogeoBytes.byteOffset + neogeoBytes.byteLength);
                return new Response(buf, {
                  status: 200,
                  statusText: 'OK',
                  headers: { 'Content-Type': 'application/zip', 'Content-Length': String(neogeoBytes.byteLength) }
                });
              }
              return _origFetch.apply(window, arguments);
            };

            const _origXHROpen = XMLHttpRequest.prototype.open;
            const _origXHRSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
              this._reqUrl = url ? String(url) : '';
              return _origXHROpen.apply(this, [method, url, ...rest]);
            };
            XMLHttpRequest.prototype.send = function(...args) {
              const rawU = this._reqUrl || '';
              const u = rawU.toLowerCase();
              const serveBuf = (bytes) => {
                const buf = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
                const respType = String(this.responseType || '').toLowerCase();
                let respValue = buf;
                if (respType === 'blob') {
                  respValue = new Blob([buf], { type: 'application/octet-stream' });
                } else if (respType === 'text' || respType === '') {
                  try { respValue = new TextDecoder().decode(buf); } catch { respValue = buf; }
                } else if (respType === 'json') {
                  try { respValue = JSON.parse(new TextDecoder().decode(buf)); } catch { respValue = null; }
                }
                Object.defineProperty(this, 'status', { get: () => 200 });
                Object.defineProperty(this, 'statusText', { get: () => 'OK' });
                Object.defineProperty(this, 'response', { get: () => respValue });
                if (respType === 'text' || respType === '') {
                  Object.defineProperty(this, 'responseText', { get: () => String(respValue || '') });
                }
                Object.defineProperty(this, 'readyState', { get: () => 4 });
                this.getResponseHeader = (h) => {
                  if (!h) return null;
                  if (h.toLowerCase() === 'content-length') return String(buf.byteLength);
                  if (h.toLowerCase() === 'content-type') return 'application/octet-stream';
                  return null;
                };
                this.getAllResponseHeaders = () => 'content-type: application/octet-stream\r\ncontent-length: ' + buf.byteLength + '\r\n';
                setTimeout(() => {
                  if (typeof this.onreadystatechange === 'function') this.onreadystatechange();
                  if (typeof this.onload === 'function') this.onload();
                  this.dispatchEvent(new Event('load'));
                  this.dispatchEvent(new Event('loadend'));
                }, 5);
              };
              if (romBytes && isTargetRomUrl(rawU)) {
                serveBuf(romBytes);
                return;
              }
              if (neogeoBytes && u.includes('neogeo.zip')) {
                serveBuf(neogeoBytes);
                return;
              }
              return _origXHRSend.apply(this, args);
            };
          }

          const hw = readHardwareSettings();
          let ctrlCfg = buildControllersConfig(hw.controls, msg.core, hw) || buildControllersConfig({ p1: {}, p2: {} }, msg.core, hw);

          const normalizeEmuCore = (raw) => {
            const lower = String(raw || 'fbneo').trim().toLowerCase();
            if (lower === 'fbneo' || lower === 'arcade') return 'arcade';
            if (lower === 'ps1' || lower === 'psx' || lower === 'playstation' || lower === 'pcsx_rearmed') return 'psx';
            if (lower === 'psp' || lower === 'ppsspp') return 'psp';
            if (lower === 'segamd' || lower === 'sega32x') return 'picodrive';
            if (lower === 'gbc') return 'gb';
            if (lower === 'parallel-n64') return 'parallel_n64';
            return raw || 'arcade';
          };

          const hasLocalCoreProxy = isFbneo ? true : await hasLocalCoreProxyPromise;
          window.EJS_player = '#game';
          window.EJS_core = normalizeEmuCore(msg.core);
          const lowerEjsCore = String(window.EJS_core || '').toLowerCase();
          const lowerTargetFile = String(targetFilename || '').toLowerCase();
          const isCdImageFile = /\.(cue|chd|iso|ccd|m3u|toc)$/i.test(lowerTargetFile);
          if (
            ['segamd', 'genesis_plus_gx', 'picodrive', 'sega32x', 'segams', 'smsplus', 'segagg', 'pce', 'mednafen_pce'].includes(lowerEjsCore) &&
            !isCdImageFile
          ) {
            // Empêche EmulatorJS de générer un faux .cue Sega CD pour les cartouches (.md, .bin, .gen, .smd, .sms, .gg, .pce)
            window.EJS_disableCue = true;
          }
          window.EJS_gameName = isFbneo ? shortKey.toUpperCase() : (msg.gameName || 'CSW Game');
          window.EJS_gameUrl = (!isFbneo && romBytes && romBytes.byteLength > 0)
            ? new File([romBytes], targetFilename, { type: 'application/octet-stream' })
            : (romBytes ? targetFilename : (msg.gameUrl || targetFilename));
          window.EJS_biosUrl = isFbneo ? 'neogeo.zip' : '';
          if (isFbneo) {
            window.EJS_gameParentUrl = 'neogeo.zip';
            window.EJS_dontExtractBIOS = true;
            window.EJS_pathtodata = '/emulatorjs/';
            window.EJS_paths = {
              'fbneo-wasm.data': '/emulatorjs/cores/fbneo-wasm.data',
              'fbneo-legacy-wasm.data': '/emulatorjs/cores/fbneo-legacy-wasm.data',
              'fbneo.json': '/emulatorjs/cores/reports/fbneo.json',
              'version.json': '/emulatorjs/version.json',
            };
          } else if (msg.localData && hasLocalCoreProxy) {
            const coreAliases = [
              'fceumm', 'nestopia', 'snes9x', 'mupen64plus_next', 'parallel_n64',
              'gambatte', 'mgba', 'melonds', 'desmume', 'desmume2015',
              'genesis_plus_gx', 'picodrive', 'smsplus', 'yabause',
              'pcsx_rearmed', 'mednafen_psx_hw', 'mednafen_pce',
              'mame2003_plus', 'mame2003', 'ppsspp', 'fbneo',
            ];
            const mappedPaths = {
              'version.json': '/emulatorjs/version.json',
            };
            for (const c of coreAliases) {
              mappedPaths[`${c}.json`] = `/api/emu-cores/reports/${c}.json`;
              mappedPaths[`${c}-wasm.data`] = `/api/emu-cores/${c}-wasm.data`;
              mappedPaths[`${c}-legacy-wasm.data`] = `/api/emu-cores/${c}-legacy-wasm.data`;
              mappedPaths[`${c}-thread-wasm.data`] = `/api/emu-cores/${c}-thread-wasm.data`;
              mappedPaths[`${c}-thread-legacy-wasm.data`] = `/api/emu-cores/${c}-thread-legacy-wasm.data`;
            }
            window.EJS_pathtodata = '/emulatorjs/';
            window.EJS_paths = mappedPaths;
          } else {
            window.EJS_pathtodata = CDN_DATA;
          }
          window.EJS_startOnLoaded = true;
          window.EJS_disableDatabases = true;
          window.EJS_Buttons = {
            playPause: false,
            restart: false,
            mute: false,
            settings: false,
            fullscreen: false,
            saveState: false,
            loadState: false,
            screenRecord: false,
            gamepad: false,
            cheat: false,
            volume: false,
            saveSavFiles: false,
            loadSavFiles: false,
            quickSave: false,
            quickLoad: false,
            screenshot: false,
            cacheManager: false,
          };
          window.EJS_threads = (String(window.EJS_core || '').toLowerCase() === 'psp' || String(window.EJS_core || '').toLowerCase() === 'ppsspp') && typeof SharedArrayBuffer !== 'undefined';
          window.EJS_color = msg.accent || '#3b82f6';
          if (ctrlCfg) window.EJS_defaultControls = ctrlCfg;
          // Options natives EmulatorJS : uniquement les clés libretro valides par cœur (Multitaps 3-4+ joueurs & BIOS FBNeo)
          const normCore = String(window.EJS_core || '').toLowerCase();
          const bootOpts = { ...(window.EJS_defaultOptions || {}) };
          let hasBootOpts = Object.keys(bootOpts).length > 0;
          const maxPlayers = Math.max(2, Number(msg.maxPlayers || 2));
          if (maxPlayers >= 3) {
            if (normCore === 'psx' || normCore === 'pcsx_rearmed') {
              bootOpts['pcsx_rearmed_multitap1'] = 'enabled';
              hasBootOpts = true;
            } else if (normCore === 'segamd' || normCore === 'genesis_plus_gx') {
              bootOpts['genesis_plus_gx_port_1_type'] = '4-way play';
              hasBootOpts = true;
            } else if (normCore === 'snes' || normCore === 'snes9x') {
              bootOpts['snes9x_multitap'] = 'enabled';
              hasBootOpts = true;
            }
          }
          if (normCore === 'fbneo' || normCore === 'arcade') {
            const biosMode = hw.system?.biosMode === 'aes' ? 'AES' : 'MVS';
            if (biosMode === 'AES') {
              bootOpts['fbneo-neogeo-mode'] = 'UNIBIOS';
              hasBootOpts = true;
            }
          }
          if (hasBootOpts) {
            window.EJS_defaultOptions = bootOpts;
          }
          const effectiveMuted = msg.muted ?? hw.audio?.muted ?? false;
          const effectiveVol = typeof msg.volume === 'number' ? msg.volume : (hw.audio?.volume ?? 80);
          window.__cswDesiredAudio = { muted: Boolean(effectiveMuted), vol: Math.max(0, Math.min(1, effectiveVol / 100)) };
          window.EJS_volume = effectiveMuted ? 0 : effectiveVol / 100;
          applyHardwareSettings(hw);

          window.EJS_onGameStart = () => {
            bootEl.hidden = true;
            emuGameStarted = true;
            applyHardwareSettings(readHardwareSettings());
            try { window.focus(); } catch {}
            notifyParent('STAGE_STATUS', { status: 'playing', message: 'Émulateur démarré.' });
            startRamTelemetry(msg.gameName || targetFilename, msg.core);
            startNetplayGamepadLoop();

            if (pendingLoadState) {
              const toLoad = pendingLoadState;
              pendingLoadState = null;
              setTimeout(() => applyLoadStateBase64(toLoad.b64, toLoad.syncFrame, toLoad.isNetplaySync), 150);
            }

            if (isNetplaySession) {
              // Hook MainLoop.runIter immédiatement : le warmup de 30 frames + garde Asyncify sont gérés dans onMainLoopTick()
              window.__cswGgpoEngine?.start();
            }
          };

          const script = document.createElement('script');
          script.src = `${window.EJS_pathtodata}loader.js`;
          script.onload = () => {
            setTimeout(() => { bootEl.hidden = true; }, 1800);
            notifyParent('STAGE_STATUS', { status: 'loaded', message: `Moteur ${msg.core} initialisé.` });
          };
          script.onerror = () => {
            bootEl.querySelector('strong').textContent = 'Impossible de charger le moteur';
            bootEl.querySelector('span').textContent = 'Vérifiez votre connexion Internet ou l’accès au CDN EmulatorJS.';
            notifyParent('STAGE_STATUS', { status: 'error', message: 'Échec chargement EmulatorJS.' });
          };
          document.head.append(script);
        })();
      }
    });

    notifyParent('STAGE_FRAME_READY');
  </script>
</body>
</html>
