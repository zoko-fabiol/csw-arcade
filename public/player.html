<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSW-Arcade Neo Geo Player</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050508;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #fff;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game canvas {
      image-rendering: pixelated;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #0b0f19 0%, #030407 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10000;
      transition: opacity 0.4s ease;
    }

    .neo-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 240, 255, 0.15);
      border-top-color: #00f0ff;
      border-right-color: #ff0055;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00f0ff;
      text-transform: uppercase;
    }

    .loading-sub {
      font-size: 11px;
      color: #94a3b8;
    }

    .loading-badge {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 4px;
      font-size: 10px;
      color: #38bdf8;
    }

    #error-msg {
      display: none;
      color: #ef4444;
      font-size: 11px;
      max-width: 80%;
      text-align: center;
    }

    /* Masquage absolu et suppression des doublons de gamepad virtuel EmulatorJS */
    .ejs_virtualGamepad_parent,
    .ejs_virtualGamepad,
    [class*="ejs_virtualGamepad"],
    [class*="virtualGamepad"],
    [id*="ejs_virtualGamepad"],
    [id*="virtualGamepad"],
    .nipple,
    [class*="nipple"],
    [id*="nipple"],
    .ejs_touch,
    [class*="ejs_touch"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      position: absolute !important;
      left: -9999px !important;
      top: -9999px !important;
      transform: scale(0) !important;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="loading-overlay">
      <div class="neo-spinner"></div>
      <div class="loading-title">CSW-ARCADE NEO GEO ENGINE</div>
      <div class="loading-sub" id="loading-desc">Chargement du ROMset FBNeo & BIOS...</div>

      <!-- Barre de progression et statistiques de téléchargement en temps réel -->
      <div id="dl-progress-box" style="display: none; width: 85%; max-width: 320px; flex-direction: column; gap: 6px; margin: 4px 0;">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600;">
          <span id="dl-progress-size" style="color: #38bdf8;">0.0 MB / -- MB</span>
          <span id="dl-progress-percent" style="color: #00f0ff; font-family: monospace;">0%</span>
        </div>
        <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; border: 1px solid rgba(0, 240, 255, 0.25); position: relative;">
          <div id="dl-progress-fill" style="width: 0%; height: 100%; background: linear-gradient(90deg, #00f0ff, #3b82f6, #ff0055); border-radius: 4px; transition: width 0.12s ease; box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);"></div>
        </div>
      </div>

      <div class="loading-badge" id="game-badge">MVS ARCADE</div>
      <div id="error-msg"></div>
    </div>

    // Parsing des paramètres passés par CSW-Arcade
    const params = new URLSearchParams(window.location.search);
    const rawGame = params.get('game') || 'androdunos.zip';
    let assignedPlayerIndex = parseInt(params.get('playerIndex') ?? '0', 10);
    const isNetplay = params.get('netplay') === '1';
    const isBenchmark = params.get('benchmark') === '1';

    let activeSettings = {};
    try {
      const sParam = params.get('settings');
      if (sParam) {
        activeSettings = JSON.parse(decodeURIComponent(sParam));
      } else {
        const stored = localStorage.getItem('csw_arcade_settings_v1');
        if (stored) activeSettings = JSON.parse(stored);
      }
    } catch(e) {
      console.warn('[Player] Échec parsing settings:', e);
    }

    // Dictionnaire exhaustif de conversion KeyboardEvent.code -> numeric keyCode
    const CODE_TO_KEYCODE = {
      KeyA: 65, KeyB: 66, KeyC: 67, KeyD: 68, KeyE: 69, KeyF: 70, KeyG: 71, KeyH: 72,
      KeyI: 73, KeyJ: 74, KeyK: 75, KeyL: 76, KeyM: 77, KeyN: 78, KeyO: 79, KeyP: 80,
      KeyQ: 81, KeyR: 82, KeyS: 83, KeyT: 84, KeyU: 85, KeyV: 86, KeyW: 87, KeyX: 88,
      KeyY: 89, KeyZ: 90,
      Digit0: 48, Digit1: 49, Digit2: 50, Digit3: 51, Digit4: 52, Digit5: 53,
      Digit6: 54, Digit7: 55, Digit8: 56, Digit9: 57,
      Numpad0: 96, Numpad1: 97, Numpad2: 98, Numpad3: 99, Numpad4: 100,
      Numpad5: 101, Numpad6: 102, Numpad7: 103, Numpad8: 104, Numpad9: 105,
      ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40,
      Space: 32, Enter: 13, Tab: 9, Escape: 27, Backspace: 8,
      ShiftLeft: 16, ShiftRight: 16, ControlLeft: 17, ControlRight: 17, AltLeft: 18, AltRight: 18
    };

    function getKeyCode(code, fallback) {
      if (typeof code === 'number') return code;
      if (!code) return fallback;
      return CODE_TO_KEYCODE[code] || fallback;
    }

    // Construction de la configuration de contrôles RetroArch / EmulatorJS
    // Pour Neo Geo FBNeo:
    // 0 = RetroPad B -> Neo Geo Bouton A
    // 8 = RetroPad A -> Neo Geo Bouton B
    // 1 = RetroPad Y -> Neo Geo Bouton C
    // 9 = RetroPad X -> Neo Geo Bouton D
    // 4 = HAUT, 5 = BAS, 6 = GAUCHE, 7 = DROITE
    // 2 = SELECT (Coin/Crédit), 3 = START
    function buildControllersConfig(controls) {
      const p1 = controls?.p1 || {};
      const p2 = controls?.p2 || {};

      const p1Config = {
        4: { value: getKeyCode(p1.up, 87), value2: "DPAD_UP" },      // W
        5: { value: getKeyCode(p1.down, 83), value2: "DPAD_DOWN" },    // S
        6: { value: getKeyCode(p1.left, 65), value2: "DPAD_LEFT" },    // A
        7: { value: getKeyCode(p1.right, 68), value2: "DPAD_RIGHT" },  // D
        0: { value: getKeyCode(p1.a, 74), value2: "BUTTON_2" },        // J -> Neo Geo Bouton A
        8: { value: getKeyCode(p1.b, 75), value2: "BUTTON_1" },        // K -> Neo Geo Bouton B
        1: { value: getKeyCode(p1.c, 85), value2: "BUTTON_4" },        // U -> Neo Geo Bouton C
        9: { value: getKeyCode(p1.d, 73), value2: "BUTTON_3" },        // I -> Neo Geo Bouton D
        2: { value: getKeyCode(p1.coin, 53), value2: "SELECT" },       // 5 -> Coin / Crédit
        3: { value: getKeyCode(p1.start, 49), value2: "START" }        // 1 -> Start
      };

      const p2Config = {
        4: { value: getKeyCode(p2.up, 38), value2: "DPAD_UP" },        // Flèche Haut
        5: { value: getKeyCode(p2.down, 40), value2: "DPAD_DOWN" },    // Flèche Bas
        6: { value: getKeyCode(p2.left, 37), value2: "DPAD_LEFT" },    // Flèche Gauche
        7: { value: getKeyCode(p2.right, 39), value2: "DPAD_RIGHT" },  // Flèche Droite
        0: { value: getKeyCode(p2.a, 100), value2: "BUTTON_2" },       // Numpad 4 -> Bouton A
        8: { value: getKeyCode(p2.b, 101), value2: "BUTTON_1" },       // Numpad 5 -> Bouton B
        1: { value: getKeyCode(p2.c, 103), value2: "BUTTON_4" },       // Numpad 7 -> Bouton C
        9: { value: getKeyCode(p2.d, 104), value2: "BUTTON_3" },       // Numpad 8 -> Bouton D
        2: { value: getKeyCode(p2.coin, 54), value2: "SELECT" },       // 6 -> Coin
        3: { value: getKeyCode(p2.start, 50), value2: "START" }        // 2 -> Start
      };

      // Ports 0 et 1 doivent être configurés selon le rôle du joueur.
      // En Netplay, l'isolation doit être hermétique pour éviter que l'écouteur natif
      // d'EmulatorJS ne mappe les touches sur le port adverse lors de la sélection des héros !
      if (isNetplay) {
        const mySlot = assignedPlayerIndex > 0 ? assignedPlayerIndex : 0;
        if (mySlot === 0) {
          // Hôte (J1) : Contrôle uniquement le Port 0. Port 1 strictement vide.
          return {
            0: p1Config,
            1: {},
            2: {},
            3: {}
          };
        } else {
          // Invité (J2) : Port 0 strictement vide (aucun impact sur P1). Port 1 configuré avec ses touches.
          return {
            0: {},
            1: p1Config,
            2: {},
            3: {}
          };
        }
      }

      return {
        0: p1Config,
        1: p2Config,
        2: p1Config,
        3: p2Config
      };
    }

    // Construction des options système RetroArch FBNeo (MVS vs AES et Région)
    function buildCoreOptions(system) {
      const isAes = system?.biosMode === 'aes';
      const region = system?.region || 'europe';

      let modeVal = isAes ? 'AES Europe/Asia' : 'MVS Europe';
      if (region === 'japan') {
        modeVal = isAes ? 'AES Japan' : 'MVS Japan';
      } else if (region === 'usa') {
        modeVal = isAes ? 'AES USA' : 'MVS USA';
      }

      return {
        'fbneo-neogeo-mode': modeVal,
        'fbneo-cpu-speed-adjust': '100',
        'fbneo-diagnostic-input': 'Hold Start'
      };
    }

    // --- PILOTE D'INPUTS DIRECT & UNIVERSEL CSW-ARCADE ---
    // RetroPad IDs pour le core FBNeo Neo Geo:
    // 0: Neo Geo Bouton A (Poing Faible)
    // 8: Neo Geo Bouton B (Pied Faible)
    // 1: Neo Geo Bouton C (Poing Fort)
    // 9: Neo Geo Bouton D (Pied Fort)
    // 2: Coin / Crédit (Select)
    // 3: Start
    // 4: Haut, 5: Bas, 6: Gauche, 7: Droite

    const ACTION_TO_RETROPAD = {
      a: 0,
      b: 8,
      c: 1,
      d: 9,
      coin: 2,
      start: 3,
      up: 4,
      down: 5,
      left: 6,
      right: 7
    };

    let keyToInputMap = {};

    function rebuildKeyMap(controls) {
      keyToInputMap = {};
      const p1 = controls?.p1 || {};
      const p2 = controls?.p2 || {};

      if (isNetplay) {
        // En mode Netplay : mapper les touches uniquement vers le port assigné (J1 = 0, J2 = 1)
        const mySlot = assignedPlayerIndex > 0 ? assignedPlayerIndex : 0;
        for (const [action, btnId] of Object.entries(ACTION_TO_RETROPAD)) {
          if (p1[action]) {
            keyToInputMap[p1[action]] = { player: mySlot, buttonId: btnId };
          }
        }
        return;
      }

      const localSlot = assignedPlayerIndex > 0 ? assignedPlayerIndex : 0;
      const otherSlot = localSlot === 0 ? 1 : 0;

      for (const [action, btnId] of Object.entries(ACTION_TO_RETROPAD)) {
        if (p1[action]) {
          keyToInputMap[p1[action]] = { player: localSlot, buttonId: btnId };
        }
        if (p2[action]) {
          keyToInputMap[p2[action]] = { player: otherSlot, buttonId: btnId };
        }
      }
    }

    rebuildKeyMap(activeSettings.controls);

    function dispatchDirectInput(player, buttonId, isPressed) {
      const gm = window.EJS_emulator?.gameManager;
      if (gm) {
        const val = isPressed ? 1 : 0;
        if (gm.functions && typeof gm.functions.simulateInput === 'function') {
          gm.functions.simulateInput(player, buttonId, val);
          // Si c'est une pièce (button 2 = COIN), simuler aussi sur slot 0 pour garantir l'incrément du monnayeur arcade partagé
          if (buttonId === 2 && player !== 0) {
            gm.functions.simulateInput(0, buttonId, val);
          }
        } else if (typeof gm.simulateInput === 'function') {
          gm.simulateInput(player, buttonId, val);
          if (buttonId === 2 && player !== 0) {
            gm.simulateInput(0, buttonId, val);
          }
        }
      }

      if (isNetplay && window.__csw_rollback_engine) {
        window.__csw_rollback_engine.setPlayerButton(player, buttonId, isPressed);
      }
    }

    function handleDirectKey(code, keyCode, isDown) {
      const binding = keyToInputMap[code];
      if (binding) {
        dispatchDirectInput(binding.player, binding.buttonId, isDown);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'LOCAL_INPUT',
            playerIndex: binding.player,
            buttonId: binding.buttonId,
            isPressed: isDown
          }, '*');

          if (isNetplay && isDown && (binding.buttonId === 2 || binding.buttonId === 3)) {
            window.parent.postMessage({
              type: 'PLAYER_INSERTED_COIN_OR_START',
              playerIndex: binding.player,
              buttonId: binding.buttonId
            }, '*');
          }
        }
        return true;
      }
      return false;
    }

    window.addEventListener('keydown', (e) => {
      if (handleDirectKey(e.code, e.keyCode, true)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (handleDirectKey(e.code, e.keyCode, false)) {
        e.preventDefault();
      }
    });

    // Boucle de polling Gamepad 60 FPS
    const lastGamepadState = { 0: {}, 1: {} };

    function pollGamepadsLoop() {
      if (window.EJS_emulator?.gameManager?.simulateInput && navigator.getGamepads) {
        const gamepads = navigator.getGamepads();
        const p1Idx = activeSettings.gamepad?.p1Index ?? 0;
        const p2Idx = activeSettings.gamepad?.p2Index ?? 1;
        const p1Gp = gamepads[p1Idx] || null;
        const p2Gp = gamepads[p2Idx] || null;

        const processPad = (gp, playerIdx) => {
          if (!gp || !gp.connected) return;
          const buttons = gp.buttons;
          const axes = gp.axes;

          const checkBtn = (btnId, isPressed) => {
            const prev = !!lastGamepadState[playerIdx][btnId];
            if (prev !== isPressed) {
              lastGamepadState[playerIdx][btnId] = isPressed;
              dispatchDirectInput(playerIdx, btnId, isPressed);
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                  type: 'LOCAL_INPUT',
                  playerIndex: playerIdx,
                  buttonId: btnId,
                  isPressed: isPressed
                }, '*');

                if (isNetplay && isPressed && (btnId === 2 || btnId === 3)) {
                  window.parent.postMessage({
                    type: 'PLAYER_INSERTED_COIN_OR_START',
                    playerIndex: playerIdx,
                    buttonId: btnId
                  }, '*');
                }
              }
            }
          };

          // D-Pad + Analog Stick selon le mode (both / dpad / analog)
          const dpadMode = activeSettings.gamepad?.dpadMode || 'both';
          const useDpad = dpadMode === 'both' || dpadMode === 'dpad';
          const useAnalog = dpadMode === 'both' || dpadMode === 'analog';

          const up = (useDpad && !!buttons[12]?.pressed) || (useAnalog && axes[1] < -0.4);
          const down = (useDpad && !!buttons[13]?.pressed) || (useAnalog && axes[1] > 0.4);
          const left = (useDpad && !!buttons[14]?.pressed) || (useAnalog && axes[0] < -0.4);
          const right = (useDpad && !!buttons[15]?.pressed) || (useAnalog && axes[0] > 0.4);

          checkBtn(4, up);
          checkBtn(5, down);
          checkBtn(6, left);
          checkBtn(7, right);

          // Boutons Neo Geo configurés ou standards
          const custom = activeSettings.gamepad?.buttons || {};
          const btnAIdx = custom.a ?? 0;
          const btnBIdx = custom.b ?? 1;
          const btnCIdx = custom.c ?? 2;
          const btnDIdx = custom.d ?? 3;
          const coinIdx = custom.coin ?? 8;
          const startIdx = custom.start ?? 9;

          checkBtn(0, !!buttons[btnAIdx]?.pressed); // Bouton A (RetroPad B: 0)
          checkBtn(8, !!buttons[btnBIdx]?.pressed); // Bouton B (RetroPad A: 8)
          checkBtn(1, !!buttons[btnCIdx]?.pressed); // Bouton C (RetroPad Y: 1)
          checkBtn(9, !!buttons[btnDIdx]?.pressed); // Bouton D (RetroPad X: 9)
          checkBtn(2, !!buttons[coinIdx]?.pressed || !!buttons[8]?.pressed); // Coin (Select)
          checkBtn(3, !!buttons[startIdx]?.pressed || !!buttons[9]?.pressed); // Start
        };

        if (isNetplay) {
          const mySlot = assignedPlayerIndex > 0 ? assignedPlayerIndex : 0;
          if (p1Gp) processPad(p1Gp, mySlot);
        } else {
          const targetLocalSlot = assignedPlayerIndex > 0 ? assignedPlayerIndex : 0;
          const targetOtherSlot = targetLocalSlot === 0 ? 1 : 0;
          if (p1Gp) processPad(p1Gp, targetLocalSlot);
          if (p2Gp && p2Idx !== p1Idx) processPad(p2Gp, targetOtherSlot);
        }
      }

      requestAnimationFrame(pollGamepadsLoop);
    }

    // --- GESTION DU STOCKAGE PERSISTANT LOCAL (IndexedDB) ---
    const IDB_NAME = 'csw_arcade_roms_db';
    const IDB_STORE = 'rom_archives';

    function getRomFromIDB(filename) {
      return new Promise((resolve) => {
        const timeout = setTimeout(() => {
          console.warn(`[Player IDB] Timeout pour ${filename}, passage au réseau`);
          resolve(null);
        }, 1200);

        try {
          if (!window.indexedDB) {
            clearTimeout(timeout);
            return resolve(null);
          }
          const req = indexedDB.open(IDB_NAME, 1);
          req.onblocked = () => {
            clearTimeout(timeout);
            resolve(null);
          };
          req.onerror = () => {
            clearTimeout(timeout);
            resolve(null);
          };
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE, { keyPath: 'id' });
            }
          };
          req.onsuccess = () => {
            try {
              const db = req.result;
              const tx = db.transaction(IDB_STORE, 'readonly');
              tx.onerror = () => { clearTimeout(timeout); resolve(null); };
              tx.onabort = () => { clearTimeout(timeout); resolve(null); };
              const store = tx.objectStore(IDB_STORE);
              const getReq = store.get(filename.toLowerCase());
              getReq.onsuccess = () => {
                clearTimeout(timeout);
                if (getReq.result && getReq.result.data) {
                  const data = getReq.result.data;
                  const u8 = new Uint8Array(data);
                  if (u8.length > 5000 && u8[0] === 0x50 && u8[1] === 0x4B) {
                    console.log(`[Player IDB] ROM ${filename} trouvée en cache local (${getReq.result.size} octets)`);
                    return resolve(data);
                  }
                }
                resolve(null);
              };
              getReq.onerror = () => { clearTimeout(timeout); resolve(null); };
            } catch (err) {
              clearTimeout(timeout);
              resolve(null);
            }
          };
        } catch (e) {
          clearTimeout(timeout);
          resolve(null);
        }
      });
    }

    function saveRomToIDB(filename, buffer) {
      try {
        const u8 = new Uint8Array(buffer.buffer || buffer);
        // Ne jamais sauvegarder du HTML ou des fichiers invalides
        if (u8.length < 5000 || u8[0] !== 0x50 || u8[1] !== 0x4B) {
          console.warn(`[Player IDB] Refus de sauvegarder ${filename}: buffer non-ZIP invalide`);
          return;
        }

        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => {
          const db = req.result;
          const tx = db.transaction(IDB_STORE, 'readwrite');
          const store = tx.objectStore(IDB_STORE);
          const arrayBuffer = buffer.buffer ? buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength) : buffer;
          store.put({
            id: filename.toLowerCase(),
            filename: filename.toLowerCase(),
            data: arrayBuffer,
            size: arrayBuffer.byteLength,
            savedAt: Date.now()
          });
          console.log(`[Player IDB] ROM ${filename} enregistrée dans le stockage local IndexedDB !`);
        };
      } catch(e) {}
    }

    // Fonction de téléchargement résiliente avec streaming et barre de progression (poids en Mo et pourcentage)
    async function fetchBinaryWithProgress(name, candidates, onProgressText) {
      let lastErr = null;
      const dlBox = document.getElementById('dl-progress-box');
      const dlSize = document.getElementById('dl-progress-size');
      const dlPercent = document.getElementById('dl-progress-percent');
      const dlFill = document.getElementById('dl-progress-fill');

      if (dlBox) {
        dlBox.style.display = 'flex';
        dlFill.style.width = '0%';
        dlPercent.innerText = '0%';
        dlSize.innerText = 'Connexion...';
      }

      for (const url of candidates) {
        try {
          if (onProgressText) {
            loadingDesc.innerText = onProgressText + ` (${url.startsWith('http') ? 'Cloud' : (url.includes('proxy') ? 'Serveur Cloud' : (url.includes('archive') ? 'Archive.org' : 'Local'))})...`;
          }

          const res = await fetch(url);
          if (!res.ok) {
            console.warn(`[CSW-Arcade] Source ${url} a répondu avec statut: ${res.status}`);
            continue;
          }

          const contentType = res.headers.get('content-type') || '';
          // Rejet des redirections SPA Netlify (pages HTML au lieu d'archives)
          if (contentType.includes('text/html')) {
            console.warn(`[CSW-Arcade] ${url} a retourné du HTML (redirection SPA Netlify 404 ignorée)`);
            continue;
          }

          const contentLengthHeader = res.headers.get('content-length');
          const totalBytes = contentLengthHeader ? parseInt(contentLengthHeader, 10) : 0;
          const totalMB = totalBytes > 0 ? (totalBytes / (1024 * 1024)).toFixed(1) : null;

          if (dlBox) {
            dlBox.style.display = 'flex';
            dlSize.innerText = totalMB ? `0.0 MB / ${totalMB} MB` : `0.0 MB`;
          }

          const reader = res.body ? res.body.getReader() : null;
          let receivedBytes = 0;
          let chunks = [];

          if (reader) {
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              receivedBytes += value.length;

              const receivedMB = (receivedBytes / (1024 * 1024)).toFixed(1);
              if (totalBytes > 0) {
                const percent = Math.min(100, Math.round((receivedBytes / totalBytes) * 100));
                if (dlFill) dlFill.style.width = `${percent}%`;
                if (dlPercent) dlPercent.innerText = `${percent}%`;
                if (dlSize) dlSize.innerText = `${receivedMB} MB / ${totalMB} MB`;
              } else {
                if (dlSize) dlSize.innerText = `${receivedMB} MB`;
                if (dlPercent) dlPercent.innerText = `...`;
              }
            }
          } else {
            const buf = await res.arrayBuffer();
            const u8 = new Uint8Array(buf);
            chunks = [u8];
            receivedBytes = u8.length;
          }

          const merged = new Uint8Array(receivedBytes);
          let offset = 0;
          for (const chunk of chunks) {
            merged.set(chunk, offset);
            offset += chunk.length;
          }

          if (dlFill) dlFill.style.width = '100%';
          if (dlPercent) dlPercent.innerText = '100%';
          if (dlSize && totalMB) dlSize.innerText = `${totalMB} MB / ${totalMB} MB`;

          // Vérification du Header magique ZIP 'PK' (0x50, 0x4B)
          if (merged.length < 5000 || merged[0] !== 0x50 || merged[1] !== 0x4B) {
            console.warn(`[CSW-Arcade] ${url} n'est pas une archive ZIP valide (en-tête invalide)`);
            continue;
          }

          console.log(`[CSW-Arcade] ${name} chargé avec succès (${(receivedBytes / (1024 * 1024)).toFixed(2)} MB) depuis: ${url}`);
          setTimeout(() => { if (dlBox) dlBox.style.display = 'none'; }, 400);
          return merged.buffer;
        } catch (e) {
          lastErr = e;
          console.warn(`[CSW-Arcade] Échec source ${url} pour ${name}:`, e.message);
        }
      }

      if (dlBox) dlBox.style.display = 'none';
      throw new Error(`Impossible de charger ${name}. ${lastErr ? '(' + lastErr.message + ')' : ''}`);
    }

          romBuffer = await fetchBinaryWithProgress(`ROM ${targetZipName}`, romCandidates, `Téléchargement de ${fbneoShortName.toUpperCase()}`);

    function startEmulatorJS() {
      const initialVol = activeSettings.audio?.muted ? 0 : ((activeSettings.audio?.volume ?? 85) / 100);

      // Optimisation basse consommation & faible latence pour Canvas GPU mobile
      const _origGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function(type, attributes) {
        if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
          attributes = Object.assign({}, attributes, {
            powerPreference: 'low-power',
            desynchronized: true,
            alpha: false,
            antialias: false,
            preserveDrawingBuffer: false
          });
        }
        return _origGetContext.call(this, type, attributes);
      };

      // 1. Interception transparente de fetch pour servir romBytes et neogeoBytes directement en mémoire
      const _origFetch = window.fetch;
      window.fetch = async function(input, init) {
        const url = (typeof input === 'string' ? input : (input?.url || '')).toLowerCase();

        if (romBytes && (url.includes(targetZipName.toLowerCase()) || url.includes(fbneoShortName.toLowerCase()))) {
          console.log('[Fetch Interceptor] Service direct en mémoire pour la ROM:', targetZipName);
          const buf = romBytes.buffer.slice(romBytes.byteOffset, romBytes.byteOffset + romBytes.byteLength);
          return new Response(buf, {
            status: 200,
            statusText: 'OK',
            headers: {
              'Content-Type': 'application/zip',
              'Content-Length': String(romBytes.byteLength)
            }
          });
        }

        if (neogeoBytes && url.includes('neogeo.zip')) {
          console.log('[Fetch Interceptor] Service direct en mémoire pour le BIOS: neogeo.zip');
          const buf = neogeoBytes.buffer.slice(neogeoBytes.byteOffset, neogeoBytes.byteOffset + neogeoBytes.byteLength);
          return new Response(buf, {
            status: 200,
            statusText: 'OK',
            headers: {
              'Content-Type': 'application/zip',
              'Content-Length': String(neogeoBytes.byteLength)
            }
          });
        }

        return _origFetch.apply(window, arguments);
      };

      // 2. Interception transparente de XHR comme secours avec support complet des en-têtes
      const _origXHROpen = XMLHttpRequest.prototype.open;
      const _origXHRSend = XMLHttpRequest.prototype.send;

      XMLHttpRequest.prototype.open = function(method, url, ...rest) {
        this._reqUrl = url ? String(url) : '';
        return _origXHROpen.apply(this, [method, url, ...rest]);
      };

      XMLHttpRequest.prototype.send = function(...args) {
        const url = (this._reqUrl || '').toLowerCase();

        if (romBytes && (url.includes(targetZipName.toLowerCase()) || url.includes(fbneoShortName.toLowerCase()))) {
          console.log('[XHR Interceptor] Service direct en mémoire pour la ROM:', targetZipName);
          const buf = romBytes.buffer.slice(romBytes.byteOffset, romBytes.byteOffset + romBytes.byteLength);
          Object.defineProperty(this, 'status', { get: () => 200 });
          Object.defineProperty(this, 'statusText', { get: () => 'OK' });
          Object.defineProperty(this, 'response', { get: () => buf });
          Object.defineProperty(this, 'readyState', { get: () => 4 });
          this.getResponseHeader = (header) => {
            if (header && header.toLowerCase() === 'content-length') return String(buf.byteLength);
            if (header && header.toLowerCase() === 'content-type') return 'application/zip';
            return null;
          };
          this.getAllResponseHeaders = () => 'content-type: application/zip\r\ncontent-length: ' + buf.byteLength + '\r\n';
          setTimeout(() => {
            if (typeof this.onreadystatechange === 'function') this.onreadystatechange();
            if (typeof this.onload === 'function') this.onload();
            this.dispatchEvent(new Event('load'));
            this.dispatchEvent(new Event('loadend'));
          }, 5);
          return;
        }

        if (neogeoBytes && url.includes('neogeo.zip')) {
          console.log('[XHR Interceptor] Service direct en mémoire pour le BIOS: neogeo.zip');
          const buf = neogeoBytes.buffer.slice(neogeoBytes.byteOffset, neogeoBytes.byteOffset + neogeoBytes.byteLength);
          Object.defineProperty(this, 'status', { get: () => 200 });
          Object.defineProperty(this, 'statusText', { get: () => 'OK' });
          Object.defineProperty(this, 'response', { get: () => buf });
          Object.defineProperty(this, 'readyState', { get: () => 4 });
          this.getResponseHeader = (header) => {
            if (header && header.toLowerCase() === 'content-length') return String(buf.byteLength);
            if (header && header.toLowerCase() === 'content-type') return 'application/zip';
            return null;
          };
          this.getAllResponseHeaders = () => 'content-type: application/zip\r\ncontent-length: ' + buf.byteLength + '\r\n';
          setTimeout(() => {
            if (typeof this.onreadystatechange === 'function') this.onreadystatechange();
            if (typeof this.onload === 'function') this.onload();
            this.dispatchEvent(new Event('load'));
            this.dispatchEvent(new Event('loadend'));
          }, 5);

              stateSamples.push(u8);
            }
          }

          const stateSize = stateSamples[0].byteLength;
          const avgSaveTime = stateTimes.reduce((a, b) => a + b, 0) / stateTimes.length;
          const minSaveTime = Math.min(...stateTimes);
          const maxSaveTime = Math.max(...stateTimes);

          };

          const baseSnapshot = stateSamples[0];

            loadTimes.push(t1 - t0);

          const avgLoadTime = loadTimes.reduce((a, b) => a + b, 0) / loadTimes.length;
          const minLoadTime = Math.min(...loadTimes);
          const maxLoadTime = Math.max(...loadTimes);

          res.tests.loadTimeMs = {
            avg: parseFloat(avgLoadTime.toFixed(3)),
            min: parseFloat(minLoadTime.toFixed(3)),
            max: parseFloat(maxLoadTime.toFixed(3))

          updateBenchMsg('[3/5] Test absolu de DÉTERMINISME (S0 -> 60 frames -> Restore S0 -> 60 frames -> Checksum)...');

          const S_run1 = S_run1_raw instanceof Uint8Array ? S_run1_raw.slice() : new Uint8Array(S_run1_raw);

              uint8 = new Uint8Array(Object.values(event.data.state));
            }

            if (uint8 && window.EJS_emulator?.gameManager?.loadState) {
              window.EJS_emulator.gameManager.loadState(uint8);
              if (!event.data.isHeartbeat) {
                console.log('[Player] ✓ Savestate initial chargé avec succès ! État 100% synchronisé avec l\'hôte.');
                if (typeof window.EJS_emulator.play === 'function') window.EJS_emulator.play();
              }
            }
          } catch(err) {
            console.warn('[Player] Erreur restauration savestate:', err);
          }
        }
        if (event.data.type === 'SET_PLAYER_INDEX') {
          assignedPlayerIndex = event.data.playerIndex ?? 0;
          rebuildKeyMap(activeSettings.controls);
          console.log(`[Player] Index joueur assigné mis à jour: J${assignedPlayerIndex + 1}`);
        }
        if (event.data.type === 'NETPLAY_BINARY_PACKET' && event.data.buffer) {
          if (window.__csw_rollback_engine) {
            window.__csw_rollback_engine.handleIncomingBinary(event.data.buffer);
          }
        }
        if (event.data.type === 'APP_VISIBILITY') {
          const isVis = !!event.data.visible;
          if (window.EJS_emulator) {
            try {
              if (isVis) {
                if (typeof window.EJS_emulator.play === 'function') window.EJS_emulator.play();
                if (window.EJS_emulator.audioContext && typeof window.EJS_emulator.audioContext.resume === 'function') {
                  window.EJS_emulator.audioContext.resume();
                }
              } else {
                if (typeof window.EJS_emulator.pause === 'function') window.EJS_emulator.pause();
                if (window.EJS_emulator.audioContext && typeof window.EJS_emulator.audioContext.suspend === 'function') {
                  window.EJS_emulator.audioContext.suspend();
                }
              }
            } catch(e) {}
          }
        }
      });

      // ======================================================================
      // MOTEUR OFFICIEL CSW-ARCADE : ROLLBACK NETCODE GGPO DÉTERMINISTE (60 FPS)
      // ======================================================================
      class PlayerRollbackEngine {
        constructor() {
          this.BUFFER_SIZE = 128;
          this.BUFFER_MASK = 127;
          this.MAX_ROLLBACK = 15;
          this.FRAME_TIME = 1000 / 60;

          this.currentFrame = 0;
          this.remoteFrameAdvancement = 0;
          this.seq = 0;
          this.isRunning = false;

          this.p1Mask = 0;
          this.p2Mask = 0;

          this.localInputs = new Uint16Array(this.BUFFER_SIZE);
          this.remoteInputs = new Uint16Array(this.BUFFER_SIZE);
          this.remotePredicted = new Uint8Array(this.BUFFER_SIZE);
          this.remoteFrameNums = new Int32Array(this.BUFFER_SIZE).fill(-1);
          this.localHistory = [0, 0, 0];

          this.stateSize = 414144;
          this.savestates = new Array(this.BUFFER_SIZE);
          this.incomingQueue = [];

          this.stats = {
            fps: 60,
            currentFrame: 0,
            totalRollbacks: 0,
            lastRollbackDistance: 0,
            mispredictions: 0,
            predictedFramesCount: 0,
            frameAdvantage: 0
          };
          this.fpsCount = 0;
          this.lastFpsTimer = 0;

          this.gm = null;
          this.module = null;
          this.originalMainLoopFunc = null;
          this.hookAttached = false;
        }

        init() {
          this.gm = window.EJS_emulator?.gameManager;
          this.module = this.gm?.Module || window.EJS_emulator?.Module;
          if (!this.gm || !this.module) {
            console.warn('[Rollback] gameManager ou Module absent');
            return false;
          }

          try {
            if (this.gm.functions?.saveStateInfo) {
              const info = this.gm.functions.saveStateInfo().split('|');
              if (info[2] === '1') {
                this.stateSize = parseInt(info[0], 10) || this.stateSize;
              }
            }
          } catch(e) {}

          for (let i = 0; i < this.BUFFER_SIZE; i++) {
            this.savestates[i] = new Uint8Array(this.stateSize);
          }

          this.captureSnapshot(0);
          console.log('[Rollback Engine] ✓ Initialisé avec succès (Ring Buffer 128 frames préalloué)');
          return true;
        }

        captureSnapshot(frame) {
          if (!this.gm?.functions?.saveStateInfo) return;
          try {
            const info = this.gm.functions.saveStateInfo().split('|');
            if (info[2] === '1') {
              const len = parseInt(info[0], 10);
              const offset = parseInt(info[1], 10);
              const heap = this.module?.HEAPU8;
              if (heap && len <= this.stateSize) {
                this.savestates[frame & this.BUFFER_MASK].set(heap.subarray(offset, offset + len));
              }
            }
          } catch(e) {}
        }

        restoreSnapshot(frame) {
          if (!this.gm?.FS || !this.gm?.functions?.loadState) return;
          const snap = this.savestates[frame & this.BUFFER_MASK];
          if (!snap) return;
          try {
            this.gm.FS.writeFile('/game.state', snap);
            this.gm.functions.loadState('game.state', 0);
          } catch(e) {}
        }

        setPlayerButton(player, buttonId, isDown) {
          if (buttonId < 0 || buttonId > 15) return;
          if (player === 0) {
            if (isDown) this.p1Mask |= (1 << buttonId);
            else this.p1Mask &= ~(1 << buttonId);
          } else {
            if (isDown) this.p2Mask |= (1 << buttonId);
            else this.p2Mask &= ~(1 << buttonId);
          }
        }

        applyInputs(pIdx, mask) {
          const sim = this.gm?.functions?.simulateInput || this.gm?.simulateInput;
          if (typeof sim !== 'function') return;
          const btns = [0, 8, 1, 9, 2, 3, 4, 5, 6, 7];
          for (let i = 0; i < btns.length; i++) {
            const b = btns[i];
            const val = (mask & (1 << b)) ? 1 : 0;
            sim.call(this.gm?.functions || this.gm, pIdx, b, val);
          }
          // Pour la pièce (button 2 = COIN), garantir l'injection sur slot 0 pour le monnayeur arcade partagé
          if (pIdx !== 0 && (mask & (1 << 2))) {
            sim.call(this.gm?.functions || this.gm, 0, 2, 1);
          }
        }

        send0x5APacket(frame, currentMask) {
          this.seq = (this.seq + 1) & 0xFFFF;
          const h1 = this.localHistory[0] || 0;
          const h2 = this.localHistory[1] || 0;
          const h3 = this.localHistory[2] || 0;

          const buf = new ArrayBuffer(15);
          const view = new DataView(buf);
          view.setUint8(0, 0x5A);
          view.setUint16(1, this.seq, false);
          view.setUint32(3, frame, false);
          view.setUint16(7, currentMask, false);
          view.setUint16(9, h1, false);
          view.setUint16(11, h2, false);
          view.setUint16(13, h3, false);

          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'NETPLAY_BINARY_PACKET', buffer: buf }, '*');
          }

          this.localHistory[2] = h2;
          this.localHistory[1] = h1;
          this.localHistory[0] = currentMask;
        }

        sendChecksumPacket(frame) {
          const heap = this.module?.HEAPU8;
          const baseOffset = 0x100000;
          if (!heap || heap.length < baseOffset + 0x10000) return;
          let hash = 0x811c9dc5;
          for (let i = 0; i < 0x10000; i++) {
            hash ^= heap[baseOffset + i];
            hash = Math.imul(hash, 0x01000193);
          }
          const checksumInt = hash >>> 0;
          const buf = new ArrayBuffer(9);
          const view = new DataView(buf);
          view.setUint8(0, 0xCB);
          view.setUint32(1, frame, false);
          view.setUint32(5, checksumInt, false);

          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'NETPLAY_BINARY_PACKET', buffer: buf }, '*');
          }
        }

        handleIncomingBinary(buffer) {
          if (!buffer || buffer.byteLength < 1) return;
          const view = new DataView(buffer);
          const magic = view.getUint8(0);

          if (magic === 0x5A && view.byteLength >= 15) {
            const seq = view.getUint16(1, false);
            const frame = view.getUint32(3, false);
            const curMask = view.getUint16(7, false);
            const h1 = view.getUint16(9, false);
            const h2 = view.getUint16(11, false);
            const h3 = view.getUint16(13, false);

            this.incomingQueue.push({
              frame,
              inputs: [
                { f: frame, mask: curMask },
                { f: frame - 1, mask: h1 },
                { f: frame - 2, mask: h2 },
                { f: frame - 3, mask: h3 }
              ]
            });
          }
        }

        processIncomingInputs() {
          if (this.incomingQueue.length === 0) return;
          let earliestMispredicted = -1;

          while (this.incomingQueue.length > 0) {
            const pkt = this.incomingQueue.shift();
            if (pkt.frame > this.remoteFrameAdvancement) {
              this.remoteFrameAdvancement = pkt.frame;
            }

            for (const item of pkt.inputs) {
              const { f, mask } = item;
              if (f < 0) continue;
              const rIdx = f & this.BUFFER_MASK;

              if (f < this.currentFrame) {
                const delta = this.currentFrame - f;
                if (delta <= this.MAX_ROLLBACK) {
                  const pred = this.remoteInputs[rIdx];
                  const wasPred = this.remotePredicted[rIdx] === 1;
                  if (wasPred) {
                    this.remoteInputs[rIdx] = mask;
                    this.remotePredicted[rIdx] = 0;
                    if (pred !== mask) {
                      this.stats.mispredictions++;
                      if (earliestMispredicted === -1 || f < earliestMispredicted) {
                        earliestMispredicted = f;
                      }
                    }
                  }
                }
              } else {
                this.remoteInputs[rIdx] = mask;
                this.remotePredicted[rIdx] = 0;
                this.remoteFrameNums[rIdx] = f;
                if (f === this.currentFrame) {
                  if (assignedPlayerIndex === 0) this.p2Mask = mask;
                  else this.p1Mask = mask;
                }
              }
            }
          }

          if (earliestMispredicted !== -1) {
            this.executeRollback(earliestMispredicted);
          }
        }

        executeRollback(rollbackFrame) {
          const dist = this.currentFrame - rollbackFrame;
          if (dist <= 0 || dist > this.MAX_ROLLBACK) return;

          this.stats.totalRollbacks++;
          this.stats.lastRollbackDistance = dist;

          const wasMuted = !!window.EJS_emulator?.muted;
          if (!wasMuted && window.EJS_emulator) window.EJS_emulator.muted = true;

          this.restoreSnapshot(rollbackFrame);

          for (let f = rollbackFrame; f < this.currentFrame; f++) {
            const rIdx = f & this.BUFFER_MASK;
            if (this.remotePredicted[rIdx] === 1) {
              this.remoteInputs[rIdx] = this.remoteInputs[(f - 1) & this.BUFFER_MASK];
            }
            const p1 = (assignedPlayerIndex === 0) ? this.localInputs[rIdx] : this.remoteInputs[rIdx];
            const p2 = (assignedPlayerIndex === 0) ? this.remoteInputs[rIdx] : this.localInputs[rIdx];
            this.applyInputs(0, p1);
            this.applyInputs(1, p2);

            if (this.originalMainLoopFunc) {
              this.originalMainLoopFunc();
            }
            this.captureSnapshot(f + 1);
          }

          if (!wasMuted && window.EJS_emulator) window.EJS_emulator.muted = false;
        }

        onFrame() {
          // 1. Dépouiller les paquets réseau reçus et exécuter rollback si nécessaire
          this.processIncomingInputs();

          const frame = this.currentFrame;
          const rIdx = frame & this.BUFFER_MASK;

          // 2. Échantillonner les inputs locaux physiques (0 ms d'input lag)
          const localMask = (assignedPlayerIndex === 0) ? this.p1Mask : this.p2Mask;
          this.localInputs[rIdx] = localMask;

          // 3. Envoyer le paquet 0x5A avec redondance N, N-1, N-2, N-3
          this.send0x5APacket(frame, localMask);

          // 4. Déterminer l'input distant (Reçu ou Prédit)
          let remoteMask = 0;
          if (this.remotePredicted[rIdx] === 0 && this.remoteFrameNums[rIdx] === frame) {
            remoteMask = this.remoteInputs[rIdx];
          } else {
            const prevIdx = (frame - 1) & this.BUFFER_MASK;
            remoteMask = frame > 0 ? this.remoteInputs[prevIdx] : ((assignedPlayerIndex === 0) ? this.p2Mask : this.p1Mask);
            this.remoteInputs[rIdx] = remoteMask;
            this.remotePredicted[rIdx] = 1;
            this.stats.predictedFramesCount++;
          }

          // Mettre à jour le masque du joueur distant
          if (assignedPlayerIndex === 0) {
            this.p2Mask = remoteMask;
          } else {
            this.p1Mask = remoteMask;
          }

          // 5. Sauvegarder l'état avant d'exécuter la frame
          this.captureSnapshot(frame);

          // 6. Injecter les inputs dans FBNeo pour J1 et J2
          this.applyInputs(0, this.p1Mask);
          this.applyInputs(1, this.p2Mask);

          // 7. Exécuter la frame originale FBNeo (CPU + Audio + Rendu WebGL)
          if (this.originalMainLoopFunc) {
            this.originalMainLoopFunc();
          }

          // 8. Checksum Work RAM 68000 toutes les 30 frames
          if (frame % 30 === 0) {
            this.sendChecksumPacket(frame);
          }

          this.currentFrame++;
          this.stats.currentFrame = this.currentFrame;
          this.fpsCount++;

          const now = performance.now();
          if (now - this.lastFpsTimer >= 500) {
            this.stats.fps = Math.round((this.fpsCount * 1000) / (now - this.lastFpsTimer));
            this.fpsCount = 0;
            this.lastFpsTimer = now;
            this.stats.frameAdvantage = this.currentFrame - this.remoteFrameAdvancement;

            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: 'ROLLBACK_TELEMETRY',
                stats: { ...this.stats }
              }, '*');
            }
          }
        }

        start() {
          if (this.isRunning) return;
          this.init();
          this.isRunning = true;
          this.lastFpsTimer = performance.now();

          const attachHook = () => {
            const ml = this.module?.Browser?.mainLoop;
            if (ml && typeof ml.func === 'function' && !this.hookAttached) {
              this.originalMainLoopFunc = ml.func;
              const self = this;
              ml.func = function() {
                if (self.isRunning) {
                  self.onFrame();
                } else if (self.originalMainLoopFunc) {
                  self.originalMainLoopFunc.apply(this, arguments);
                }
              };
              this.hookAttached = true;
              console.log('[Rollback Engine] ✓ Hook GGPO attaché sur Module.Browser.mainLoop.func (60 FPS synchronisé !)');
              return true;
            }
            return false;
          };

          if (!attachHook()) {
            const checkInterval = setInterval(() => {
              if (attachHook()) clearInterval(checkInterval);
            }, 30);
          }
        }

        stop() {
          this.isRunning = false;
        }
      }

      if (isNetplay) {
        window.__csw_rollback_engine = new PlayerRollbackEngine();
        console.log('[Player Netplay] Moteur Rollback instancié et préparé pour la Frame 0.');
      }

      // Déverrouillage automatique de l'audio mobile dès le premier toucher
      const unlockAudio = () => {
        try {
          if (window.EJS_emulator?.audioContext && window.EJS_emulator.audioContext.state === 'suspended') {
            window.EJS_emulator.audioContext.resume();
          }
        } catch(e) {}
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('click', unlockAudio);
      };
      window.addEventListener('touchstart', unlockAudio, { passive: true });
      window.addEventListener('click', unlockAudio, { passive: true });

      // Mise en veille instantanée dès que l'écran du smartphone est verrouillé (0% batterie en veille)
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          try {
            if (typeof window.EJS_emulator?.pause === 'function') window.EJS_emulator.pause();
            if (window.EJS_emulator?.audioContext && typeof window.EJS_emulator.audioContext.suspend === 'function') {
              window.EJS_emulator.audioContext.suspend();
            }
          } catch(e) {}
        } else {
          try {
            if (typeof window.EJS_emulator?.play === 'function') window.EJS_emulator.play();
            if (window.EJS_emulator?.audioContext && typeof window.EJS_emulator.audioContext.resume === 'function') {
              window.EJS_emulator.audioContext.resume();
            }
          } catch(e) {}
        }
      });

      const s = document.createElement('script');
      s.src = 'emulatorjs/loader.js';
      s.async = true;
      s.onerror = (e) => {
        console.error('[Player] Erreur chargement local loader.js', e);
        errorMsg.style.display = 'block';
        errorMsg.innerText = 'Erreur: Impossible de charger le moteur WebAssembly local (emulatorjs/loader.js).';
      };
      document.body.appendChild(s);
    }

    // Déclencher le préchargement
    preloadAssetsAndBoot();
  </script>
