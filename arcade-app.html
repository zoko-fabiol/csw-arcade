<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: https://cdn.emulatorjs.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.emulatorjs.org; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss: https: http: data: blob:; img-src 'self' data: blob: https:; worker-src 'self' blob: https://cdn.emulatorjs.org; frame-src 'self' blob: data: https://cdn.emulatorjs.org;"
    />
    <title>CSW-ARCADE — Moteur Neo Geo</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <script>
      if (!window.electronAPI && window.parent && window.parent !== window && window.parent.electronAPI) {
        window.electronAPI = window.parent.electronAPI;
      }
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || !event.data) return;
        if (event.data.type === 'CSW_SHELL_TOGGLE_SIDEBAR') {
          const btn = document.querySelector('button[aria-label="Menu"]');
          if (btn) btn.click();
        }
      });
    </script>
    <style>
      html, body, #root { height: 100%; background: #0a0a0a; }
    </style>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
