<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: https://cdn.emulatorjs.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.emulatorjs.org; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss: https: http: data: blob:; img-src 'self' data: blob: https:; worker-src 'self' blob: https://cdn.emulatorjs.org; frame-src 'self' blob: data: https://cdn.emulatorjs.org;"
    />
    <script>
      // Nettoyage immédiat de tout ancien Service Worker fantôme présent sur ce port localhost
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister();
            console.log('[CSW-Arcade] Ancien Service Worker orphelin purgé avec succès');
          }
        });
      }
    </script>
    <title>CSW-ARCADE</title>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
